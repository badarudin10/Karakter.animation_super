<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BiipBattle Arena - Pikachu Sprite</title>
  <style>
    body {
      margin: 0; padding: 0; background: #060914; color: white; font-family: sans-serif;
      overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh;
    }
    #game-container {
      position: relative; width: 100%; max-width: 800px; margin-top: 20px;
    }
    canvas {
      background: linear-gradient(to bottom, #1a2a42, #0d1626);
      border: 2px solid #56e9ff; border-radius: 12px;
      box-shadow: 0 0 20px rgba(86,233,255,0.2); width: 100%; display: block;
    }
    .hud { position: absolute; top: 15px; right: 20px; text-align: right; }
    .hp-bar-bg {
      width: 150px; height: 15px; background: rgba(255,0,0,0.3); border: 2px solid white; border-radius: 8px; overflow: hidden;
    }
    .hp-bar-fill { width: 100%; height: 100%; background: #64e6a4; transition: width 0.2s; }
    .controls {
      display: flex; justify-content: space-between; width: 100%; max-width: 800px;
      padding: 20px; box-sizing: border-box; flex: 1; align-items: flex-end; padding-bottom: 40px;
    }
    .d-pad, .action-pad { display: flex; gap: 10px; }
    .btn {
      width: 60px; height: 60px; background: rgba(86,233,255,0.2); border: 2px solid #56e9ff;
      border-radius: 50%; color: #56e9ff; font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation;
    }
    .btn:active { background: #56e9ff; color: #000; transform: scale(0.9); }
  </style>
</head>
<body>

  <h2>BIIPBATTLE // TRAINING ARENA</h2>
  <p style="font-size: 12px; color: #8c9ab3; margin-top: -10px;">Keyboard: Panah Kiri/Kanan, Panah Atas (Lompat), Spasi (Serang)</p>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="hud">
      <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">BOSS HP</div>
      <div class="hp-bar-bg"><div id="enemy-hp" class="hp-bar-fill"></div></div>
    </div>
  </div>

  <div class="controls">
    <div class="d-pad">
      <div class="btn" id="btn-left">◁</div>
      <div class="btn" id="btn-right">▷</div>
    </div>
    <div class="action-pad">
      <div class="btn" id="btn-jump">△</div>
      <div class="btn" style="border-radius: 12px; width: 80px;" id="btn-attack">ATK</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 1. MUAT GAMBAR SPRITE SHEET DENGAN PATH YANG BENAR
    const spritePikachu = new Image();
    spritePikachu.src = 'assets/pikachu-spritesheet.png'; 

    const GRAVITY = 0.6;
    const FLOOR_Y = 350;

    const keys = { left: false, right: false, jump: false, attack: false };

    // 2. SETUP PROPERTI PEMAIN & ANIMASI
    const player = {
      x: 100, y: 200, 
      width: 100, height: 100, // Ukuran render karakter di game
      velocityX: 0, velocityY: 0, speed: 6, jumpPower: -12,
      isGrounded: false, facingRight: true, cooldown: 0,
      
      // Properti Sprite
      frameX: 0,        // Kolom saat ini (0-5)
      frameY: 0,        // Baris saat ini (0, 1, atau 2)
      maxFrame: 5,      // Karena ada 6 kolom, hitungan dimulai dari 0 sampai 5
      staggerFrames: 6, // Kecepatan animasi (semakin kecil semakin cepat)
      gameFrame: 0
    };

    const enemy = { x: 600, y: FLOOR_Y - 80, width: 60, height: 80, color: '#ff6b81', hp: 100, maxHp: 100, flashTimer: 0 };
    const projectiles = [];

    // Input Keyboard
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'ArrowUp') keys.jump = true;
      if (e.code === 'Space') keys.attack = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'ArrowUp') keys.jump = false;
      if (e.code === 'Space') keys.attack = false;
    });

    // Input Sentuh
    function bindTouch(id, keyName) {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    }
    bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'jump'); bindTouch('btn-attack', 'attack');

    function update() {
      // Pergerakan Kiri/Kanan
      if (keys.left) { player.velocityX = -player.speed; player.facingRight = false; }
      else if (keys.right) { player.velocityX = player.speed; player.facingRight = true; }
      else { player.velocityX = 0; }

      // Lompat
      if (keys.jump && player.isGrounded) { player.velocityY = player.jumpPower; player.isGrounded = false; }

      // Gravitasi & Posisi
      player.velocityY += GRAVITY;
      player.x += player.velocityX;
      player.y += player.velocityY;

      if (player.y + player.height >= FLOOR_Y) {
        player.y = FLOOR_Y - player.height; player.velocityY = 0; player.isGrounded = true;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Logika Menyerang & Menembak
      if (player.cooldown > 0) player.cooldown--;
      if (keys.attack && player.cooldown === 0) {
        projectiles.push({
          x: player.facingRight ? player.x + player.width - 20 : player.x,
          y: player.y + 30, width: 25, height: 15, speedX: player.facingRight ? 12 : -12, color: '#ffeb3b'
        });
        player.cooldown = 20; // Jeda peluru
      }

      // --- 3. PENGATURAN STATE ANIMASI SPRITE ---
      if (keys.attack) {
        player.frameY = 2; // Baris ke-3: Menyerang
      } else if (!player.isGrounded) {
        player.frameY = 1; // Lompat pakai baris ke-2 (Lari)
        player.frameX = 3; // Kunci di frame tertentu saat melayang
      } else if (keys.left || keys.right) {
        player.frameY = 1; // Baris ke-2: Berlari
      } else {
        player.frameY = 0; // Baris ke-1: Idle (Diam)
      }

      // Penghitung Loop Animasi
      if (player.isGrounded || keys.attack) { 
        if (player.gameFrame % player.staggerFrames === 0) {
          if (player.frameX < player.maxFrame) player.frameX++;
          else player.frameX = 0;
        }
      }
      player.gameFrame++;

      // Logika Tembakan & Tabrakan Musuh
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.speedX;
        if (p.x < enemy.x + enemy.width && p.x + p.width > enemy.x && p.y < enemy.y + enemy.height && p.y + p.height > enemy.y) {
            enemy.hp -= 5; enemy.flashTimer = 10; projectiles.splice(i, 1);
            document.getElementById('enemy-hp').style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + '%';
            if (enemy.hp <= 0) { enemy.hp = enemy.maxHp; enemy.x = Math.random() * (canvas.width - 200) + 100; }
            continue;
        }
        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
      }
      if (enemy.flashTimer > 0) enemy.flashTimer--;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Gambar Lantai
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
      ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(canvas.width, FLOOR_Y);
      ctx.strokeStyle = 'rgba(86,233,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();

      // Gambar Musuh
      ctx.fillStyle = enemy.flashTimer > 0 ? 'white' : enemy.color;
      ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

      // --- 4. RENDER GAMBAR SPRITESHEET ---
      if (spritePikachu.complete && spritePikachu.naturalHeight !== 0) { // Pastikan gambar sudah termuat
        
        // Hitung otomatis lebar dan tinggi 1 kotak frame dari file gambar asli
        const frameW = spritePikachu.width / 6;  // Ada 6 kolom
        const frameH = spritePikachu.height / 3; // Ada 3 baris
        
        ctx.save();
        
        if (!player.facingRight) {
          // Membalikkan gambar ke kiri jika berjalan ke kiri
          ctx.translate(player.x + player.width, player.y);
          ctx.scale(-1, 1);
          ctx.drawImage(
            spritePikachu, 
            player.frameX * frameW, player.frameY * frameH, frameW, frameH, 
            0, 0, player.width, player.height
          );
        } else {
          // Menghadap ke kanan normal
          ctx.drawImage(
            spritePikachu, 
            player.frameX * frameW, player.frameY * frameH, frameW, frameH, 
            player.x, player.y, player.width, player.height
          );
        }
        
        ctx.restore();
      } else {
        // Fallback (Kotak Merah Muda) jika gambar gagal dimuat atau salah nama
        ctx.fillStyle = 'pink'; ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // Gambar Proyektil (Bola Energi/Listrik)
      for (let p of projectiles) {
        ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
        ctx.beginPath(); ctx.arc(p.x + p.width/2, p.y + p.height/2, p.height, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    gameLoop();
  </script>
</body>
</html>
