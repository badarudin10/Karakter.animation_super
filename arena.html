<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIIPBATTLE // CINEMATIC ARENA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  body { background: #050508; font-family: 'Inter', system-ui, sans-serif; color: #fff; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #gc { relative; width: 100%; height: 100%; max-width: 1200px; max-height: 675px; aspect-ratio: 16/9; background: #000; box-shadow: 0 0 50px rgba(0,0,0,0.8); overflow: hidden; position: relative; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  
  /* UI Overlay */
  .hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .p-card { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .p-card.r { align-items: flex-end; text-align: right; }
  .p-name { font-size: 16px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  .bar-bg { width: 100%; height: 18px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; position: relative; backdrop-filter: blur(4px); }
  .bar-fill { height: 100%; width: 100%; transition: width 0.1s ease-out; }
  .bar-fill.hp-p { background: linear-gradient(90deg, #ff4757, #ff6b81); }
  .bar-fill.hp-e { background: linear-gradient(90deg, #ff6b81, #ff4757); }
  .bar-fill.lag { position: absolute; top: 0; left: 0; background: rgba(255,255,255,0.5); z-index: -1; transition: width 0.6s ease-out; }
  .ult-bar { height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; width: 100%; margin-top: 2px; }
  .ult-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #eccc68, #ffa502); transition: width 0.2s; }
  
  .timer-box { background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 16px; font-size: 28px; font-weight: 900; color: #ffe14d; text-shadow: 0 0 10px rgba(255,225,77,0.5); min-width: 70px; text-align: center; }
  
  /* Touch Controls */
  .controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
  .dpad { width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; position: relative; backdrop-filter: blur(5px); }
  .stick { width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; position: absolute; top: 35px; left: 35px; pointer-events: none; transition: transform 0.05s; }
  
  .btn-group { display: flex; gap: 15px; align-items: center; }
  .btn { width: 65px; height: 65px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: #fff; font-weight: 900; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); position: relative; overflow: hidden; cursor: pointer; }
  .btn:active { transform: scale(0.92); }
  .btn.atk { background: rgba(255, 71, 87, 0.4); border-color: #ff4757; }
  .btn.dash { background: rgba(30, 144, 255, 0.4); border-color: #1e90ff; }
  .btn.skill { background: rgba(255, 165, 0, 0.4); border-color: #ffa502; width: 75px; height: 75px; }
  .btn.skill.rdy { animation: pulse 1s infinite alternate; background: rgba(255, 215, 0, 0.8); box-shadow: 0 0 20px #ffd700; }
  
  .cd-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); height: 0%; transition: height 0.1s linear; }
  
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  
  /* Game Over Overlay */
  #go { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 20; backdrop-filter: blur(10px); }
  #go h1 { font-size: 48px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
  #go button { padding: 12px 32px; font-size: 18px; font-weight: 800; background: #ffe14d; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s; }
  #go button:hover { transform: scale(1.05); background: #fff; }
</style>
</head>
<body>

<div id="gc">
  <canvas id="cv"></canvas>
  
  <div class="hud">
    <div class="top-bar">
      <div class="p-card">
        <div class="p-name" id="pn">PIKACHU</div>
        <div class="bar-bg">
          <div class="bar-fill lag" id="pl"></div>
          <div class="bar-fill hp-p" id="pf"></div>
        </div>
        <div class="ult-bar"><div class="ult-fill" id="pu"></div></div>
      </div>
      
      <div class="timer-box" id="tm">99</div>
      
      <div class="p-card r">
        <div class="p-name" id="en">CHARIZARD</div>
        <div class="bar-bg">
          <div class="bar-fill lag" id="el"></div>
          <div class="bar-fill hp-e" id="ef"></div>
        </div>
        <div class="ult-bar"><div class="ult-fill" id="eu"></div></div>
      </div>
    </div>
    
    <div class="controls">
      <div class="dpad" id="dp"><div class="stick" id="st"></div></div>
      <div class="btn-group">
        <div class="btn dash" id="bDs">DASH<div class="cd-overlay" id="dsc"></div></div>
        <div class="btn atk" id="bAtk">ATK</div>
        <div class="btn skill" id="bSk">ULT<div class="cd-overlay" id="skc"></div></div>
      </div>
    </div>
  </div>
  
  <div id="go">
    <h1 id="got">VICTORY</h1>
    <button onclick="reset()">PLAY AGAIN</button>
  </div>
</div>

<script>
/* ==========================================================
   CONFIG & INITIALIZATION
   ========================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;
cv.width = W; cv.height = H;

const $ = id => document.getElementById(id);

// Audio Synthesis Engine (Simple SFX Generator)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSFX(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;
  if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'ult') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'dash') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  }
}

/* ==========================================================
   GAME STATE & CAMERA
   ========================================================== */
let keys = {}, touch = { x: 0, active: false };
let cam = { x: W/2, y: H/2, zoom: 1, shake: 0 };
let hitstop = 0;
let flashA = 0;
let timeLeft = 99;
let gameOver = false;

// Arena Floor
const GROUND = H - 120;

// Dynamic VFX Arrays
let parts = [];
let rings = [];
let texts = [];

/* ==========================================================
   PLAYER & ENEMY ENTITIES
   ========================================================== */
class Entity {
  constructor(x, color, name, isPlayer) {
    this.x = x;
    this.y = GROUND;
    this.vx = 0;
    this.vy = 0;
    this.w = 50;
    this.h = 80;
    this.col = color;
    this.name = name;
    this.isPlayer = isPlayer;
    this.dir = isPlayer ? 1 : -1;
    
    this.hp = 100;
    this.max = 100;
    this.ult = 0;
    
    this.grounded = true;
    this.state = 'idle'; // idle, run, atk, ult, hurt
    this.stateTimer = 0;
    
    this.dashCd = 0;
    this.atkCd = 0;
    
    // Skill Specific
    this.mv = isPlayer ? 'LIGHTNING STORM' : 'FLAME BURST';
  }

  update(dt, opp) {
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.atkCd > 0) this.atkCd -= dt;
    if (this.stateTimer > 0) {
      this.stateTimer -= dt;
      if (this.stateTimer <= 0 && this.state !== 'hurt') {
        this.state = 'idle';
      }
    }

    // Physics Update
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    
    if (!this.grounded) {
      this.vy += 1.5; // Gravity
    }
    
    if (this.y >= GROUND) {
      this.y = GROUND;
      this.vy = 0;
      this.grounded = true;
    }

    // Boundaries
    if (this.x < 50) this.x = 50;
    if (this.x > W - 50) this.x = W - 50;

    // Face Opponent automatically if idle
    if (this.state === 'idle' || this.state === 'run') {
      this.dir = opp.x > this.x ? 1 : -1;
    }

    // Friction
    this.vx *= 0.82;
  }

  attack(opp) {
    if (this.atkCd > 0 || this.state === 'ult' || this.state === 'hurt') return;
    this.state = 'atk';
    this.stateTimer = 0.25;
    this.atkCd = 0.4;
    
    playSFX('hit');

    // Range check
    const dist = Math.abs(this.x - opp.x);
    if (dist < 90 && Math.abs(this.y - opp.y) < 50) {
      opp.takeDamage(8, this.dir);
      createHitEffect(opp.x, opp.y - 40, '#ff4757');
      cam.shake = 8;
      hitstop = 0.05;
    }
  }

  dash() {
    if (this.dashCd > 0) return;
    this.dashCd = 1.1;
    this.vx = this.dir * 22;
    playSFX('dash');
    
    // Trail Effect
    for(let i=0; i<5; i++) {
      parts.push({
        x: this.x + (Math.random()*20 - 10),
        y: this.y - 40 + (Math.random()*20 - 10),
        vx: 0, vy: 0,
        r: 20, col: this.col, life: 0.2, maxLife: 0.2
      });
    }
  }

  useUltimate(opp) {
    if (this.ult < 100) return;
    this.ult = 0;
    this.state = 'ult';
    this.stateTimer = 1.5;
    
    playSFX('ult');
    cam.zoom = 1.4;
    cam.shake = 15;
    hitstop = 0.2;
    flashA = 0.8;

    // Mega Attack
    setTimeout(() => {
      const dist = Math.abs(this.x - opp.x);
      if (dist < 300) {
        opp.takeDamage(35, this.dir);
        createHitEffect(opp.x, opp.y - 40, '#ffe14d', 40);
        cam.shake = 25;
      }
    }, 400);
  }

  takeDamage(amt, dir) {
    this.hp = Math.max(0, this.hp - amt);
    this.state = 'hurt';
    this.stateTimer = 0.3;
    this.vx = dir * 12;
    this.vy = -4;
    this.grounded = false;

    // Gain Ult Energy on damage
    this.ult = Math.min(100, this.ult + amt * 1.2);

    // Floating Text
    texts.push({
      x: this.x, y: this.y - 90,
      txt: '-' + amt, l: 0.8, col: '#ff4757'
    });
  }
}

const pl = new Entity(300, '#00d2d3', 'PIKACHU', true);
const en = new Entity(980, '#ff6b6b', 'CHARIZARD', false);

/* ==========================================================
   INPUT & CONTROLS
   ========================================================== */
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Touch Joystick Setup
const dp = $('dp'), st =$('st');
let dpCenter = { x: 0, y: 0 };

dp.addEventListener('touchstart', e => {
  const rect = dp.getBoundingClientRect();
  dpCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  handleTouch(e.touches[0]);
});

dp.addEventListener('touchmove', e => {
  handleTouch(e.touches[0]);
});

dp.addEventListener('touchend', () => {
  touch.active = false;
  st.style.transform = `translate(0px, 0px)`;
});

function handleTouch(t) {
  const dx = t.clientX - dpCenter.x;
  const dy = t.clientY - dpCenter.y;
  const dist = Math.min(40, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);
  
  const sx = Math.cos(angle) * dist;
  const sy = Math.sin(angle) * dist;
  st.style.transform = `translate(${sx}px, ${sy}px)`;
  
  touch.active = true;
  touch.x = dx / 40;
}

// Touch Buttons
$('bAtk').addEventListener('touchstart', e => { e.preventDefault(); pl.attack(en); });
$('bDs').addEventListener('touchstart', e => { e.preventDefault(); pl.dash(); });$('bSk').addEventListener('touchstart', e => { e.preventDefault(); pl.useUltimate(en); });

/* ==========================================================
   PARTICLES & VISUAL EFFECTS
   ========================================================== */
function createHitEffect(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 2;
    parts.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * 6 + 3,
      col: color,
      life: 0.4,
      maxLife: 0.4
    });
  }
  rings.push({ x: x, y: y, r: 10, max: 80, l: 0.3, col: color });
}

/* ==========================================================
   AI BEHAVIOR LOGIC
   ========================================================== */
function updateAI(dt) {
  if (en.state === 'hurt' || en.state === 'ult' || gameOver) return;

  const dist = Math.abs(en.x - pl.x);
  
  if (dist > 120) {
    en.vx = en.dir * 4;
  } else {
    en.vx = 0;
    if (Math.random() < 0.03) en.attack(pl);
  }

  if (en.ult >= 100 && dist < 200 && Math.random() < 0.05) {
    en.useUltimate(pl);
  }
}

/* ==========================================================
   GAME LOOP & RENDERING
   ========================================================== */
function reset() {
  pl.hp = 100; pl.ult = 0; pl.x = 300; pl.y = GROUND;
  en.hp = 100; en.ult = 0; en.x = 980; en.y = GROUND;
  timeLeft = 99;
  gameOver = false;
  $('go').style.display = 'none';
}

function update(dt) {
  if (gameOver) return;

  // Timer
  timeLeft -= dt;
  if (timeLeft <= 0 || pl.hp <= 0 || en.hp <= 0) {
    gameOver = true;
    $('go').style.display = 'flex';
    if (pl.hp > en.hp) $('got').textContent = 'VICTORY!';
    else if (en.hp > pl.hp) $('got').textContent = 'DEFEAT!';
    else $('got').textContent = 'DRAW!';
  }

  // Keyboard Inputs
  if (keys['KeyA'] || keys['ArrowLeft']) pl.vx = -6;
  if (keys['KeyD'] || keys['ArrowRight']) pl.vx = 6;
  if ((keys['KeyW'] || keys['ArrowUp']) && pl.grounded) {
    pl.vy = -18;
    pl.grounded = false;
  }
  if (keys['KeyJ']) pl.attack(en);
  if (keys['KeyK']) pl.dash();
  if (keys['KeyL']) pl.useUltimate(en);

  // Touch Movement
  if (touch.active) {
    pl.vx = touch.x * 6;
  }

  pl.update(dt, en);
  en.update(dt, pl);
  updateAI(dt);

  // Smooth Camera Zoom Reset
  cam.zoom += (1 - cam.zoom) * dt * 4;
}

function draw(dt) {
  // Clear & Screen Shake
  ctx.save();
  ctx.clearRect(0, 0, W, H);

  let sx = (Math.random() - 0.5) * cam.shake;
  let sy = (Math.random() - 0.5) * cam.shake;
  cam.shake = Math.max(0, cam.shake - dt * 40);

  ctx.translate(W/2 + sx, H/2 + sy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-W/2, -H/2);

  // Render Background Grid
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);
  
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Render Arena Ground
  ctx.fillStyle = '#1e1e2f';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#ffe14d';
  ctx.fillRect(0, GROUND, W, 4);

  // Render Entities (Shadows & Bodies)
  [pl, en].forEach(e => {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(e.x, GROUND, 35, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body Block
    ctx.fillStyle = e.col;
    ctx.shadowColor = e.col;
    ctx.shadowBlur = e.state === 'ult' ? 30 : 10;
    
    let drawY = e.y - e.h;
    if (e.state === 'atk') drawY -= 5;
    
    ctx.fillRect(e.x - e.w/2, drawY, e.w, e.h);
    
    // Eyes / Direction
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x + (e.dir * 10) - 4, drawY + 15, 8, 8);
    
    ctx.shadowBlur = 0;
  });

  // Render Particles
  parts.forEach(p => {
    ctx.fillStyle = p.col;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  // Render Shockwaves
  rings.forEach(r => {
    ctx.strokeStyle = r.col;
    ctx.lineWidth = 3;
    ctx.globalAlpha = r.l / 0.3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1.0;

  // Render Damage Texts
  texts.forEach(t => {
    ctx.font = '900 24px Inter, sans-serif';
    ctx.fillStyle = t.col;
    ctx.globalAlpha = t.l;
    ctx.fillText(t.txt, t.x - 15, t.y);
  });
  ctx.globalAlpha = 1.0;

  // Screen Flash
  if (flashA > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashA})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  // Cinematic Ultimate FX / Overlay
  if (pl.state === 'ult' || en.state === 'ult') {
    const activePl = pl.state === 'ult' ? pl : en;
    
    // Vignette
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.8);
    v.addColorStop(0, 'transparent');
    v.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Text Overlay
    ctx.save();
    ctx.font = 'italic 900 32px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = activePl.col || '#ffe14d';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 6;
    ctx.shadowColor = activePl.col || '#ffe14d';
    ctx.shadowBlur = 20;
    const txt = `⚡ ${activePl.mv.toUpperCase()} ⚡`;
    ctx.strokeText(txt, W / 2, H * 0.18);
    ctx.fillText(txt, W / 2, H * 0.18);
    ctx.restore();
  }
}

/* ==========================================================
   UPDATE VFX & UI
   ========================================================== */
function updateEffects(dt) {
  // Particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }

  // Rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += (r.max - r.r) * dt * 8;
    r.l -= dt;
    if (r.l <= 0) rings.splice(i, 1);
  }

  // Texts
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.y -= 30 * dt;
    t.l -= dt;
    if (t.l <= 0) texts.splice(i, 1);
  }

  if (flashA > 0) flashA = Math.max(0, flashA - dt * 3);
}

function updateUI() {
  const pPct = Math.max(0, Math.round((pl.hp / pl.max) * 100));
  const ePct = Math.max(0, Math.round((en.hp / en.max) * 100));

  $('pf').style.width = pPct + '\%';$('ef').style.width = ePct + '%';
  $('pl').style.width = pPct + '\%';$('el').style.width = ePct + '%';

  $('pu').style.width = pl.ult + '%';
  $('eu').style.width = en.ult + '\%';$('tm').textContent = Math.max(0, Math.ceil(timeLeft));

  // Cooldown Overlays
  const skBtn = $('bSk');
  const skCd = $('skc');
  if (pl.ult >= 100) {
    skBtn.classList.add('rdy');
    skCd.style.height = '0%';
  } else {
    skBtn.classList.remove('rdy');
    skCd.style.height = (100 - pl.ult) + '%';
  }

  const dsCd = $('dsc');
  if (pl.dashCd > 0) {
    dsCd.style.height = Math.min(100, (pl.dashCd / 1.1) * 100) + '%';
  } else {
    dsCd.style.height = '0%';
  }
}

/* ==========================================================
   MAIN GAME LOOP
   ========================================================== */
let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  if (dt > 0.1) dt = 0.1;

  if (hitstop > 0) {
    hitstop -= dt;
  } else {
    update(dt);
    updateEffects(dt);
  }

  updateUI();
  draw(dt);

  requestAnimationFrame(loop);
}

// Start Game
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
