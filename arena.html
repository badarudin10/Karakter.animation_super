<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIIPBATTLE // CINEMATIC ARENA</title>
<style>
:root{
  --p-col:#56e9ff; --e-col:#ff5470; --cy:#56e9ff; --gn:#4ade80; --rd:#ff5470; --am:#ffc857;
  --bg-dark:#05080f;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg-dark);overflow:hidden;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* --- HUD TOP --- */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;pointer-events:none}
.fb{background:rgba(10,15,25,.85);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:8px 12px;backdrop-filter:blur(10px);min-width:0;position:relative;box-shadow:0 5px 15px rgba(0,0,0,.5)}
.fb.p{clip-path:polygon(0 0, 100% 0, 95% 100%, 0% 100%);border-left:3px solid var(--p-col)}
.fb.e{clip-path:polygon(0 0, 100% 0, 100% 100%, 5% 100%);border-right:3px solid var(--e-col);text-align:right}
.nm{font-size:12px;font-weight:900;letter-spacing:.1em;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;text-transform:uppercase}
.fb.e .nm{flex-direction:row-reverse}
.nm span:first-child{overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px currentColor}
.bar{height:14px;margin-top:6px;border-radius:2px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;width:100%;background:var(--gn);transition:width .15s,background .3s;box-shadow:inset 0 0 10px rgba(255,255,255,.5)}
.bar i.l{background:rgba(255,255,255,.4);transition:width .7s .25s}
.fb.p .bar i{background:linear-gradient(90deg, #4ade80, #22c55e)}
.fb.e .bar i{background:linear-gradient(270deg, #ef4444, #b91c1c)}
.ub{height:5px;margin-top:5px;border-radius:3px;background:rgba(0,0,0,.8);overflow:hidden}
.ub i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),#a894ff);transition:width .2s;box-shadow:0 0 10px var(--cy)}
.tm{font-size:28px;font-weight:950;text-align:center;min-width:64px;text-shadow:0 0 15px #fff, 0 0 30px var(--am);color:var(--am);font-style:italic}
.tm small{display:block;font-size:9px;letter-spacing:.2em;color:#9fb0c8;font-style:normal;text-shadow:none}
.exit{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 75px);padding:8px 14px;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#fff;background:rgba(255,84,112,.2);border:1px solid rgba(255,84,112,.6);text-decoration:none;backdrop-filter:blur(4px);transition:all .2s}
.exit:active{background:var(--rd);color:#fff}

/* --- KONTROL BAWAH --- */
#zone{position:fixed;left:0;bottom:0;width:50%;height:40%;z-index:5}
#base{display:none;position:fixed;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.05);pointer-events:none;z-index:5}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid #fff;box-shadow:0 0 20px rgba(255,255,255,.5);backdrop-filter:blur(5px)}
.btns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 25px);z-index:5;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.b{width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;font:900 12px inherit;letter-spacing:.05em;backdrop-filter:blur(8px);box-shadow:0 5px 15px rgba(0,0,0,.6);position:relative;overflow:hidden;transition:transform .1s}
.b:active{transform:scale(.9)}
.b.atk{width:90px;height:90px;font-size:16px;background:rgba(74,222,128,.2);border-color:var(--gn);color:var(--gn);grid-column:2;text-shadow:0 0 10px var(--gn)}
.b.sk{background:rgba(86,233,255,.1);border-color:var(--cy);color:var(--cy)}
.b.sk.rdy{background:rgba(86,233,255,.4);box-shadow:0 0 30px var(--cy);animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.05);box-shadow:0 0 50px var(--cy)}}
.b .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7);transition:height .1s}

/* --- INTRO --- */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,6,12,.85);backdrop-filter:blur(8px);transition:opacity .4s}
.ov.h{opacity:0;pointer-events:none}
.vs{display:flex;align-items:center;justify-content:center;width:100%;height:60vh;position:relative;overflow:hidden;margin-bottom:20px}
.vs-bg{position:absolute;inset:0;z-index:0;opacity:.6}
.vs-bg::before, .vs-bg::after{content:'';position:absolute;top:0;bottom:0;width:50%}
.vs-bg::before{left:0;background:radial-gradient(circle at 30% 50%, var(--p-col), transparent 70%);animation:pulse 4s infinite alternate}
.vs-bg::after{right:0;background:radial-gradient(circle at 70% 50%, var(--e-col), transparent 70%);animation:pulse 4s infinite alternate-reverse}
.vc{display:flex;flex-direction:column;align-items:center;width:45vw;max-width:350px;position:relative;z-index:2}
.vc img{width:100%;height:min(35vh,280px);object-fit:contain;transition:transform .3s}
.vc.p{animation:inL .8s cubic-bezier(.2,.9,.2,1) both}
.vc.e{animation:inR .8s cubic-bezier(.2,.9,.2,1) both}
.vc.p img{filter:drop-shadow(0 0 25px var(--p-col))}
.vc.e img{filter:drop-shadow(0 0 25px var(--e-col))}
.name-box{background:linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.4));border-left:4px solid var(--p-col);padding:5px 15px;margin-top:10px;transform:skewX(-15deg)}
.vc.e .name-box{border-left:none;border-right:4px solid var(--e-col);background:linear-gradient(270deg, rgba(0,0,0,.8), rgba(0,0,0,.4))}
.vc b{font-size:24px;letter-spacing:.15em;font-style:italic;text-transform:uppercase;text-shadow:2px 2px 0 #000;display:block;transform:skewX(15deg)}
.vc.p b{color:var(--p-col)}
.vc.e b{color:var(--e-col)}
.move-tag{background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:900;letter-spacing:.1em;margin-top:8px;text-transform:uppercase;box-shadow:0 0 15px rgba(0,0,0,.8)}
.vc.p .move-tag{color:var(--p-col);border-color:var(--p-col)}
.vc.e .move-tag{color:var(--e-col);border-color:var(--e-col)}
.vs-center{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center}
.vsx{font-size:60px;font-weight:950;font-style:italic;letter-spacing:.05em;color:#fff;text-shadow:0 0 30px #fff, 0 0 60px var(--am);animation:pop .5s .4s both;line-height:1}
.pokeball-split{width:4px;height:200px;background:linear-gradient(180deg, transparent, #fff, transparent);margin-top:10px;box-shadow:0 0 20px #fff;animation:pop .5s .6s both}
@keyframes inL{from{transform:translateX(-150%) skewX(10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(150%) skewX(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{from{opacity:.3}to{opacity:.8}}
.big{font-size:clamp(60px,20vw,120px);font-weight:950;letter-spacing:.1em;font-style:italic;text-shadow:0 0 40px var(--gn), 0 0 80px var(--gn);animation:pop .4s ease both;position:absolute;z-index:10}
.sub{font-size:14px;letter-spacing:.3em;color:#9fb0c8;text-transform:uppercase;margin-top:10px;font-weight:800}

/* --- END SCREEN --- */
.res{width:min(90vw,380px);padding:30px;border-radius:12px;background:linear-gradient(145deg,#0f1a30,#05080f);border:2px solid var(--cy);box-shadow:0 0 50px rgba(86,233,255,.3), inset 0 0 20px rgba(0,0,0,.8);transform:skewX(-5deg)}
.res h2{margin:0;font-size:48px;letter-spacing:.1em;font-style:italic;text-shadow:0 0 20px currentColor}
.stars{font-size:36px;letter-spacing:8px;margin:20px 0;color:var(--am);text-shadow:0 0 20px var(--am)}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;transform:skewX(5deg)}
.rw div{padding:12px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:11px;color:#9fb0c8;letter-spacing:.1em;font-weight:800}
.rw b{display:block;color:#fff;font-size:22px;margin-top:4px;text-shadow:0 0 10px #fff}
.ra{display:flex;gap:12px;transform:skewX(5deg)}
.ra button,.ra a{flex:1;min-height:50px;border-radius:6px;border:0;font:900 12px inherit;letter-spacing:.15em;display:grid;place-items:center;text-decoration:none;color:#05080f;background:linear-gradient(100deg,var(--cy),#a894ff);box-shadow:0 0 20px rgba(86,233,255,.4);transition:transform .1s}
.ra button:active,.ra a:active{transform:scale(.95)}
.ra a{background:rgba(255,255,255,.1);color:#d9e2f5;border:1px solid rgba(255,255,255,.2);box-shadow:none}

#note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translate(-50%,-20px);z-index:15;padding:10px 20px;border-radius:6px;font-size:12px;font-weight:900;letter-spacing:.15em;text-align:center;white-space:nowrap;color:#05080f;background:linear-gradient(100deg,var(--am),#fff);box-shadow:0 0 30px var(--am);opacity:0;pointer-events:none;transition:.3s;text-transform:uppercase}
#note.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div class="top">

function loadSheet(id){
 if(SHEET_CACHE[id])return SHEET_CACHE[id];
 const cfg=SHEETS[id],sh=SHEET_CACHE[id]={cols:cfg.cols,rows:cfg.rows,ready:false,img:new Image()};
 sh.img.onload=()=>{analyze(sh);sh.ready=true};

function analyze(sh){
 const im=sh.img,cw=im.naturalWidth/sh.cols,ch=im.naturalHeight/sh.rows;sh.cw=Math.floor(cw);sh.ch=Math.floor(ch);
 let feet=[ch*.85,ch*.85,ch*.85],ax=cw*.43,bw=cw*.58,bh=ch*.67,atkN=Math.max(2,sh.cols-1);
 try{
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);
  const box=(r,k)=>{const d=x.getImageData(Math.round(k*cw),Math.round(r*ch),sh.cw,sh.ch).data;let x0=1e9,x1=-1,y0=1e9,y1=-1;
   for(let yy=0;yy<sh.ch;yy++)for(let xx=0;xx<sh.cw;xx++)if(d[(yy*sh.cw+xx)*4+3]>40){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
   return x1<0?null:{x0,x1,y0,y1,h:y1-y0,w:x1-x0}};
  const med=a=>a.slice().sort((p,q)=>p-q)[a.length>>1];
  const B=[0,1,2].map(r=>Array.from({length:sh.cols},(_,k)=>box(r,k)));
  const ok=B.map(b=>b.filter(Boolean));
  feet=ok.map(b=>b.length?med(b.map(f=>f.y1)):ch*.85);
  if(ok[0].length){ax=med(ok[0].map(f=>(f.x0+f.x1)/2));bw=med(ok[0].map(f=>f.w));bh=med(ok[0].map(f=>f.h))}
  if(ok[2].length){const mh=med(ok[2].map(f=>f.h));let n=0;for(const f of B[2]){if(f&&f.h>=mh*.7)n++;else break}atkN=Math.max(2,n)}
 }catch(e){}
 sh.feet=feet;sh.ax=ax;sh.bh=bh;sh.atkN=atkN;sh.mz=[bw*.55,-bh*.39]}

// Setiap state memiliki konfigurasi frame
const ANIM_CONFIG = {
  IDLE:     { row: 0, startFrame: 0, endFrame: 5, fps: 6,  loop: true,  easing: 'linear' },
  WALK:     { row: 1, startFrame: 0, endFrame: 3, fps: 8,  loop: true,  easing: 'linear' },
  RUN:      { row: 1, startFrame: 4, endFrame: 5, fps: 14, loop: true,  easing: 'linear' },
  // Attack: baris 2, frame 0-5 (18 frame total / 3 row = 6 frame per row)
  ATTACK:   { row: 2, startFrame: 0, endFrame: 5, fps: 24, loop: false, easing: 'easeOut' },
  HIT:      { row: 0, startFrame: 5, endFrame: 5, fps: 1,  loop: false, easing: 'linear' }, // Placeholder
  RECOVERY: { row: 0, startFrame: 3, endFrame: 0, fps: 12, loop: false, easing: 'easeOut' },
};

function getFrame(e, stateName) {
  const cfg = ANIM_CONFIG[stateName] || ANIM_CONFIG.IDLE;
  const totalFrames = cfg.endFrame - cfg.startFrame + 1;
  const elapsed = e.stateTime / 1000;
  let frame;
  
  if (cfg.loop) {
    frame = cfg.startFrame + Math.floor(elapsed * cfg.fps) % totalFrames;
  } else {
    frame = cfg.startFrame + Math.floor(elapsed * cfg.fps);
    if (frame > cfg.endFrame) frame = cfg.endFrame;
  }
  return { frame, row: cfg.row };
}

function triggerAttack(entity, attackType) {
  if (entity.state !== 'IDLE' && entity.state !== 'RECOVERY') return;
  
  const timeline = ATTACK_TIMELINE[entity.id] || ATTACK_TIMELINE['pikachu'];
  entity.attackData = {
    name: timeline.name,
    type: attackType,
    startTime: performance.now(),
    anticipation: timeline.anticipation,
    charge: timeline.charge,
    action: timeline.action,
    release: timeline.release,
    impact: timeline.impact,
    recovery: timeline.recovery,
    projectileSpeed: timeline.projectileSpeed,
    hitstop: timeline.hitstop,
    cameraZoom: timeline.cameraZoom,
    hasFired: false,
    hasImpacted: false
  };
  
  entity.state = 'ANTICIPATION';
  entity.stateTime = 0;
  entity.vx = 0; entity.vy = 0;
  cameraTargetZoom = 1.05;
}

// PARTICLE SYSTEM - Lebih variatif (bentuk: circle, spark, diamond, line)
function spawnParticleVFX(x, y, type, intensity = 1, isGround = false) {

  for (let i = 0; i < count; i++) {
    let color, vx, vy, size, life, shape;
    const angle = Math.random() * Math.PI * 2;
    const speed = (40 + Math.random() * 120) * intensity;
    
    if (type === 'elec') {
      color = Math.random() > 0.5 ? '#ffe14d' : '#56b8ff';
      vx = Math.cos(angle) * speed * 1.5;
      vy = Math.sin(angle) * speed * 0.5 - 40;
      size = 2 + Math.random() * 3;
      life = 0.3 + Math.random() * 0.3;
      shape = 'spark';
    } else if (type === 'fire') {
      color = Math.random() > 0.5 ? '#ff7b61' : '#ffc857';
      vx = Math.cos(angle) * speed * 0.5;
      vy = Math.sin(angle) * speed * 0.5 - 60;
      size = 3 + Math.random() * 5;
      life = 0.4 + Math.random() * 0.4;
      shape = 'circle';
    } else if (type === 'water') {
      color = '#54c9ff';
      vx = Math.cos(angle) * speed * 0.7;
      vy = Math.sin(angle) * speed * 0.7 - 30;
      size = 2 + Math.random() * 4;
      life = 0.3 + Math.random() * 0.3;
      shape = 'circle';
    } else if (type === 'grass') {
      color = Math.random() > 0.5 ? '#7ee69d' : '#4ade80';
      vx = Math.cos(angle) * speed * 0.8;
      vy = Math.sin(angle) * speed * 0.8 - 50;
      size = 3 + Math.random() * 4;
      life = 0.4 + Math.random() * 0.4;
      shape = 'diamond';
    } else if (type === 'psy') {
      color = '#e08cff';
      vx = Math.cos(angle) * speed * 0.6;
      vy = Math.sin(angle) * speed * 0.6;
      size = 3 + Math.random() * 4;
      life = 0.5 + Math.random() * 0.5;
      shape = 'circle';
    } else if (type === 'ghost') {
      color = Math.random() > 0.5 ? '#a883ff' : '#4a1a8a';
      vx = Math.cos(angle) * speed * 0.5;
      vy = Math.sin(angle) * speed * 0.5;
      size = 4 + Math.random() * 5;

function fireProjectile(attacker, target, type, speedMult = 1) {
  const b = body(attacker);
  const tb = body(target);
  const angle = Math.atan2(tb.y - b.y, tb.x - b.x);
  const speed = W * 0.8 * speedMult;
  
  proj.push({
    x: b.x, y: b.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: Math.max(12, attacker.size * 0.15),
    from: attacker.isP,
    fx: type,
    col: FX_COLORS[type] || attacker.col,
    dmg: dmgOf(attacker.atk, target.def, attacker.isP ? 1.5 : 1),
    l: 2,
    trail: [],
    angle: angle,
    rotation: 0,
    rotSpeed: (Math.random() - 0.5) * 8
  });
}

// === IMPACT MULTI-LAYER ===
function triggerImpact(target, sourceX, sourceY, type, dmg) {
  const b = body(target);
  const dx = target.x - sourceX;
  const dy = target.y - sourceY;
  const dist = Math.hypot(dx, dy) || 1;
  
  // LAYER 1: Screen Flash & Camera
  flashA = 0.5;
  cameraShake = 18;
  cameraPunch = 1.0;
  hitstop = 0.08;
  
  // LAYER 2: Knockback & Hit Reaction
  target.kx = (dx / dist) * 450;
  target.ky = (dy / dist) * 250;
  target.flash = 0.15;
  target.inv = 0.25;
  target.hp = Math.max(0, target.hp - dmg);
  
  // Hit reaction scale squash
  target.hitScaleX = 1.15;
  target.hitScaleY = 0.85;
  target.hitRotation = (Math.random() - 0.5) * 0.3;
  
  // LAYER 3: Impact Rings (2 lapis)
  rings.push({ x: target.x, y: target.y, r: 10, max: target.size * 2.2, c: FX_COLORS[type] || '#fff', l: 0.5, w: 8 });
  rings.push({ x: target.x, y: target.y, r: 5, max: target.size * 1.5, c: '#ffffff', l: 0.4, w: 5 });
  
  // LAYER 4: Directional Particles (sparks & debris)
  for (let i = 0; i < 20; i++) {
    const a = angleFromTo(sourceX, sourceY, target.x, target.y) + (Math.random() - 0.5) * 1.5;
    const sp = 150 + Math.random() * 300;
    const col = Math.random() > 0.5 ? FX_COLORS[type] : '#ffffff';
    parts.push({
      x: b.x, y: b.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
      life: 0.4 + Math.random() * 0.3, maxLife: 0.7,
      color: col, size: 2 + Math.random() * 4,
      shape: Math.random() > 0.5 ? 'spark' : 'circle',
      rotation: 0, rotSpeed: 0, gravity: 400
    });
  }
  
  // LAYER 5: Element-specific VFX
  spawnParticleVFX(b.x, b.y, type, 2.5);
  spawnParticleVFX(b.x, b.y, 'normal', 1.5);
  
  // LAYER 6: Damage Text
  texts.push({ x: b.x, y: b.y - target.size * 0.3, t: `-${Math.round(dmg)}`, l: 0.8, c: target.isP ? '#ff7b8f' : '#ffe27a', s: 24 });
  
  // Audio & Vibration
  AudioManager.play('scan', 0.6);
  vib(60);
  
  // Camera zoom in
  cameraTargetZoom = 1.12;
  
  if (target.isP) {
    combo = 0;
    gainUlt(7);
  } else {
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    dmgDone += dmg;
    gainUlt(9);
  }
}

function burst(x,y,col,n=12,sp=240){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.45+Math.random()*.3,m:.7,c:col,s:2+Math.random()*4})}}

/* ==========================================================
   UPDATE LOOP
   ========================================================== */
function update(dt){
  if(state !== 'play') return;
  timeLeft -= dt;
  
  // Camera interpolation
  cameraZoom += (cameraTargetZoom - cameraZoom) * dt * 8;
  cameraTargetZoom += (1.0 - cameraTargetZoom) * dt * 3;
  cameraShake = Math.max(0, cameraShake - dt * 50);
  cameraPunch = Math.max(0, cameraPunch - dt * 3);

  // --- UPDATE PLAYER ---
  let ix=stick.x+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0);
  let iy=stick.y+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);
  const il=Math.hypot(ix,iy);
  if(il>1){ix/=il;iy/=il}
  
  pl.stateTime += dt * 1000;
  
  // Easing function untuk transisi
  const t = Math.min(1, pl.stateTime / 1000);
  
  if (pl.state === 'IDLE') {
    pl.moving = il > 0.1;
    if (pl.moving) {
      const run = il > 0.75;
      const m = hasS(pl) ? (run ? 1 : 0.62) : 1;
      pl.x += ix * spdOf(pl) * m * dt;
      pl.y += iy * spdOf(pl) * 0.6 * m * dt;
      pl.run = run;
    }
    if (atkHeld || K.Space || K.KeyJ) atk();
  } 
  else if (pl.state === 'ANTICIPATION') {
    pl.moving = false;
    // Body compression (squash)
    const squash = Math.sin(t * Math.PI) * 0.15;
    pl.hitScaleX = 1 + squash;
    pl.hitScaleY = 1 - squash;
    
    // Partikel kecil
    if (pl.stateTime > pl.attackData.anticipation * 0.5 && Math.random() < 0.3) {
      spawnParticleVFX(pl.x, pl.y - pl.size*0.4, pl.fx, 0.3);
    }
    
    if (pl.stateTime > pl.attackData.anticipation) {
      pl.state = 'CHARGE';
      pl.stateTime = 0;
      cameraTargetZoom = 1.06;
    }
  } 
  else if (pl.state === 'CHARGE') {
    pl.moving = false;
    // Getaran
    pl.hitScaleX = 1 + Math.sin(t * 40) * 0.02;
    pl.hitScaleY = 1 + Math.cos(t * 40) * 0.02;
    
    // Partikel charge meningkat
    const chargeProgress = Math.min(1, pl.stateTime / pl.attackData.charge);
    const intensity = 0.5 + chargeProgress * 1.5;
    if (Math.random() < 0.7) spawnParticleVFX(pl.x, pl.y - pl.size*0.4, pl.fx, intensity);
    
    if (pl.stateTime > pl.attackData.charge) {
      pl.state = 'ACTION';
      pl.stateTime = 0;
      pl.atkAnim = 0;
    }
  } 
  else if (pl.state === 'ACTION') {
    // Lunge dengan velocity
    const actionProgress = Math.min(1, pl.stateTime / pl.attackData.action);
    const lungeSpeed = pl.face * 300 * (1 - actionProgress * 0.5);
    pl.x += lungeSpeed * dt;
    
    // Stretch saat bergerak
    pl.hitScaleX = 1 + Math.sin(actionProgress * Math.PI) * 0.1;
    pl.hitScaleY = 1 - Math.sin(actionProgress * Math.PI) * 0.05;
    
    if (pl.stateTime > pl.attackData.action) {
      pl.state = 'RELEASE';
      pl.stateTime = 0;
      if (!pl.attackData.hasFired) {
        pl.attackData.hasFired = true;
        fireProjectile(pl, en, pl.fx, pl.attackData.projectileSpeed);
        AudioManager.play('button', 0.6);
        cameraTargetZoom = 1.10;
        cameraPunch = 0.8;
        flashA = 0.25;
        
        // Recoil
        pl.hitScaleX = 0.9;
        pl.hitScaleY = 1.1;
      }
    }
  } 
  else if (pl.state === 'RELEASE') {
    // Smooth scale recovery
    pl.hitScaleX += (1 - pl.hitScaleX) * dt * 10;
    pl.hitScaleY += (1 - pl.hitScaleY) * dt * 10;
    
    if (pl.stateTime > 200) {
      pl.state = 'RECOVERY';
      pl.stateTime = 0;
    }
  } 
  else if (pl.state === 'RECOVERY') {
    if (pl.stateTime > 300) {
      pl.state = 'IDLE';
      pl.stateTime = 0;
      pl.hitScaleX = 1; pl.hitScaleY = 1;
    }
  }
  
  // Update scale normal
  if (pl.state === 'IDLE' || pl.state === 'RECOVERY') {
    pl.hitScaleX += (1 - pl.hitScaleX) * dt * 8;
    pl.hitScaleY += (1 - pl.hitScaleY) * dt * 8;
  }
  
  pl.face = en.x >= pl.x ? 1 : -1;
  clampE(pl);
  pl.an += dt;
  pl.cd -= dt; pl.dashCd -= dt; pl.inv -= dt; pl.flash -= dt; pl.atkT -= dt;
  if (pl.atkAnim >= 0) { pl.atkAnim += dt; if (pl.atkAnim >= 0.42) pl.atkAnim = -1; }

  // --- UPDATE ENEMY AI (SAMA DENGAN PLAYER, TAPI DENGAN AI) ---
  const a=en.ai, dx=pl.x-en.x, dy=pl.y-en.y, dl=Math.hypot(dx,dy)||1, hard=en.hp<en.max*.5;
  en.face=dx>=0?1:-1; let mx=0,my=0;
  
  en.stateTime += dt * 1000;
  
  if (en.state === 'IDLE') {
    const want=W*.3, r=dl>want*1.15?1:dl<want*.7?-1:0, nx=dx/dl, ny=dy/dl;
    mx=nx*r-ny*a.dir*.8; my=ny*r+nx*a.dir*.8; a.t-=dt;
    if(Math.random()<dt*.4)a.dir*=-1;
    
    // AI memutuskan untuk menyerang
    if(a.t<=0){
      if(Math.random() < 0.6) {
        triggerAttack(en, 'normal');
      } else {
        en.wind = 0.5; en.kind = 'lunge';
        a.t = 1.5 + Math.random();
      }
    }
    en.moving=!!(mx||my);
  } 
  else if (en.state === 'ANTICIPATION') {
    en.moving = false;
    if (Math.random() < 0.3) spawnParticleVFX(en.x, en.y - en.size*0.4, en.fx, 0.4);
    if (en.stateTime > en.attackData.anticipation) {
      en.state = 'CHARGE'; en.stateTime = 0;
    }
  } 
  else if (en.state === 'CHARGE') {
    en.moving = false;
    if (Math.random() < 0.6) spawnParticleVFX(en.x, en.y - en.size*0.4, en.fx, 1.0);
    if (en.stateTime > en.attackData.charge) {
      en.state = 'ACTION'; en.stateTime = 0; en.atkAnim = 0;
    }
  } 
  else if (en.state === 'ACTION') {
    const actionProgress = Math.min(1, en.stateTime / en.attackData.action);
    en.x -= en.face * 200 * (1 - actionProgress * 0.5) * dt;
    if (en.stateTime > en.attackData.action) {
      en.state = 'RELEASE'; en.stateTime = 0;
      if (!en.attackData.hasFired) {
        en.attackData.hasFired = true;
        fireProjectile(en, pl, en.fx, en.attackData.projectileSpeed);
        AudioManager.play('button', 0.5);
      }
    }
  } 
  else if (en.state === 'RELEASE') {
    if (en.stateTime > 200) { en.state = 'RECOVERY'; en.stateTime = 0; }
  } 
  else if (en.state === 'RECOVERY') {
    if (en.stateTime > 300) { en.state = 'IDLE'; en.stateTime = 0; }
  }
  
  // Lunge logic
  if (en.lunge) {
    const L=en.lunge; L.t-=dt; en.x+=L.vx*dt; en.y+=L.vy*dt*.6;
    if(!L.hit && Math.hypot(pl.x-en.x,(pl.y-en.y)*1.6)<en.size*.5) {
      L.hit = true;
      triggerImpact(pl, en.x, en.y, en.fx, dmgOf(en.atk,pl.def,1.1));
    }
    if(L.t<=0) en.lunge=null;
  }
  
  const es=spdOf(en)*.75;
  en.x+=mx*es*dt+en.kx*dt; en.y+=my*es*dt*.6+en.ky*dt;
  en.kx*=.88; en.ky*=.88; clampE(en);
  en.an+=dt;
  if(en.atkAnim>=0){en.atkAnim+=dt; if(en.atkAnim>=.42)en.atkAnim=-1;}
  en.inv-=dt; en.flash-=dt; en.atkT-=dt;

  // --- UPDATE PROJECTILE ---
  for(let i=proj.length-1;i>=0;i--){
    const p=proj[i];
    
    // Simpan trail
    p.trail.push({x:p.x, y:p.y, l:0.3});
    if(p.trail.length > 15) p.trail.shift();
    for(let j=0;j<p.trail.length;j++) p.trail[j].l -= dt;
    
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt;
    p.rotation += p.rotSpeed * dt;
    
    // Spawn partikel kecil
    if (Math.random() < 0.6) spawnParticleVFX(p.x, p.y, p.fx, 0.4);
    
    const t=p.from?en:pl, b=body(t);
    const hitDist = t.size * 0.4;
    if(Math.hypot(p.x-b.x, p.y-b.y) < hitDist){
      triggerImpact(t, p.x, p.y, p.fx, p.dmg);
      proj.splice(i,1);
      continue;
    }
    if(p.l<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) proj.splice(i,1);
  }
  
  if(en.hp<=0)finish(true); else if(pl.hp<=0)finish(false); else if(timeLeft<=0)finish(pl.hp/pl.max>=en.hp/en.max);
}

function finish(win){
  state='over';
  const ratio=pl.hp/pl.max, stars=win?(ratio>.6?3:ratio>.3?2:1):0, exp=win?80+stars*40:20;
  try{const s=JSON.parse(localStorage.getItem('biipbattle-state')||'{}');s.exp=(s.exp||0)+exp;localStorage.setItem('biipbattle-state',JSON.stringify(s))}catch(e){}
  AudioManager.play(win?'success':'error',.7); if(win)burst(en.x,en.y-60,'#ffd75e',40,420);
  setTimeout(()=>{
    $('rt').textContent=win?'VICTORY':'DEFEAT';
    $('rt').style.color=win?'var(--gn)':'var(--rd)';
    $('rs').textContent=win?'★'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆';
    $('rx').textContent='+'+exp; $('rh').textContent=Math.round(ratio*100)+'%';
    $('rc').textContent=maxCombo; $('rd').textContent=dmgDone;
    $('menu').href=`index.html?char=${pid}`; $('end').classList.remove('h');
  }, win?900:500);
}

const spdOf=e=>W*.32*(.7+e.spd/300);

/* ==========================================================
   RENDER
   ========================================================== */
function drawBg(){
  if(bg.complete&&bg.naturalWidth){
    const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight);
    const w=bg.naturalWidth*s, h=bg.naturalHeight*s;
    ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h);
  } else {
    ctx.fillStyle='#07150e'; ctx.fillRect(0,0,W,H);
  }
}

// === DRAW SHEET DENGAN ANIMATION CONTROLLER ===
function drawSheet(e, sz){
  const sh=e.sheet, s=sz/(sh.bh*1.19);
  
  // Tentukan state animasi berdasarkan kondisi
  let stateName = 'IDLE';
  if (e.state === 'ANTICIPATION' || e.state === 'CHARGE') stateName = 'IDLE'; // Bisa menggunakan frame idle atau movement
  else if (e.state === 'ACTION' || e.state === 'RELEASE') stateName = 'ATTACK';
  else if (e.state === 'RECOVERY') stateName = 'RECOVERY';
  else if (e.moving || e.run) stateName = e.run ? 'RUN' : 'WALK';
  
  const anim = getFrame(e, stateName);
  const frame = anim.frame;
  const row = anim.row;
  
  if(e.run && row === 1) ctx.rotate(.11 * e.face);
  ctx.scale(e.face, 1);
  
  // Terapkan scale dari hit reaction
  ctx.scale(e.hitScaleX || 1, e.hitScaleY || 1);
  
  // Hitung posisi gambar dengan offset untuk menjaga frame tetap di tempat
  const cw = sh.cw, ch = sh.ch;
  const dx = Math.round(frame * cw);
  const dy = Math.round(row * ch);
  
  ctx.drawImage(sh.img, dx, dy, cw, ch, -sh.ax*s, -sh.feet[row]*s, cw*s, ch*s);
}

function drawEnt(e){
  const A=arena(), k=.85+.3*Math.min(1,Math.max(0,(e.y-(A.cy-A.ry))/(A.ry*2)));
  const sz=e.size*k, t=perf/1000;
  const bob=Math.sin(t*(e.moving?11:3.5)+e.ph)*(e.moving?4:2.5)*k;
  
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(e.x,e.y,sz*.32,sz*.09,0,0,6.283); ctx.fill();
  
  // Aura (pulse)
  const fxColor = FX_COLORS[e.fx] || e.col;
  const auraPulse = 1 + Math.sin(t * 4) * 0.15;
  const auraGrd = ctx.createRadialGradient(e.x, e.y-sz*.4, 0, e.x, e.y-sz*.4, sz*1.3*auraPulse);
  auraGrd.addColorStop(0, fxColor + '60');
  auraGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = auraGrd;
  ctx.beginPath(); ctx.arc(e.x, e.y-sz*.4, sz*1.3*auraPulse, 0, 6.283); ctx.fill();

  if(e.wind>0){
    const p=1-e.wind/.55;
    ctx.strokeStyle=`rgba(255,84,112,${.3+.5*p})`;
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(e.x,e.y,sz*(.5-.2*p),sz*(.14-.05*p),0,0,6.283); ctx.stroke();
  }
  
  if(e.dashT>0) ctx.globalAlpha=.55;
  if(e.hp<=0) ctx.globalAlpha=.35+.25*Math.sin(perf/40);
  
  const im=e.img, useS=hasS(e);
  ctx.save();
  ctx.translate(e.x, e.y-3-(useS?0:Math.abs(bob)));
  
  // Hit reaction rotation
  if (e.hitRotation) ctx.rotate(e.hitRotation);
  
  if(e.flash>0) ctx.filter='brightness(2.6)';
  else if(e.inv>0 && e.isP) ctx.globalAlpha=.7;
  ctx.shadowColor=fxColor; ctx.shadowBlur=20;
  
  if(useS){
    drawSheet(e, sz);
  } else if(im.complete && im.naturalWidth){
    const s=sz/Math.max(im.naturalWidth, im.naturalHeight);
    const w=im.naturalWidth*s, h=im.naturalHeight*s;
    ctx.drawImage(im,-w/2,-h,w,h);
  } else {
    ctx.fillStyle=e.col; ctx.beginPath(); ctx.arc(0,-sz*.4,sz*.3,0,6.283); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
  
  // HP Bar
  if(!e.isP){
    const w=sz*.6, x=e.x-w/2, y=e.y-sz-8;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x-1,y-1,w+2,7);
    ctx.fillStyle='#ff5470'; ctx.fillRect(x,y,w*e.hp/e.max,5);
  } else {
    ctx.fillStyle='#4ade80';
    ctx.beginPath(); ctx.moveTo(e.x,e.y+14); ctx.lineTo(e.x-6,e.y+24); ctx.lineTo(e.x+6,e.y+24); ctx.fill();
  }
}

// === PROJECTILE RENDER (BERBEDA PER ELEMEN) ===
function drawProjectile(p) {
  const fx = p.fx;
  
  // Trail: menggambar garis dari posisi sebelumnya
  if (p.trail.length > 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < p.trail.length; i++) {
      const tr = p.trail[i];
      const alpha = Math.max(0, tr.l / 0.3);
      if (alpha <= 0) continue;
      
      if (fx === 'elec') {
        // Trail listrik: garis zigzag
        ctx.strokeStyle = `rgba(255, 225, 77, ${alpha})`;
        ctx.lineWidth = p.r * 0.6 * alpha;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y);
        const next = p.trail[i+1] || p.trail[i];
        ctx.lineTo(next.x, next.y);
        ctx.stroke();
      } else {
        // Trail umum: lingkaran mengecil
        ctx.fillStyle = `rgba(${hexToRgb(p.col)}, ${alpha * 0.6})`;
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, p.r * 0.8 * alpha, 0, 6.283);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  
  // Core projectile
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  
  if (fx === 'elec') {
    // Petir zigzag
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ffe14d';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    const len = W * 0.2;
    const angle = Math.atan2(p.vy, p.vx);
    let px = p.x - Math.cos(angle)*len, py = p.y - Math.sin(angle)*len;
    ctx.moveTo(px, py);
    for(let j=0; j<6; j++){
      px += Math.cos(angle)*(len/6) + (Math.random()-0.5)*25;
      py += Math.sin(angle)*(len/6) + (Math.random()-0.5)*25;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    
    // Glow inti
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.3, '#ffe14d');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3, 0, 6.283); ctx.fill();
    
  } else if (fx === 'fire') {
    // Api: lingkaran besar + partikel
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.3, '#ffc857');
    g.addColorStop(0.7, '#ff7b61');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3, 0, 6.283); ctx.fill();
    
  } else if (fx === 'water') {
    // Air: bola berputar
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r*2.5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, '#54c9ff');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, p.r*2.5, 0, 6.283); ctx.fill();
    // Droplet
    for(let i=0; i<5; i++){
      const a = (i / 5) * 6.283 + p.rotation;
      ctx.fillStyle = '#8fd6ff';
      ctx.beginPath();
      ctx.arc(Math.cos(a)*p.r*1.5, Math.sin(a)*p.r*1.5, 3, 0, 6.283);
      ctx.fill();
    }
    
  } else if (fx === 'grass') {
    // Daun berputar
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r*2.5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, '#7ee69d');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, p.r*2.5, 0, 6.283); ctx.fill();
    for(let i=0; i<4; i++){
      const a = (i / 4) * 6.283 + p.rotation;
      ctx.save();
      ctx.translate(Math.cos(a)*p.r*1.5, Math.sin(a)*p.r*1.5);
      ctx.rotate(a + 1.2);
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.ellipse(0, 0, p.r*0.8, p.r*0.3, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    
  } else if (fx === 'psy') {
    // Psychic: orb + ring
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.3, '#e08cff');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3, 0, 6.283); ctx.fill();
    
    ctx.strokeStyle = '#e08cff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r*2.5, p.r*1.5, p.rotation, 0, 6.283);
    ctx.stroke();
    
  } else if (fx === 'ghost') {
    // Ghost: dark orb + wisp
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.5);
    g.addColorStop(0, 'rgba(20, 0, 40, 0.9)');
    g.addColorStop(0.5, '#a883ff');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.5, 0, 6.283); ctx.fill();
    
    ctx.strokeStyle = `rgba(168, 131, 255, ${0.5 + Math.sin(perf/100)*0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*2.5 + Math.sin(perf/80)*3, 0, 6.283);
    ctx.stroke();
    
  } else if (fx === 'aura') {
    // Aura: bola biru
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, '#5fafff');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.5, 0, 6.283); ctx.fill();
    
    ctx.strokeStyle = '#7fd6ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*2, 0, 6.283);
    ctx.stroke();
    
  } else if (fx === 'dragon') {
    // Dragon: garis panjang + orb
    ctx.strokeStyle = '#72f0bd';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const len = W * 0.2;
    const angle = Math.atan2(p.vy, p.vx);
    ctx.moveTo(p.x - Math.cos(angle)*len, p.y - Math.sin(angle)*len);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, '#66e29b');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.5, 0, 6.283); ctx.fill();
    
  } else {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.4, p.col);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2, 0, 6.283); ctx.fill();
  }
  
  ctx.restore();
  ctx.globalAlpha = 1;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `${r},${g},${b}`;
}

// === VFX RENDER ===
function drawVFX(){
  ctx.globalCompositeOperation = 'lighter';
  
  // Particles
  for(const q of parts){
    const alpha = Math.max(0, q.life / q.maxLife);
    if (alpha <= 0) continue;
    ctx.globalAlpha = alpha;
    
    const shape = q.shape || 'circle';
    const size = q.size * (0.5 + alpha * 0.5);
    
    if (shape === 'spark') {
      ctx.strokeStyle = q.color;
      ctx.lineWidth = 2 * alpha;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(q.x - q.vx * 0.02, q.y - q.vy * 0.02);
      ctx.stroke();
    } else if (shape === 'diamond') {
      ctx.save();
      ctx.translate(q.x, q.y);
      ctx.rotate(q.rotation || 0);
      ctx.fillStyle = q.color;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size, 0);
      ctx.lineTo(0, size);
      ctx.lineTo(-size, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (shape === 'line') {
      ctx.strokeStyle = q.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03);
      ctx.stroke();
    } else {
      ctx.fillStyle = q.color;
      ctx.beginPath();
      ctx.arc(q.x, q.y, size, 0, 6.283);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  
  // Rings
  for(const r of rings){
    const alpha = Math.max(0, r.l / 0.6);
    if (alpha <= 0) continue;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = r.c;
    ctx.lineWidth = (r.w || 8) * alpha;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y - 20, r.r, r.r * 0.45, 0, 0, 6.283);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function draw(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  
  // Camera transform
  ctx.save();
  const zoom = cameraZoom;
  const shakeX = (Math.random()-0.5) * cameraShake;
  const shakeY = (Math.random()-0.5) * cameraShake;
  const punchZoom = 1 + cameraPunch * 0.05;
  
  ctx.translate(W/2 + shakeX, H/2 + shakeY);
  ctx.scale(zoom * punchZoom, zoom * punchZoom);
  ctx.translate(-W/2, -H/2);
  
  drawBg();
  
  // Draw entities (sort by Y)
  [pl,en].sort((a,b)=>a.y-b.y).forEach(drawEnt);
  
  // Draw projectiles
  for(const p of proj) drawProjectile(p);
  
  // Draw VFX
  drawVFX();
  
  // Draw texts
  ctx.textAlign='center'; ctx.lineJoin='round';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.l*2);
    ctx.font=`900 ${t.s}px Inter,sans-serif`;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.strokeText(t.t,t.x,t.y);
    ctx.fillStyle=t.c; ctx.fillText(t.t,t.x,t.y);
  }
  if(combo>1){
    ctx.globalAlpha=1; ctx.font='900 18px Inter,sans-serif';
    ctx.fillStyle='#ffc857'; ctx.strokeStyle='#000'; ctx.lineWidth=4;
    const s=`${combo} HIT COMBO`;
    ctx.strokeText(s,W/2,H*.2); ctx.fillText(s,W/2,H*.2);
  }
  
  ctx.restore();
  
  // Screen Flash
  if(flashA > 0){
    ctx.fillStyle=`rgba(255,250,200,${flashA})`;
    ctx.fillRect(0,0,W,H);
  }
  
  // Vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);
  v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

function fx(dt){
  // Particles dengan gravity
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vy += (q.gravity || 200) * dt;
    q.vx *= 0.96;
    q.vy *= 0.96;
    q.life -= dt;
    if (q.life <= 0) parts.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=50*dt;t.l-=dt;if(t.l<=0)texts.splice(i,1)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.max-r.r)*Math.min(1,dt*7);r.l-=dt;if(r.l<=0)rings.splice(i,1)}
  shake=Math.max(0,shake-dt*40);flashA=Math.max(0,flashA-dt*2.2);
}

function hud(){
  const pp=Math.round(pl.hp/pl.max*100),ep=Math.round(en.hp/en.max*100),col=p=>p>50?'#22c55e':p>25?'#eab308':'#ef4444';
  $('pf').style.width=$('pl').style.width=pp+'%';$('pf').style.background=col(pp);$('pt').textContent=pp+'%';
  $('ef').style.width=$('el').style.width=ep+'%';$('et').textContent=ep+'%';
  $('pu').style.width=pl.ult+'%';$('bSk').classList.toggle('rdy',pl.ult>=100);
  $('dsc').style.height=Math.max(0,pl.dashCd/1.1)*100+'%';$('tm').textContent=Math.max(0,Math.ceil(timeLeft));
}

let last=performance.now();
function loop(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;perf=now;
  if(hitstop>0){hitstop-=dt;dt*=.1;}
  update(dt);fx(dt);draw(dt);hud();
  requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
