<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIIPBATTLE // CINEMATIC ARENA</title>
<style>
:root{
  --p-col:#56e9ff; --e-col:#ff5470; --cy:#56e9ff; --gn:#4ade80; --rd:#ff5470; --am:#ffc857;
  --bg-dark:#05080f;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg-dark);overflow:hidden;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;pointer-events:none}
.fb{background:rgba(10,15,25,.85);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:8px 12px;backdrop-filter:blur(10px);min-width:0;position:relative;box-shadow:0 5px 15px rgba(0,0,0,.5)}
.fb.p{clip-path:polygon(0 0, 100% 0, 95% 100%, 0% 100%);border-left:3px solid var(--p-col)}
.fb.e{clip-path:polygon(0 0, 100% 0, 100% 100%, 5% 100%);border-right:3px solid var(--e-col);text-align:right}
.nm{font-size:12px;font-weight:900;letter-spacing:.1em;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;text-transform:uppercase}
.fb.e .nm{flex-direction:row-reverse}
.nm span:first-child{overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px currentColor}
.bar{height:14px;margin-top:6px;border-radius:2px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;width:100%;background:var(--gn);transition:width .15s,background .3s;box-shadow:inset 0 0 10px rgba(255,255,255,.5)}
.bar i.l{background:rgba(255,255,255,.4);transition:width .7s .25s}
.fb.p .bar i{background:linear-gradient(90deg, #4ade80, #22c55e)}
.fb.e .bar i{background:linear-gradient(270deg, #ef4444, #b91c1c)}
.ub{height:5px;margin-top:5px;border-radius:3px;background:rgba(0,0,0,.8);overflow:hidden}
.ub i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),#a894ff);transition:width .2s;box-shadow:0 0 10px var(--cy)}
.tm{font-size:28px;font-weight:950;text-align:center;min-width:64px;text-shadow:0 0 15px #fff, 0 0 30px var(--am);color:var(--am);font-style:italic}
.tm small{display:block;font-size:9px;letter-spacing:.2em;color:#9fb0c8;font-style:normal;text-shadow:none}
.exit{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 75px);padding:8px 14px;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#fff;background:rgba(255,84,112,.2);border:1px solid rgba(255,84,112,.6);text-decoration:none;backdrop-filter:blur(4px);transition:all .2s}
.exit:active{background:var(--rd);color:#fff}
#zone{position:fixed;left:0;bottom:0;width:50%;height:40%;z-index:5}
#base{display:none;position:fixed;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.05);pointer-events:none;z-index:5}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid #fff;box-shadow:0 0 20px rgba(255,255,255,.5);backdrop-filter:blur(5px)}
.btns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 25px);z-index:5;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.b{width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;font:900 12px inherit;letter-spacing:.05em;backdrop-filter:blur(8px);box-shadow:0 5px 15px rgba(0,0,0,.6);position:relative;overflow:hidden;transition:transform .1s}
.b:active{transform:scale(.9)}
.b.atk{width:90px;height:90px;font-size:16px;background:rgba(74,222,128,.2);border-color:var(--gn);color:var(--gn);grid-column:2;text-shadow:0 0 10px var(--gn)}
.b.sk{background:rgba(86,233,255,.1);border-color:var(--cy);color:var(--cy)}
.b.sk.rdy{background:rgba(86,233,255,.4);box-shadow:0 0 30px var(--cy);animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.05);box-shadow:0 0 50px var(--cy)}}
.b .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7);transition:height .1s}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,6,12,.85);backdrop-filter:blur(8px);transition:opacity .4s}
.ov.h{opacity:0;pointer-events:none}
.vs{display:flex;align-items:center;justify-content:center;width:100%;height:60vh;position:relative;overflow:hidden;margin-bottom:20px}
.vs-bg{position:absolute;inset:0;z-index:0;opacity:.6}
.vs-bg::before, .vs-bg::after{content:'';position:absolute;top:0;bottom:0;width:50%}
.vs-bg::before{left:0;background:radial-gradient(circle at 30% 50%, var(--p-col), transparent 70%);animation:pulse 4s infinite alternate}
.vs-bg::after{right:0;background:radial-gradient(circle at 70% 50%, var(--e-col), transparent 70%);animation:pulse 4s infinite alternate-reverse}
.vc{display:flex;flex-direction:column;align-items:center;width:45vw;max-width:350px;position:relative;z-index:2}
.vc img{width:100%;height:min(35vh,280px);object-fit:contain;transition:transform .3s}
.vc.p{animation:inL .8s cubic-bezier(.2,.9,.2,1) both}
.vc.e{animation:inR .8s cubic-bezier(.2,.9,.2,1) both}
.vc.p img{filter:drop-shadow(0 0 25px var(--p-col))}
.vc.e img{filter:drop-shadow(0 0 25px var(--e-col))}
.name-box{background:linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.4));border-left:4px solid var(--p-col);padding:5px 15px;margin-top:10px;transform:skewX(-15deg)}
.vc.e .name-box{border-left:none;border-right:4px solid var(--e-col);background:linear-gradient(270deg, rgba(0,0,0,.8), rgba(0,0,0,.4))}
.vc b{font-size:24px;letter-spacing:.15em;font-style:italic;text-transform:uppercase;text-shadow:2px 2px 0 #000;display:block;transform:skewX(15deg)}
.vc.p b{color:var(--p-col)}
.vc.e b{color:var(--e-col)}
.move-tag{background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:900;letter-spacing:.1em;margin-top:8px;text-transform:uppercase;box-shadow:0 0 15px rgba(0,0,0,.8)}
.vc.p .move-tag{color:var(--p-col);border-color:var(--p-col)}
.vc.e .move-tag{color:var(--e-col);border-color:var(--e-col)}
.vs-center{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center}
.vsx{font-size:60px;font-weight:950;font-style:italic;letter-spacing:.05em;color:#fff;text-shadow:0 0 30px #fff, 0 0 60px var(--am);animation:pop .5s .4s both;line-height:1}
.pokeball-split{width:4px;height:200px;background:linear-gradient(180deg, transparent, #fff, transparent);margin-top:10px;box-shadow:0 0 20px #fff;animation:pop .5s .6s both}
@keyframes inL{from{transform:translateX(-150%) skewX(10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(150%) skewX(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{from{opacity:.3}to{opacity:.8}}
.big{font-size:clamp(60px,20vw,120px);font-weight:950;letter-spacing:.1em;font-style:italic;text-shadow:0 0 40px var(--gn), 0 0 80px var(--gn);animation:pop .4s ease both;position:absolute;z-index:10}
.sub{font-size:14px;letter-spacing:.3em;color:#9fb0c8;text-transform:uppercase;margin-top:10px;font-weight:800}
.res{width:min(90vw,380px);padding:30px;border-radius:12px;background:linear-gradient(145deg,#0f1a30,#05080f);border:2px solid var(--cy);box-shadow:0 0 50px rgba(86,233,255,.3), inset 0 0 20px rgba(0,0,0,.8);transform:skewX(-5deg)}
.res h2{margin:0;font-size:48px;letter-spacing:.1em;font-style:italic;text-shadow:0 0 20px currentColor}
.stars{font-size:36px;letter-spacing:8px;margin:20px 0;color:var(--am);text-shadow:0 0 20px var(--am)}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;transform:skewX(5deg)}
.rw div{padding:12px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:11px;color:#9fb0c8;letter-spacing:.1em;font-weight:800}
.rw b{display:block;color:#fff;font-size:22px;margin-top:4px;text-shadow:0 0 10px #fff}
.ra{display:flex;gap:12px;transform:skewX(5deg)}
.ra button,.ra a{flex:1;min-height:50px;border-radius:6px;border:0;font:900 12px inherit;letter-spacing:.15em;display:grid;place-items:center;text-decoration:none;color:#05080f;background:linear-gradient(100deg,var(--cy),#a894ff);box-shadow:0 0 20px rgba(86,233,255,.4);transition:transform .1s}
.ra button:active,.ra a:active{transform:scale(.95)}
.ra a{background:rgba(255,255,255,.1);color:#d9e2f5;border:1px solid rgba(255,255,255,.2);box-shadow:none}
#note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translate(-50%,-20px);z-index:15;padding:10px 20px;border-radius:6px;font-size:12px;font-weight:900;letter-spacing:.15em;text-align:center;white-space:nowrap;color:#05080f;background:linear-gradient(100deg,var(--am),#fff);box-shadow:0 0 30px var(--am);opacity:0;pointer-events:none;transition:.3s;text-transform:uppercase}
#note.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="fb p"><div class="nm"><span id="pn" style="color:var(--gn)">PLAYER</span><span id="pt">100%</span></div>
    <div class="bar"><i class="l" id="pl"></i><i id="pf"></i></div><div class="ub"><i id="pu"></i></div></div>
  <div class="tm"><span id="tm">90</span><small>TIME</small></div>
  <div class="fb e"><div class="nm"><span id="et">100%</span><span id="en" style="color:var(--rd)">ENEMY</span></div>
    <div class="bar"><i class="l" id="el"></i><i id="ef" style="background:var(--rd)"></i></div></div>
</div>
<a class="exit" href="index.html" onclick="AudioManager.stopAll()">KELUAR</a>

<div id="zone"></div><div id="base"><div id="knob"></div></div>
<div class="btns">
  <button class="b sk" id="bSk">SKILL<span class="cdv" id="skc"></span></button>
  <button class="b" id="bDs">DASH<span class="cdv" id="dsc"></span></button>
  <button class="b atk" id="bAk">ATK</button>
</div>

<div id="note"></div>

<div class="ov" id="intro">
  <div class="vs-bg" id="vsBg"></div>
  <div class="vs">
    <div class="vc p" id="pBox">
      <img id="vi1" alt="">
      <div class="name-box"><b id="vn1"></b></div>
      <div class="move-tag" id="pm1">ULTIMATE</div>
    </div>
    <div class="vs-center">
      <div class="vsx">VS</div>
      <div class="pokeball-split"></div>
    </div>
    <div class="vc e" id="eBox">
      <img id="vi2" alt="">
      <div class="name-box"><b id="vn2"></b></div>

    </div>
  </div>

</div>

<div class="ov h" id="end"><div class="res">
  <h2 id="rt">VICTORY</h2><div class="stars" id="rs"></div>
  <div class="rw"><div>EXP<b id="rx">+0</b></div><div>SISA HP<b id="rh">0%</b></div><div>COMBO MAX<b id="rc">0</b></div><div>DAMAGE<b id="rd">0</b></div></div>
  <div class="ra"><button id="again">REMATCH</button><a id="menu" href="index.html">MENU</a></div>
</div></div>

<script>
'use strict';

/* ==========================================================
   DATA KARAKTER
   ========================================================== */
const R={
pichu:['Pichu','#ffc857',120,85,60,110,'Thunder Impact'],pikachu:['Pikachu','#ffc857',140,105,70,130,'Thunderbolt'],raichu:['Raichu','#ffaa33',180,130,90,140,'Thunder'],
charmander:['Charmander','#ff7b61',180,125,95,100,'Inferno Wing'],charmeleon:['Charmeleon','#ff7b61',200,140,105,115,'Flamethrower'],charizard:['Charizard','#ff5533',240,160,120,135,'Blast Burn'],
froakie:['Froakie','#54c9ff',150,120,82,135,'Aqua Shuriken'],frogadier:['Frogadier','#54c9ff',170,132,90,145,'Water Shuriken'],greninja:['Greninja','#4aa8ff',200,155,105,165,'Hydro Storm'],
mew:['Mew','#bf8cff',210,145,110,130,'Psystrike Nova'],mewtwo:['Mewtwo','#bf8cff',260,170,115,150,'Psystrike'],
bulbasaur:['Bulbasaur','#7ee69d',115,62,68,45,'Solar Vine'],ivysaur:['Ivysaur','#7ee69d',135,80,85,60,'Razor Leaf'],venusaur:['Venusaur','#7ee69d',180,110,115,80,'Frenzy Plant'],
squirtle:['Squirtle','#72dfff',125,64,82,43,'Tidal Shell'],wartortle:['Wartortle','#72dfff',145,82,100,58,'Aqua Tail'],blastoise:['Blastoise','#72dfff',190,115,135,78,'Hydro Cannon'],
riolu:['Riolu','#5fafff',165,130,90,95,'Aura Sphere'],lucario:['Lucario','#5fafff',200,155,110,120,'Aura Storm'],
gastly:['Gastly','#a883ff',155,105,70,118,'Shadow Ambush'],haunter:['Haunter','#a883ff',170,115,80,130,'Shadow Punch'],gengar:['Gengar','#a883ff',190,130,95,145,'Shadow Ball'],
rayquaza:['Rayquaza','#66e29b',260,165,120,145,'Sky Rupture'],
eevee:['Eevee','#f2bd7b',130,72,68,88,'Genome Shift'],vaporeon:['Vaporeon','#54c9ff',230,100,100,90,'Hydro Pump'],jolteon:['Jolteon','#ffd84d',150,95,90,165,'Thunder Fang'],
flareon:['Flareon','#ff7b61',150,165,95,90,'Flare Blitz'],espeon:['Espeon','#e08cff',140,75,90,135,'Psychic Prism'],umbreon:['Umbreon','#8fa3ff',210,85,130,75,'Moonlight Curse'],
leafeon:['Leafeon','#7ee69d',140,135,150,95,'Leaf Blade'],glaceon:['Glaceon','#8fe8ff',140,80,130,95,'Glacial Lance'],sylveon:['Sylveon','#ffb3d9',190,85,95,80,'Moonblast']};
const ALIAS={vaporeon:'favoreon'};

const FX={pichu:'elec',pikachu:'elec',raichu:'elec',jolteon:'elec',charmander:'fire',charmeleon:'fire',charizard:'fire',flareon:'fire',froakie:'water',frogadier:'water',greninja:'water',squirtle:'water',wartortle:'water',blastoise:'water',vaporeon:'water',glaceon:'water',bulbasaur:'grass',ivysaur:'grass',venusaur:'grass',leafeon:'grass',mew:'psy',mewtwo:'psy',espeon:'psy',gastly:'ghost',haunter:'ghost',gengar:'ghost',umbreon:'ghost',riolu:'aura',lucario:'aura',rayquaza:'dragon'};
const FX_COLORS={elec:'#ffe14d',fire:'#ff7b61',water:'#54c9ff',grass:'#7ee69d',psy:'#e08cff',ghost:'#a883ff',aura:'#5fafff',dragon:'#66e29b',normal:'#ffffff'};

/* ============================================================
   KONFIGURASI SPRITESHEET
   ============================================================
   SEMUA karakter yang punya file di assets/ didaftarkan di sini.
   Battle spritesheet: 6 kolom × 4 baris = 24 frame
     - Baris 0: Idle
     - Baris 1: Walk
     - Baris 2: Run
     - Baris 3: Attack
   
   Ultimate spritesheet: 8 kolom × 6 baris = 48 frame
     - Baris 0: Anticipation
     - Baris 1: Charge
     - Baris 2: Wind-up
     - Baris 3: Lunge
     - Baris 4: Release
     - Baris 5: Recovery
   ============================================================ */

// Daftar semua karakter yang punya spritesheet battle di folder assets/
const ALL_CHARS = [
  'pichu','pikachu','charmander','froakie','bulbasaur','squirtle',
  'riolu','gastly','mew','rayquaza','eevee'
];

// Battle spritesheet: 6×4 = 24 frame
const SHEETS = {};
ALL_CHARS.forEach(id => {
  SHEETS[id] = { src: `assets/${id}-spritesheet.png`, cols: 6, rows: 4 };
});

// Ultimate spritesheet: 8×6 = 48 frame
const ULT_SHEETS = {};
Object.keys(R).forEach(id => {
  ULT_SHEETS[id] = {
    src: `assets/${id}-ultimate-spritesheet.png`,
    cols: 8,
    rows: 6,
    fps: 14,
    phases: {
      anticipation: { row: 0, start: 0, end: 7 },
      charge:       { row: 1, start: 0, end: 7 },
      windup:       { row: 2, start: 0, end: 7 },
      lunge:        { row: 3, start: 0, end: 7 },
      release:      { row: 4, start: 0, end: 7 },
      recovery:     { row: 5, start: 0, end: 7 }
    }
  };
});

const SHEET_CACHE={};
function loadSheet(id){
  if(SHEET_CACHE[id]) return SHEET_CACHE[id];
  const cfg=SHEETS[id];
  if(!cfg) return null;
  const sh=SHEET_CACHE[id]={cols:cfg.cols,rows:cfg.rows,ready:false,img:new Image()};
  sh.img.onload=()=>{analyze(sh);sh.ready=true};
  sh.img.src=cfg.src;
  return sh;
}

// ANALYZE — sudah support 4 baris
function analyze(sh){
  const im=sh.img, cw=im.naturalWidth/sh.cols, ch=im.naturalHeight/sh.rows;
  sh.cw=Math.floor(cw); sh.ch=Math.floor(ch);
  
  // Default values untuk semua baris
  let feet=[], ax=cw*.43, bw=cw*.58, bh=ch*.67, atkN=Math.max(2,sh.cols-1);
  
  // Deteksi sampai 4 baris
  for(let r=0; r<sh.rows; r++) feet.push(ch*.85);
  
  try{
    const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x=c.getContext('2d'); x.drawImage(im,0,0);
    const box=(r,k)=>{
      const d=x.getImageData(Math.round(k*cw),Math.round(r*ch),sh.cw,sh.ch).data;
      let x0=1e9,x1=-1,y0=1e9,y1=-1;
      for(let yy=0;yy<sh.ch;yy++) for(let xx=0;xx<sh.cw;xx++){
        if(d[(yy*sh.cw+xx)*4+3]>40){
          if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy;
        }
      }
      return x1<0?null:{x0,x1,y0,y1,h:y1-y0,w:x1-x0};
    };
    const med=a=>a.slice().sort((p,q)=>p-q)[a.length>>1];
    
    // Analisis baris 0 (idle), baris 3 (attack) untuk anchor point
    const B=[0,3].map(r => Array.from({length:sh.cols},(_,k)=>box(r,k)));
    const ok = B.map(b => b.filter(Boolean));
    
    // Untuk feet, hitung dari baris 0
    if(ok[0] && ok[0].length){
      // Baris 0 = idle
      feet[0] = med(ok[0].map(f=>f.y1));
      ax = med(ok[0].map(f=>(f.x0+f.x1)/2));
      bw = med(ok[0].map(f=>f.w));
      bh = med(ok[0].map(f=>f.h));
    }
    // Baris lain pakai default yang sama
    for(let r=1; r<sh.rows; r++) feet[r] = feet[0];
    
    // Attack frame count dari baris 3
    if(ok[1] && ok[1].length){
      const mh=med(ok[1].map(f=>f.h)); let n=0;
      for(const f of B[1]){ if(f&&f.h>=mh*.7)n++; else break; }
      atkN=Math.max(2,n);
    }
  }catch(e){}
  
  sh.feet=feet; sh.ax=ax; sh.bh=bh; sh.atkN=atkN; sh.mz=[bw*.55,-bh*.39];
}

const Q=new URLSearchParams(location.search);
const pid=R[Q.get('char')]?Q.get('char'):'pikachu';
const arenaN=Q.get('arena')==='2'?'2':'1';
const ids=Object.keys(R).filter(i=>i!==pid);
const eid=(R[Q.get('enemy')]&&Q.get('enemy')!==pid)?Q.get('enemy'):ids[Math.floor(Math.random()*ids.length)];
const $=id=>document.getElementById(id);

/* ==========================================================
   AUDIO
   ========================================================== */
const AudioManager={cache:new Map(),music:null,
 init(){this.music=new Audio('assets/audio/background.mp3');this.music.loop=true;this.music.volume=.18},
 play(n,v=.5){try{let a=this.cache.get(n);if(!a){a=new Audio(`assets/audio/${n}.mp3`);this.cache.set(n,a)}a.currentTime=0;a.volume=v;a.play().catch(()=>{})}catch(e){}},
 startMusic(){if(this.music)this.music.play().catch(()=>{})},
 stopAll(){if(this.music){this.music.pause();this.music.currentTime=0}this.cache.forEach(a=>{a.pause();a.currentTime=0})}};
AudioManager.init();
document.addEventListener('pointerdown',()=>AudioManager.startMusic(),{once:true});
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ==========================================================
   CANVAS & ARENA
   ========================================================== */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const arena=()=>({cx:W/2,cy:H*.62,rx:W*.42,ry:H*.15});
function clampE(e){const A=arena(),nx=(e.x-A.cx)/A.rx,ny=(e.y-A.cy)/A.ry,d=Math.hypot(nx,ny);if(d>1){e.x=A.cx+nx/d*A.rx;e.y=A.cy+ny/d*A.ry}}
const bg=new Image();bg.src=arenaN==='2'?'assets/arena-forestbattle-2.png':'assets/arena-forest.png';

function mk(id,isP){
  const d=R[id];
  const e={
    id, isP, n:d[0].toUpperCase(), col:d[1], max:d[2], hp:d[2], atk:d[3], def:d[4], spd:d[5], mv:d[6],
    x:0, y:0, face:1, cd:0, dashT:0, dashCd:0, dvx:0, dvy:0, inv:0, flash:0, atkT:0, wind:0,
    kind:'shot', lunge:null, ph:Math.random()*6, moving:false, ult:0, kx:0, ky:0,
    ai:{t:1.5,dir:1}, img:loadImg(id), size:Math.min(W*.3,165)*(.9+d[2]/1200), an:0,
    atkAnim:-1, pend:false, run:false,
    state:'IDLE', stateTime:0,
    vx:0, vy:0,
    hitScaleX:1, hitScaleY:1, hitRotation:0
  };
  if(SHEETS[id]) e.sheet=loadSheet(id);
  e.fx=FX[id]||'normal';
  return e;
}

let cameraZoom=1.0, cameraTargetZoom=1.0, cameraShake=0, cameraPunch=0;
let ultAnim = null;
const stick={x:0,y:0},K={};let atkHeld=false;

  const A=arena();
  pl.x=A.cx-A.rx*.45; pl.y=A.cy+A.ry*.45;
  en.x=A.cx+A.rx*.45; en.y=A.cy-A.ry*.25;
  proj=[]; flashA=0; parts=[]; texts=[]; rings=[];
  timeLeft=90; shake=0; hitstop=0; combo=0; maxCombo=0; dmgDone=0; state='intro';
  cameraZoom=1.0; cameraTargetZoom=1.0; cameraShake=0; cameraPunch=0;
  ultAnim=null;
  
  const pCol = FX_COLORS[pl.fx] || pl.col;
  const eCol = FX_COLORS[en.fx] || en.col;
  document.documentElement.style.setProperty('--p-col', pCol);

    im.onerror=()=>{im.onerror=null; im.src=`assets/images/${id}.png`};
    im.src=`assets/images/${ALIAS[id]||id}.png`;
    box.style.animation='none'; void box.offsetWidth; box.style.animation='';
  });
  $('vn1').textContent=pl.n; $('vn2').textContent=en.n; $('isub').textContent=`ARENA ${arenaN}`;
  const seq=['3','2','1','FIGHT!']; let i=0;

const dmgOf=(a,d,m=1)=>Math.max(4,a*.2*100/(100+d*.6))*m*(.9+Math.random()*.2);
const body=e=>({x:e.x,y:e.y-e.size*.4});
const hasS=e=>!!(e.sheet&&e.sheet.ready);
const persp=e=>{const A=arena();return .85+.3*Math.min(1,Math.max(0,(e.y-(A.cy-A.ry))/(A.ry*2)))};
function muzzle(e){const sc=e.size*persp(e)/(e.sheet.bh*1.19);return{x:e.x+e.face*e.sheet.mz[0]*sc,y:e.y-3+e.sheet.mz[1]*sc}}

function spawnVFX(x, y, type, intensity = 1, isGround = false) {
  const count = Math.floor(3 + 5 * intensity);
  for (let i = 0; i < count; i++) {
    let color, vx, vy, size, life, shape;
    const angle = Math.random() * Math.PI * 2;
    const speed = (30 + Math.random() * 100) * intensity;
    if (type === 'elec') { color = Math.random() > 0.5 ? '#ffe14d' : '#56b8ff'; vx = Math.cos(angle) * speed * 1.5; vy = Math.sin(angle) * speed * 0.5 - 30; size = 2 + Math.random() * 3; life = 0.25 + Math.random() * 0.25; shape = 'spark'; }
    else if (type === 'fire') { color = Math.random() > 0.5 ? '#ff7b61' : '#ffc857'; vx = Math.cos(angle) * speed * 0.5; vy = Math.sin(angle) * speed * 0.5 - 50; size = 3 + Math.random() * 4; life = 0.35 + Math.random() * 0.35; shape = 'circle'; }
    else if (type === 'water') { color = '#54c9ff'; vx = Math.cos(angle) * speed * 0.7; vy = Math.sin(angle) * speed * 0.7 - 25; size = 2 + Math.random() * 3; life = 0.3 + Math.random() * 0.3; shape = 'circle'; }
    else if (type === 'grass') { color = Math.random() > 0.5 ? '#7ee69d' : '#4ade80'; vx = Math.cos(angle) * speed * 0.8; vy = Math.sin(angle) * speed * 0.8 - 40; size = 3 + Math.random() * 3; life = 0.4 + Math.random() * 0.4; shape = 'diamond'; }
    else if (type === 'psy') { color = '#e08cff'; vx = Math.cos(angle) * speed * 0.6; vy = Math.sin(angle) * speed * 0.6; size = 3 + Math.random() * 3; life = 0.5 + Math.random() * 0.5; shape = 'circle'; }
    else if (type === 'ghost') { color = Math.random() > 0.5 ? '#a883ff' : '#4a1a8a'; vx = Math.cos(angle) * speed * 0.5; vy = Math.sin(angle) * speed * 0.5; size = 4 + Math.random() * 4; life = 0.5 + Math.random() * 0.5; shape = 'circle'; }
    else if (type === 'aura') { color = Math.random() > 0.5 ? '#5fafff' : '#ffffff'; vx = Math.cos(angle) * speed * 0.9; vy = Math.sin(angle) * speed * 0.9; size = 2 + Math.random() * 3; life = 0.3 + Math.random() * 0.3; shape = 'spark'; }
    else if (type === 'dragon') { color = Math.random() > 0.5 ? '#66e29b' : '#ffffff'; vx = Math.cos(angle) * speed * 1.2; vy = Math.sin(angle) * speed * 1.2; size = 3 + Math.random() * 3; life = 0.4 + Math.random() * 0.4; shape = 'line'; }
    else { color = '#ffffff'; vx = Math.cos(angle) * speed; vy = Math.sin(angle) * speed; size = 2 + Math.random() * 3; life = 0.2 + Math.random() * 0.2; shape = 'circle'; }
    if (isGround) { vy = -Math.abs(vy) * 0.5; vx *= 1.5; }
    parts.push({ x, y, vx, vy, life, maxLife: life, color, size, shape, rotation: Math.random()*6.28, rotSpeed: (Math.random()-0.5)*10, gravity: 150 });
  }
}

function fireProjectile(attacker, target, type, speedMult = 1) {
  const b = body(attacker), tb = body(target);
  const angle = Math.atan2(tb.y - b.y, tb.x - b.x);
  const speed = W * 0.8 * speedMult;
  proj.push({
    x: b.x, y: b.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: Math.max(12, attacker.size * 0.15),
    from: attacker.isP, fx: type, col: FX_COLORS[type] || attacker.col,
    dmg: dmgOf(attacker.atk, target.def, attacker.isP ? 1.5 : 1),
    l: 2, trail: [], rotation: 0, rotSpeed: (Math.random() - 0.5) * 8
  });
}

function triggerImpact(target, sourceX, sourceY, type, dmg) {
  const b = body(target);
  const dx = target.x - sourceX, dy = target.y - sourceY;
  const dist = Math.hypot(dx, dy) || 1;
  
  flashA = 0.45;
  cameraShake = 15;
  cameraPunch = 0.8;
  hitstop = 0.07;
  
  target.kx = (dx / dist) * 400;
  target.ky = (dy / dist) * 220;
  target.flash = 0.15;
  target.inv = 0.2;
  target.hp = Math.max(0, target.hp - dmg);
  target.hitScaleX = 1.15;
  target.hitScaleY = 0.85;
  target.hitRotation = (Math.random() - 0.5) * 0.3;
  
  rings.push({ x: target.x, y: target.y, r: 10, max: target.size * 2, c: FX_COLORS[type] || '#fff', l: 0.5, w: 8 });
  rings.push({ x: target.x, y: target.y, r: 5, max: target.size * 1.5, c: '#ffffff', l: 0.4, w: 5 });
  
  spawnVFX(b.x, b.y, type, 2.5);
  spawnVFX(b.x, b.y, 'normal', 1.5);
  
  texts.push({ x: b.x, y: b.y - target.size * 0.3, t: `-${Math.round(dmg)}`, l: 0.8, c: target.isP ? '#ff7b8f' : '#ffe27a', s: 24 });
  
  AudioManager.play('scan', 0.6);
  vib(60);
  cameraTargetZoom = 1.1;
  
  if (target.isP) { combo = 0; gainUlt(7); }
  else { combo++; maxCombo = Math.max(maxCombo, combo); dmgDone += dmg; gainUlt(9); }
}

function gainUlt(v){
  pl.ult=Math.min(100,pl.ult+v);
  if(pl.ult>=100&&!pl.ultReady){
    pl.ultReady=true;
    notify(`⚡ ${pl.mv.toUpperCase()} SIAP! TEKAN SKILL`);
    AudioManager.play('success',.6);
    vib([40,30,40]);
  }
}

function atk(){
  if(pl.cd>0||state!=='play'||pl.state!=='IDLE')return;
  if(hasS(pl)){pl.cd=.5;pl.atkAnim=0;pl.pend=true;return}
  pl.cd=.34;pl.atkT=.2;fireProjectile(pl,en,pl.fx,1);AudioManager.play('button',.35);
}
function skill(){
  if(state!=='play'||pl.ult<100||pl.state!=='IDLE')return;
  pl.ult=0;pl.ultReady=false;
  state='ult';
  startUltAnimation(pl);
}
function dash(){
  if(pl.dashCd>0||state!=='play'||pl.state!=='IDLE')return;
  let dx=stick.x+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0);
  let dy=stick.y+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);
  if(!dx&&!dy){dx=en.x-pl.x;dy=en.y-pl.y}
  const d=Math.hypot(dx,dy)||1;
  pl.dvx=dx/d; pl.dvy=dy/d; pl.dashT=.18; pl.inv=.35; pl.dashCd=1.1;
  spawnVFX(pl.x, pl.y, 'normal', 0.8, true);
  AudioManager.play('select',.4);
}

/* ==========================================================
   ANIMASI ULTIMATE
   ========================================================== */
function startUltAnimation(e){
  const cfg = ULT_SHEETS[e.id];
  const img = new Image();
  img.crossOrigin = "Anonymous";
  
  img.onload = () => {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.naturalWidth;
    tempCanvas.height = img.naturalHeight;
    const tCtx = tempCanvas.getContext('2d');
    tCtx.drawImage(img, 0, 0);
    const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) data[i+3] = 0;
    }
    tCtx.putImageData(imgData, 0, 0);
    const cleanImg = new Image();
    cleanImg.src = tempCanvas.toDataURL();
    
    ultAnim = {
      img: cleanImg,
      startTime: performance.now(),
      duration: 3500,
      cols: cfg.cols,
      rows: cfg.rows,
      fps: cfg.fps,
      phases: cfg.phases,
      timer: null
    };
    
    if(AudioManager.music) AudioManager.music.pause();
    AudioManager.play('ultimate', .8);
    
    ultAnim.timer = setTimeout(() => {
      if(ultAnim) { clearTimeout(ultAnim.timer); ultAnim = null; koEnemy(); }
    }, ultAnim.duration + 2000);
  };
  
  img.onerror = () => {
    img.onerror = null;
    img.src = `assets/images/${e.id}.png`;
    ultAnim = { img: img, startTime: performance.now(), duration: 2000, cols:1, rows:1, fps:1, phases:null, timer: null };
    if(AudioManager.music) AudioManager.music.pause();
    AudioManager.play('ultimate', .8);
    ultAnim.timer = setTimeout(() => { if(ultAnim) { clearTimeout(ultAnim.timer); ultAnim = null; koEnemy(); } }, 4000);
  };
  
  img.src = cfg.src;
}

function koEnemy(){
  en.hp=0;en.inv=0;const b=body(en);
  for(let i=0;i<50;i++){const a=Math.random()*6.283,s=300+Math.random()*300;parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,l:.6+Math.random()*.4,m:1,c:'#ffffff',s:3+Math.random()*5,shape:'circle',gravity:300})}
  rings.push({x:en.x,y:en.y,r:10,max:W*.8,c:pl.col,l:.6,w:12});
  texts.push({x:b.x,y:b.y-en.size*.4,t:'K.O.!',l:1.2,c:'#ffe27a',s:44});
  flashA=.9;shake=18;hitstop=.12;AudioManager.play('ultimate',.8);vib([60,40,120]);
  state='play';
  finish(true);
}

/* ==========================================================
   UPDATE LOOP
   ========================================================== */
function update(dt){
  if(state !== 'play') return;
  timeLeft -= dt;
  
  cameraZoom += (cameraTargetZoom - cameraZoom) * dt * 6;
  cameraTargetZoom += (1.0 - cameraTargetZoom) * dt * 2;
  cameraShake = Math.max(0, cameraShake - dt * 50);
  cameraPunch = Math.max(0, cameraPunch - dt * 3);
  
  // PLAYER
  let ix=stick.x+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0);
  let iy=stick.y+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);
  const il=Math.hypot(ix,iy); if(il>1){ix/=il;iy/=il}
  
  pl.moving=il>.1;
  if(pl.dashT>0){
    pl.dashT-=dt; pl.run=true;
    pl.x+=pl.dvx*spdOf(pl)*3.6*dt;
    pl.y+=pl.dvy*spdOf(pl)*2.2*dt;
    spawnVFX(pl.x, pl.y, 'normal', 0.3, true);
  } else {
    const run=il>.75,m=hasS(pl)?(run?1:.62):1,sl=pl.atkAnim>=0?.45:1;
    pl.x+=ix*spdOf(pl)*m*sl*dt; pl.y+=iy*spdOf(pl)*.6*m*sl*dt;
    pl.run=run&&pl.moving;
    if(pl.run&&Math.random()<dt*14) spawnVFX(pl.x-pl.face*8, pl.y, 'normal', 0.2, true);
  }
  pl.x+=pl.kx*dt; pl.y+=pl.ky*dt; pl.kx*=.88; pl.ky*=.88;
  pl.face=en.x>=pl.x?1:-1; clampE(pl);
  pl.an+=dt;
  
  if(pl.atkAnim>=0){
    pl.atkAnim+=dt;
    if(pl.pend&&pl.atkAnim>=.15){pl.pend=false;fireProjectile(pl,en,pl.fx,1);AudioManager.play('ultimate',.3)}
    if(pl.sheet&&Math.random()<.6){const b=body(pl);spawnVFX(b.x,b.y,pl.fx,0.3)}
    if(pl.atkAnim>=.42){pl.atkAnim=-1;pl.pend=false}
  }
  
  if(pl.hitScaleX!==1){ pl.hitScaleX += (1-pl.hitScaleX)*dt*8; }
  if(pl.hitScaleY!==1){ pl.hitScaleY += (1-pl.hitScaleY)*dt*8; }
  if(pl.hitRotation!==0){ pl.hitRotation *= (1-dt*8); }
  
  pl.cd-=dt; pl.dashCd-=dt; pl.inv-=dt; pl.flash-=dt; pl.atkT-=dt;
  if(atkHeld||K.Space||K.KeyJ)atk();
  
  // ENEMY AI
  const a=en.ai,dx=pl.x-en.x,dy=pl.y-en.y,dl=Math.hypot(dx,dy)||1,hard=en.hp<en.max*.5;
  en.face=dx>=0?1:-1;let mx=0,my=0;
  if(en.lunge){const L=en.lunge;L.t-=dt;en.x+=L.vx*dt;en.y+=L.vy*dt*.6;
    if(!L.hit&&Math.hypot(pl.x-en.x,(pl.y-en.y)*1.6)<en.size*.5){L.hit=triggerImpact(pl,en.x,en.y,en.fx,dmgOf(en.atk,pl.def,1.1))}
    if(L.t<=0)en.lunge=null}
  else if(en.wind>0){en.wind-=dt;if(en.wind<=0){
    if(en.kind==='lunge'){en.lunge={t:.3,vx:dx/dl*W*1.5,vy:dy/dl*W*1.5,hit:false};AudioManager.play('select',.4)}
    else{fireProjectile(en,pl,en.fx,0.8);en.atkAnim=0;if(hard){fireProjectile(en,pl,en.fx,0.8)}AudioManager.play('button',.35)}
    en.atkT=.2;a.t=(hard?.9:1.3)+Math.random()*1}}
  else{
    const want=W*.3,r=dl>want*1.15?1:dl<want*.7?-1:0,nx=dx/dl,ny=dy/dl;
    mx=nx*r-ny*a.dir*.8;my=ny*r+nx*a.dir*.8;a.t-=dt;
    if(Math.random()<dt*.4)a.dir*=-1;
    if(a.t<=0){en.wind=.55;en.kind=Math.random()<.3?'lunge':'shot'}}
  en.moving=!!(mx||my);
  const es=spdOf(en)*.75;en.x+=mx*es*dt+en.kx*dt;en.y+=my*es*dt*.6+en.ky*dt;en.kx*=.88;en.ky*=.88;clampE(en);
  en.an+=dt;
  if(en.atkAnim>=0){en.atkAnim+=dt;if(en.atkAnim>=.42)en.atkAnim=-1}
  en.inv-=dt;en.flash-=dt;en.atkT-=dt;
  
  if(en.hitScaleX!==1){ en.hitScaleX += (1-en.hitScaleX)*dt*8; }
  if(en.hitScaleY!==1){ en.hitScaleY += (1-en.hitScaleY)*dt*8; }
  if(en.hitRotation!==0){ en.hitRotation *= (1-dt*8); }
  
  // Proyektil
  for(let i=proj.length-1;i>=0;i--){
    const p=proj[i];
    p.trail.push({x:p.x,y:p.y,l:0.25});
    if(p.trail.length>15)p.trail.shift();
    for(let j=0;j<p.trail.length;j++)p.trail[j].l-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt;
    p.rotation+=p.rotSpeed*dt;
    if(Math.random()<0.5)spawnVFX(p.x,p.y,p.fx,0.3);
    const t=p.from?en:pl,b=body(t);
    if(Math.hypot(p.x-b.x,p.y-b.y)<t.size*0.4){
      triggerImpact(t,p.x,p.y,p.fx,p.dmg);
      proj.splice(i,1); continue;
    }
    if(p.l<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)proj.splice(i,1);
  }
  
  if(en.hp<=0)finish(true);else if(pl.hp<=0)finish(false);else if(timeLeft<=0)finish(pl.hp/pl.max>=en.hp/en.max);
}

function finish(win){
  state='over';const ratio=pl.hp/pl.max,stars=win?(ratio>.6?3:ratio>.3?2:1):0,exp=win?80+stars*40:20;
  try{const s=JSON.parse(localStorage.getItem('biipbattle-state')||'{}');s.exp=(s.exp||0)+exp;localStorage.setItem('biipbattle-state',JSON.stringify(s))}catch(e){}
  AudioManager.play(win?'success':'error',.7);
  setTimeout(()=>{
    $('rt').textContent=win?'VICTORY':'DEFEAT';
    $('rt').style.color=win?'var(--gn)':'var(--rd)';
    $('rs').textContent=win?'★'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆';
    $('rx').textContent='+'+exp; $('rh').textContent=Math.round(ratio*100)+'%';
    $('rc').textContent=maxCombo; $('rd').textContent=dmgDone;
    $('menu').href=`index.html?char=${pid}`; $('end').classList.remove('h');
  }, win?900:500);
}

const spdOf=e=>W*.32*(.7+e.spd/300);

/* ==========================================================
   RENDER
   ========================================================== */
function drawBg(){
  if(bg.complete&&bg.naturalWidth){
    const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight);
    const w=bg.naturalWidth*s, h=bg.naturalHeight*s;
    ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h);
  } else { ctx.fillStyle='#07150e'; ctx.fillRect(0,0,W,H); }
}

// DRAW SHEET — diperbaiki untuk 4 baris (Idle, Walk, Run, Attack)
function drawSheet(e,sz){
  const sh=e.sheet;
  if(!sh || !sh.ready) return;
  
  const s=sz/(sh.bh*1.19);
  
  // Mapping baris:
  // Baris 0: Idle
  // Baris 1: Walk
  // Baris 2: Run
  // Baris 3: Attack
  let row=0, fr=0;
  
  if(e.atkAnim>=0){
    // Attack sedang berjalan
    row = 3;
    fr = Math.min(sh.atkN-1, Math.floor(e.atkAnim/.42*sh.atkN));
  }
  else if(e.moving || e.dashT>0 || e.lunge){
    if(e.run){
      // Run (baris 2)
      row = 2;
      fr = Math.floor(e.an*14) % sh.cols;
    } else {
      // Walk (baris 1)
      row = 1;
      fr = Math.floor(e.an*8) % sh.cols;
    }
  }
  else {
    // Idle (baris 0)
    row = 0;
    fr = Math.floor(e.an*5) % sh.cols;
  }
  
  // Pastikan row tidak melebihi jumlah baris
  if(row >= sh.rows) row = sh.rows - 1;
  
  if(e.run && row===2) ctx.rotate(.11*e.face);
  ctx.scale(e.face,1);
  
  // Ambil feet untuk row ini (jika tidak ada, pakai feet[0])
  const feetY = sh.feet[row] !== undefined ? sh.feet[row] : sh.feet[0];
  
  ctx.drawImage(
    sh.img,
    Math.round(fr*sh.img.naturalWidth/sh.cols),
    Math.round(row*sh.img.naturalHeight/sh.rows),
    sh.cw, sh.ch,
    -sh.ax*s, -feetY*s,
    sh.cw*s, sh.ch*s
  );
}

function drawEnt(e){
  const A=arena(),k=.85+.3*Math.min(1,Math.max(0,(e.y-(A.cy-A.ry))/(A.ry*2))),sz=e.size*k,t=perf/1000;
  const bob=Math.sin(t*(e.moving?11:3.5)+e.ph)*(e.moving?4:2.5)*k;
  
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(e.x,e.y,sz*.32,sz*.09,0,0,6.283); ctx.fill();
  
  const fxColor = FX_COLORS[e.fx] || e.col;
  const auraGrd = ctx.createRadialGradient(e.x, e.y-sz*.4, 0, e.x, e.y-sz*.4, sz*1.2);
  auraGrd.addColorStop(0, fxColor + '40');
  auraGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = auraGrd;
  ctx.beginPath(); ctx.arc(e.x, e.y-sz*.4, sz*1.2, 0, 6.283); ctx.fill();
  
  if(e.wind>0){const p=1-e.wind/.55;ctx.strokeStyle=`rgba(255,84,112,${.3+.5*p})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(e.x,e.y,sz*(.5-.2*p),sz*(.14-.05*p),0,0,6.283);ctx.stroke()}
  if(e.dashT>0)ctx.globalAlpha=.55;
  if(e.hp<=0)ctx.globalAlpha=.35+.25*Math.sin(perf/40);
  
  const im=e.img,useS=hasS(e);
  ctx.save();
  ctx.translate(e.x,e.y-3-(useS?0:Math.abs(bob)));
  if(e.hitRotation) ctx.rotate(e.hitRotation);
  if(e.flash>0)ctx.filter='brightness(2.6)';
  else if(e.inv>0&&e.isP)ctx.globalAlpha=.7;
  ctx.shadowColor=fxColor;ctx.shadowBlur=20;
  
  if(useS){ 
    drawSheet(e,sz); 
  } else if(im.complete&&im.naturalWidth){
    const s=sz/Math.max(im.naturalWidth,im.naturalHeight);
    const w=im.naturalWidth*s,h=im.naturalHeight*s;
    ctx.scale(e.face*(e.hitScaleX||1),(e.hitScaleY||1));
    ctx.drawImage(im,-w/2,-h,w,h);
  } else {
    ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(0,-sz*.4,sz*.3,0,6.283);ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
  
  if(!e.isP){const w=sz*.6,x=e.x-w/2,y=e.y-sz-8;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-1,y-1,w+2,7);ctx.fillStyle='#ff5470';ctx.fillRect(x,y,w*e.hp/e.max,5)}
  else{ctx.fillStyle='#4ade80';ctx.beginPath();ctx.moveTo(e.x,e.y+14);ctx.lineTo(e.x-6,e.y+24);ctx.lineTo(e.x+6,e.y+24);ctx.fill()}
}

function drawUltAnimation(){
  if(!ultAnim) return;
  const now = performance.now();
  const elapsed = now - ultAnim.startTime;
  const progress = elapsed / ultAnim.duration;
  
  if(progress >= 1){
    clearTimeout(ultAnim.timer);
    ultAnim = null;
    koEnemy();
    return;
  }
  
  if(!ultAnim.img.complete || !ultAnim.img.naturalWidth) return;
  
  let phaseName = 'anticipation';
  let phaseProgress = 0;
  if (progress < 0.15) { phaseName = 'anticipation'; phaseProgress = progress / 0.15; }
  else if (progress < 0.35) { phaseName = 'charge'; phaseProgress = (progress - 0.15) / 0.20; }
  else if (progress < 0.50) { phaseName = 'windup'; phaseProgress = (progress - 0.35) / 0.15; }
  else if (progress < 0.70) { phaseName = 'lunge'; phaseProgress = (progress - 0.50) / 0.20; }
  else if (progress < 0.85) { phaseName = 'release'; phaseProgress = (progress - 0.70) / 0.15; }
  else { phaseName = 'recovery'; phaseProgress = (progress - 0.85) / 0.15; }
  
  const phase = ultAnim.phases ? ultAnim.phases[phaseName] : null;
  const totalFrames = ultAnim.cols * ultAnim.rows;
  const frameIndex = Math.floor(progress * totalFrames);
  
  let col, row;
  if (phase) {
    const frameInPhase = Math.floor(phaseProgress * (phase.end - phase.start + 1));
    col = Math.min(ultAnim.cols - 1, phase.start + frameInPhase);
    row = Math.min(ultAnim.rows - 1, phase.row);
  } else {
    col = frameIndex % ultAnim.cols;
    row = Math.floor(frameIndex / ultAnim.cols);
  }
  
  const cw = ultAnim.img.naturalWidth / ultAnim.cols;
  const ch = ultAnim.img.naturalHeight / ultAnim.rows;
  
  let offsetX = 0, offsetY = 0, scaleX = 1, scaleY = 1;
  
  if (phaseName === 'anticipation') {
    offsetY = phaseProgress * 15;
    scaleY = 1 - phaseProgress * 0.1;
    scaleX = 1 + phaseProgress * 0.05;
  } else if (phaseName === 'charge') {
    offsetY = 15 - phaseProgress * 10;
    scaleY = 0.9 + phaseProgress * 0.1;
    scaleX = 1.05 - phaseProgress * 0.05;
    offsetX = Math.sin(phaseProgress * 30) * 2;
  } else if (phaseName === 'windup') {
    offsetX = -phaseProgress * 30 * pl.face;
    scaleX = 1 + phaseProgress * 0.1;
    scaleY = 1 - phaseProgress * 0.05;
  } else if (phaseName === 'lunge') {
    offsetX = 30 * pl.face - phaseProgress * 80 * pl.face;
    scaleX = 1.1 - phaseProgress * 0.1;
    scaleY = 0.95 + phaseProgress * 0.05;
  } else if (phaseName === 'release') {
    offsetX = -50 * pl.face + phaseProgress * 20 * pl.face;
    scaleX = 1 + phaseProgress * 0.15;
    scaleY = 1 - phaseProgress * 0.1;
  } else if (phaseName === 'recovery') {
    offsetX = -30 * pl.face * (1 - phaseProgress);
    scaleX = 1 + (1 - phaseProgress) * 0.1;
    scaleY = 0.9 + phaseProgress * 0.1;
  }
  
  const A = arena();
  const k = .85 + .3 * Math.min(1, Math.max(0, (pl.y - (A.cy - A.ry)) / (A.ry * 2)));
  const sz = pl.size * k * 1.4;
  const scale = sz / Math.max(cw, ch);
  const dw = cw * scale;
  const dh = ch * scale;
  
  const dx = pl.x - dw/2 + offsetX;
  const dy = pl.y - dh + offsetY;
  
  const fxColor = FX_COLORS[pl.fx] || pl.col;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const auraIntensity = phaseName === 'charge' ? 0.5 + phaseProgress * 0.5 : 0.3;
  const auraGrd = ctx.createRadialGradient(pl.x, pl.y - sz/2, 0, pl.x, pl.y - sz/2, sz*1.8);
  auraGrd.addColorStop(0, fxColor + Math.floor(auraIntensity * 200).toString(16).padStart(2, '0'));
  auraGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = auraGrd;
  ctx.beginPath(); ctx.arc(pl.x, pl.y - sz/2, sz*1.8, 0, 6.283); ctx.fill();
  ctx.restore();
  
  if (Math.random() < 0.7) {
    spawnVFX(pl.x + offsetX, pl.y - sz*0.5 + offsetY, pl.fx, phaseName === 'charge' ? 1.2 : 0.6);
  }
  
  ctx.save();
  ctx.translate(dx + dw/2, dy + dh);
  ctx.scale(scaleX, scaleY);
  ctx.shadowColor = fxColor;
  ctx.shadowBlur = 30;
  ctx.drawImage(ultAnim.img, col*cw, row*ch, cw, ch, -dw/2, -dh, dw, dh);
  ctx.restore();
  
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = '900 28px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = fxColor;
  ctx.shadowBlur = 20;
  ctx.fillText(pl.mv.toUpperCase(), W/2, H * 0.25);
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '700 11px Inter, sans-serif';
  ctx.fillText(phaseName.toUpperCase(), W/2, H * 0.30);
  
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '800 12px Inter, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('KETUK UNTUK SKIP', W - 20, H - 30);
  ctx.textAlign = 'center';
}

function drawProjectile(p) {
  const fx = p.fx;
  
  if (p.trail.length > 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < p.trail.length; i++) {
      const tr = p.trail[i];
      const alpha = Math.max(0, tr.l / 0.25);
      if (alpha <= 0) continue;
      if (fx === 'elec') {
        ctx.strokeStyle = `rgba(255, 225, 77, ${alpha})`;
        ctx.lineWidth = p.r * 0.5 * alpha;
        ctx.beginPath();
        ctx.moveTo(tr.x, tr.y);
        const next = p.trail[i+1] || p.trail[i];
        ctx.lineTo(next.x, next.y);
        ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(${hexToRgb(p.col)}, ${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, p.r * 0.7 * alpha, 0, 6.283);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  
  if (fx === 'elec') {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 25;
    ctx.beginPath();
    const len = W * 0.2; const angle = Math.atan2(p.vy, p.vx);
    let px = p.x - Math.cos(angle)*len, py = p.y - Math.sin(angle)*len;
    ctx.moveTo(px, py);
    for(let j=0; j<6; j++){
      px += Math.cos(angle)*(len/6) + (Math.random()-0.5)*25;
      py += Math.sin(angle)*(len/6) + (Math.random()-0.5)*25;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#ffe14d'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3, 0, 6.283); ctx.fill();
  } else if (fx === 'fire') {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#ffc857'); g.addColorStop(0.7, '#ff7b61'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3, 0, 6.283); ctx.fill();
  } else if (fx === 'water') {
    ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r*2.5);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#54c9ff'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.r*2.5, 0, 6.283); ctx.fill();
  } else if (fx === 'grass') {
    ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r*2.5);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#7ee69d'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.r*2.5, 0, 6.283); ctx.fill();
  } else if (fx === 'psy') {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#e08cff'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*3, 0, 6.283); ctx.fill();
  } else if (fx === 'ghost') {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.5);
    g.addColorStop(0, 'rgba(20,0,40,0.9)'); g.addColorStop(0.5, '#a883ff'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.5, 0, 6.283); ctx.fill();
  } else if (fx === 'aura') {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.5);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#5fafff'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.5, 0, 6.283); ctx.fill();
  } else if (fx === 'dragon') {
    ctx.strokeStyle = '#72f0bd'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    const len = W * 0.2; const angle = Math.atan2(p.vy, p.vx);
    ctx.beginPath(); ctx.moveTo(p.x - Math.cos(angle)*len, p.y - Math.sin(angle)*len); ctx.lineTo(p.x, p.y); ctx.stroke();
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.5);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#66e29b'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.5, 0, 6.283); ctx.fill();
  } else {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, p.col); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `${r},${g},${b}`;
}

function drawVFX(){
  ctx.globalCompositeOperation='lighter';
  for(const q of parts){
    const alpha = Math.max(0, q.life / q.maxLife);
    if(alpha <= 0) continue;
    ctx.globalAlpha = alpha;
    const shape = q.shape || 'circle';
    const size = q.size * (0.5 + alpha * 0.5);
    if (shape === 'spark') {
      ctx.strokeStyle = q.color; ctx.lineWidth = 2 * alpha;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx*0.02, q.y - q.vy*0.02); ctx.stroke();
    } else if (shape === 'diamond') {
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rotation || 0);
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (shape === 'line') {
      ctx.strokeStyle = q.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx*0.03, q.y - q.vy*0.03); ctx.stroke();
    } else {
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, size, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for(const r of rings){
    const alpha = Math.max(0, r.l / 0.6);
    if(alpha <= 0) continue;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = r.c; ctx.lineWidth = (r.w || 8) * alpha;
    ctx.beginPath(); ctx.ellipse(r.x, r.y - 20, r.r, r.r * 0.45, 0, 0, 6.283); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function draw(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  
  ctx.save();
  const zoom = cameraZoom;
  const shakeX = (Math.random()-0.5) * cameraShake;
  const shakeY = (Math.random()-0.5) * cameraShake;
  const punchZoom = 1 + cameraPunch * 0.04;
  ctx.translate(W/2 + shakeX, H/2 + shakeY);
  ctx.scale(zoom * punchZoom, zoom * punchZoom);
  ctx.translate(-W/2, -H/2);
  
  if (state === 'ult' && ultAnim) {
    ctx.fillStyle = 'rgba(2,6,12,0.7)'; ctx.fillRect(0,0,W,H);
  }
  drawBg();
  
  if (state === 'ult' && ultAnim) {
    const list = [en, pl].sort((a,b)=>a.y-b.y);
    list.forEach(e => {
      if (e === pl) drawUltAnimation();
      else drawEnt(e);
    });
  } else {
    [pl,en].sort((a,b)=>a.y-b.y).forEach(drawEnt);
  }
  
  for(const p of proj) drawProjectile(p);
  
  drawVFX();
  
  ctx.textAlign='center'; ctx.lineJoin='round';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.l*2);
    ctx.font=`900 ${t.s}px Inter,sans-serif`;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.strokeText(t.t,t.x,t.y);
    ctx.fillStyle=t.c; ctx.fillText(t.t,t.x,t.y);
  }
  if(combo>1){
    ctx.globalAlpha=1; ctx.font='900 18px Inter,sans-serif';
    ctx.fillStyle='#ffc857'; ctx.strokeStyle='#000'; ctx.lineWidth=4;
    const s=`${combo} HIT COMBO`;
    ctx.strokeText(s,W/2,H*.2); ctx.fillText(s,W/2,H*.2);
  }
  ctx.restore();
  
  if(flashA>0){ctx.fillStyle=`rgba(255,250,200,${flashA})`;ctx.fillRect(0,0,W,H)}
  
  if(state !== 'ult'){
    const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);
    v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,.6)');
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }
}

function fx(dt){
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += (q.gravity || 150) * dt;
    q.vx *= 0.96; q.vy *= 0.96;
    q.life -= dt;
    if(q.life <= 0) parts.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=50*dt;t.l-=dt;if(t.l<=0)texts.splice(i,1)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.max-r.r)*Math.min(1,dt*7);r.l-=dt;if(r.l<=0)rings.splice(i,1)}
  shake=Math.max(0,shake-dt*40); flashA=Math.max(0,flashA-dt*2.2);
}

function hud(){
  const pp=Math.round(pl.hp/pl.max*100),ep=Math.round(en.hp/en.max*100),col=p=>p>50?'#22c55e':p>25?'#eab308':'#ef4444';
  $('pf').style.width=$('pl').style.width=pp+'%';$('pf').style.background=col(pp);$('pt').textContent=pp+'%';
  $('ef').style.width=$('el').style.width=ep+'%';$('et').textContent=ep+'%';
  $('pu').style.width=pl.ult+'%';$('bSk').classList.toggle('rdy',pl.ult>=100);
  $('dsc').style.height=Math.max(0,pl.dashCd/1.1)*100+'%';$('tm').textContent=Math.max(0,Math.ceil(timeLeft));
}

let last=performance.now();
function loop(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;perf=now;
  if(hitstop>0){hitstop-=dt;dt*=.1}
  update(dt);fx(dt);draw(dt);hud();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
