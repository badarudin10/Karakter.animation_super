<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIIPBATTLE // CINEMATIC ARENA</title>
<style>
:root{
  --p-col:#56e9ff; --e-col:#ff5470; --cy:#56e9ff; --gn:#4ade80; --rd:#ff5470; --am:#ffc857;
  --bg-dark:#05080f;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg-dark);overflow:hidden;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* --- HUD TOP (Gaya Fighting Game) --- */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;pointer-events:none}
.fb{background:rgba(10,15,25,.85);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:8px 12px;backdrop-filter:blur(10px);min-width:0;position:relative;box-shadow:0 5px 15px rgba(0,0,0,.5)}
.fb.p{clip-path:polygon(0 0, 100% 0, 95% 100%, 0% 100%);border-left:3px solid var(--p-col)}
.fb.e{clip-path:polygon(0 0, 100% 0, 100% 100%, 5% 100%);border-right:3px solid var(--e-col);text-align:right}
.nm{font-size:12px;font-weight:900;letter-spacing:.1em;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;text-transform:uppercase}
.fb.e .nm{flex-direction:row-reverse}
.nm span:first-child{overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px currentColor}
.bar{height:14px;margin-top:6px;border-radius:2px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;width:100%;background:var(--gn);transition:width .15s,background .3s;box-shadow:inset 0 0 10px rgba(255,255,255,.5)}
.bar i.l{background:rgba(255,255,255,.4);transition:width .7s .25s}
.fb.p .bar i{background:linear-gradient(90deg, #4ade80, #22c55e)}
.fb.e .bar i{background:linear-gradient(270deg, #ef4444, #b91c1c)}
.ub{height:5px;margin-top:5px;border-radius:3px;background:rgba(0,0,0,.8);overflow:hidden}
.ub i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),#a894ff);transition:width .2s;box-shadow:0 0 10px var(--cy)}
.tm{font-size:28px;font-weight:950;text-align:center;min-width:64px;text-shadow:0 0 15px #fff, 0 0 30px var(--am);color:var(--am);font-style:italic}
.tm small{display:block;font-size:9px;letter-spacing:.2em;color:#9fb0c8;font-style:normal;text-shadow:none}
.exit{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 75px);padding:8px 14px;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#fff;background:rgba(255,84,112,.2);border:1px solid rgba(255,84,112,.6);text-decoration:none;backdrop-filter:blur(4px);transition:all .2s}
.exit:active{background:var(--rd);color:#fff}

/* --- KONTROL BAWAH --- */
#zone{position:fixed;left:0;bottom:0;width:50%;height:40%;z-index:5}
#base{display:none;position:fixed;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.05);pointer-events:none;z-index:5}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid #fff;box-shadow:0 0 20px rgba(255,255,255,.5);backdrop-filter:blur(5px)}
.btns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 25px);z-index:5;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.b{width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;font:900 12px inherit;letter-spacing:.05em;backdrop-filter:blur(8px);box-shadow:0 5px 15px rgba(0,0,0,.6);position:relative;overflow:hidden;transition:transform .1s}
.b:active{transform:scale(.9)}
.b.atk{width:90px;height:90px;font-size:16px;background:rgba(74,222,128,.2);border-color:var(--gn);color:var(--gn);grid-column:2;text-shadow:0 0 10px var(--gn)}
.b.sk{background:rgba(86,233,255,.1);border-color:var(--cy);color:var(--cy)}
.b.sk.rdy{background:rgba(86,233,255,.4);box-shadow:0 0 30px var(--cy);animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.05);box-shadow:0 0 50px var(--cy)}}
.b .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.7);transition:height .1s}

/* --- LAYAR INTRO (CINEMATIC STYLE) --- */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,6,12,.85);backdrop-filter:blur(8px);transition:opacity .4s}
.ov.h{opacity:0;pointer-events:none}

.vs{display:flex;align-items:center;justify-content:center;width:100%;height:60vh;position:relative;overflow:hidden;margin-bottom:20px}

/* Efek Latar Belakang Elemental */
.vs-bg{position:absolute;inset:0;z-index:0;opacity:.6}
.vs-bg::before, .vs-bg::after{content:'';position:absolute;top:0;bottom:0;width:50%}
.vs-bg::before{left:0;background:radial-gradient(circle at 30% 50%, var(--p-col), transparent 70%);animation:pulse 4s infinite alternate}
.vs-bg::after{right:0;background:radial-gradient(circle at 70% 50%, var(--e-col), transparent 70%);animation:pulse 4s infinite alternate-reverse}

.vc{display:flex;flex-direction:column;align-items:center;width:45vw;max-width:350px;position:relative;z-index:2}
.vc img{width:100%;height:min(35vh,280px);object-fit:contain;transition:transform .3s}
.vc.p{animation:inL .8s cubic-bezier(.2,.9,.2,1) both}
.vc.e{animation:inR .8s cubic-bezier(.2,.9,.2,1) both}
.vc.p img{filter:drop-shadow(0 0 25px var(--p-col))}
.vc.e img{filter:drop-shadow(0 0 25px var(--e-col))}

.name-box{background:linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.4));border-left:4px solid var(--p-col);padding:5px 15px;margin-top:10px;transform:skewX(-15deg)}
.vc.e .name-box{border-left:none;border-right:4px solid var(--e-col);background:linear-gradient(270deg, rgba(0,0,0,.8), rgba(0,0,0,.4))}
.vc b{font-size:24px;letter-spacing:.15em;font-style:italic;text-transform:uppercase;text-shadow:2px 2px 0 #000;display:block;transform:skewX(15deg)}
.vc.p b{color:var(--p-col)}
.vc.e b{color:var(--e-col)}

/* Tagline Jurus (AURA POWER VS NINJA SPEED) */
.move-tag{background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:900;letter-spacing:.1em;margin-top:8px;text-transform:uppercase;box-shadow:0 0 15px rgba(0,0,0,.8)}
.vc.p .move-tag{color:var(--p-col);border-color:var(--p-col)}
.vc.e .move-tag{color:var(--e-col);border-color:var(--e-col)}

/* Center VS Text */
.vs-center{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center}
.vsx{font-size:60px;font-weight:950;font-style:italic;letter-spacing:.05em;color:#fff;text-shadow:0 0 30px #fff, 0 0 60px var(--am);animation:pop .5s .4s both;line-height:1}
.pokeball-split{width:4px;height:200px;background:linear-gradient(180deg, transparent, #fff, transparent);margin-top:10px;box-shadow:0 0 20px #fff;animation:pop .5s .6s both}

@keyframes inL{from{transform:translateX(-150%) skewX(10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(150%) skewX(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{from{opacity:.3}to{opacity:.8}}

.big{font-size:clamp(60px,20vw,120px);font-weight:950;letter-spacing:.1em;font-style:italic;text-shadow:0 0 40px var(--gn), 0 0 80px var(--gn);animation:pop .4s ease both;position:absolute;z-index:10}
.sub{font-size:14px;letter-spacing:.3em;color:#9fb0c8;text-transform:uppercase;margin-top:10px;font-weight:800}

/* --- LAYAR AKHIR --- */
.res{width:min(90vw,380px);padding:30px;border-radius:12px;background:linear-gradient(145deg,#0f1a30,#05080f);border:2px solid var(--cy);box-shadow:0 0 50px rgba(86,233,255,.3), inset 0 0 20px rgba(0,0,0,.8);transform:skewX(-5deg)}
.res h2{margin:0;font-size:48px;letter-spacing:.1em;font-style:italic;text-shadow:0 0 20px currentColor}
.stars{font-size:36px;letter-spacing:8px;margin:10px 0;color:var(--am);text-shadow:0 0 20px var(--am)}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;transform:skewX(5deg)}
.rw div{padding:12px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:11px;color:#9fb0c8;letter-spacing:.1em;font-weight:800}
.rw b{display:block;color:#fff;font-size:22px;margin-top:4px;text-shadow:0 0 10px #fff}
.ra{display:flex;gap:12px;transform:skewX(5deg)}
.ra button,.ra a{flex:1;min-height:50px;border-radius:6px;border:0;font:900 12px inherit;letter-spacing:.15em;display:grid;place-items:center;text-decoration:none;color:#05080f;background:linear-gradient(100deg,var(--cy),#a894ff);box-shadow:0 0 20px rgba(86,233,255,.4);transition:transform .1s}
.ra button:active,.ra a:active{transform:scale(.95)}
.ra a{background:rgba(255,255,255,.1);color:#d9e2f5;border:1px solid rgba(255,255,255,.2);box-shadow:none}

#note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translate(-50%,-20px);z-index:15;padding:10px 20px;border-radius:6px;font-size:12px;font-weight:900;letter-spacing:.15em;text-align:center;white-space:nowrap;color:#05080f;background:linear-gradient(100deg,var(--am),#fff);box-shadow:0 0 30px var(--am);opacity:0;pointer-events:none;transition:.3s;text-transform:uppercase}
#note.show{opacity:1;transform:translate(-50%,0)}

#vov{position:fixed;inset:0;z-index:50;background:#000;display:none;align-items:center;justify-content:center}
#vov.on{display:flex}
#uvid{width:100%;height:100%;object-fit:contain;background:#000}
#vskip{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 25px);padding:10px 20px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.6);color:#fff;font:900 12px inherit;letter-spacing:.15em;backdrop-filter:blur(4px)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="fb p"><div class="nm"><span id="pn" style="color:var(--gn)">PLAYER</span><span id="pt">100%</span></div>
    <div class="bar"><i class="l" id="pl"></i><i id="pf"></i></div><div class="ub"><i id="pu"></i></div></div>
  <div class="tm"><span id="tm">90</span><small>TIME</small></div>
  <div class="fb e"><div class="nm"><span id="et">100%</span><span id="en" style="color:var(--rd)">ENEMY</span></div>
    <div class="bar"><i class="l" id="el"></i><i id="ef" style="background:var(--rd)"></i></div></div>
</div>
<a class="exit" href="index.html" onclick="AudioManager.stopAll()">KELUAR</a>

<div id="zone"></div><div id="base"><div id="knob"></div></div>
<div class="btns">
  <button class="b sk" id="bSk">SKILL<span class="cdv" id="skc"></span></button>
  <button class="b" id="bDs">DASH<span class="cdv" id="dsc"></span></button>
  <button class="b atk" id="bAk">ATK</button>
</div>

<div id="note"></div>
<div id="vov"><video id="uvid" playsinline webkit-playsinline preload="auto"></video><button id="vskip" type="button">LEWATI ▶▶</button></div>

<!-- INTRO SCREEN BARU -->
<div class="ov" id="intro">
  <div class="vs-bg" id="vsBg"></div>
  <div class="vs">
    <div class="vc p" id="pBox">
      <img id="vi1" alt="">
      <div class="name-box"><b id="vn1"></b></div>
      <div class="move-tag" id="pm1">AURA POWER</div>
    </div>
    <div class="vs-center">
      <div class="vsx">VS</div>
      <div class="pokeball-split"></div>
    </div>
    <div class="vc e" id="eBox">
      <img id="vi2" alt="">
      <div class="name-box"><b id="vn2"></b></div>
      <div class="move-tag" id="em1">NINJA SPEED</div>
    </div>
  </div>
  <div class="big" id="big">3</div>
  <div class="sub" id="isub">ARENA 1</div>
</div>

<div class="ov h" id="end"><div class="res">
  <h2 id="rt">VICTORY</h2><div class="stars" id="rs"></div>
  <div class="rw"><div>EXP<b id="rx">+0</b></div><div>SISA HP<b id="rh">0%</b></div><div>COMBO MAX<b id="rc">0</b></div><div>DAMAGE<b id="rd">0</b></div></div>
  <div class="ra"><button id="again">REMATCH</button><a id="menu" href="index.html">MENU</a></div>
</div></div>

<script>
'use strict';
/* ---------- DATA ---------- */
const R={
pichu:['Pichu','#ffc857',120,85,60,110,'Thunder Impact'],pikachu:['Pikachu','#ffc857',140,105,70,130,'Thunderbolt'],raichu:['Raichu','#ffaa33',180,130,90,140,'Thunder'],
charmander:['Charmander','#ff7b61',180,125,95,100,'Inferno Wing'],charmeleon:['Charmeleon','#ff7b61',200,140,105,115,'Flamethrower'],charizard:['Charizard','#ff5533',240,160,120,135,'Blast Burn'],
froakie:['Froakie','#54c9ff',150,120,82,135,'Aqua Shuriken'],frogadier:['Frogadier','#54c9ff',170,132,90,145,'Water Shuriken'],greninja:['Greninja','#4aa8ff',200,155,105,165,'Hydro Storm'],
mew:['Mew','#bf8cff',210,145,110,130,'Psystrike Nova'],mewtwo:['Mewtwo','#bf8cff',260,170,115,150,'Psystrike'],
bulbasaur:['Bulbasaur','#7ee69d',115,62,68,45,'Solar Vine'],ivysaur:['Ivysaur','#7ee69d',135,80,85,60,'Razor Leaf'],venusaur:['Venusaur','#7ee69d',180,110,115,80,'Frenzy Plant'],
squirtle:['Squirtle','#72dfff',125,64,82,43,'Tidal Shell'],wartortle:['Wartortle','#72dfff',145,82,100,58,'Aqua Tail'],blastoise:['Blastoise','#72dfff',190,115,135,78,'Hydro Cannon'],
riolu:['Riolu','#5fafff',165,130,90,95,'Aura Sphere'],lucario:['Lucario','#5fafff',200,155,110,120,'Aura Storm'],
gastly:['Gastly','#a883ff',155,105,70,118,'Shadow Ambush'],haunter:['Haunter','#a883ff',170,115,80,130,'Shadow Punch'],gengar:['Gengar','#a883ff',190,130,95,145,'Shadow Ball'],
rayquaza:['Rayquaza','#66e29b',260,165,120,145,'Sky Rupture'],
eevee:['Eevee','#f2bd7b',130,72,68,88,'Genome Shift'],vaporeon:['Vaporeon','#54c9ff',230,100,100,90,'Hydro Pump'],jolteon:['Jolteon','#ffd84d',150,95,90,165,'Thunder Fang'],
flareon:['Flareon','#ff7b61',150,165,95,90,'Flare Blitz'],espeon:['Espeon','#e08cff',140,75,90,135,'Psychic Prism'],umbreon:['Umbreon','#8fa3ff',210,85,130,75,'Moonlight Curse'],
leafeon:['Leafeon','#7ee69d',140,135,150,95,'Leaf Blade'],glaceon:['Glaceon','#8fe8ff',140,80,130,95,'Glacial Lance'],sylveon:['Sylveon','#ffb3d9',190,85,95,80,'Moonblast']};
const ALIAS={vaporeon:'favoreon'};

// Tambahkan konfigurasi warna untuk efek dinamis
const FX={pichu:'elec',pikachu:'elec',raichu:'elec',jolteon:'elec',charmander:'fire',charmeleon:'fire',charizard:'fire',flareon:'fire',froakie:'water',frogadier:'water',greninja:'water',squirtle:'water',wartortle:'water',blastoise:'water',vaporeon:'water',glaceon:'water',bulbasaur:'grass',ivysaur:'grass',venusaur:'grass',leafeon:'grass',mew:'psy',mewtwo:'psy',espeon:'psy',gastly:'ghost',haunter:'ghost',gengar:'ghost',umbreon:'ghost',riolu:'aura',lucario:'aura',rayquaza:'dragon'};
const FX_COLORS={elec:'#ffe14d',fire:'#ff7b61',water:'#54c9ff',grass:'#7ee69d',psy:'#e08cff',ghost:'#a883ff',aura:'#5fafff',dragon:'#66e29b',normal:'#ffffff'};

const SHEETS={};['pichu','pikachu','bulbasaur','squirtle','froakie','riolu','gastly','mew','rayquaza','eevee'].forEach(id=>SHEETS[id]={src:`assets/${id}-spritesheet.png`,cols:6,rows:3});
const SHEET_CACHE={};
function loadSheet(id){
 if(SHEET_CACHE[id])return SHEET_CACHE[id];
 const cfg=SHEETS[id],sh=SHEET_CACHE[id]={cols:cfg.cols,rows:cfg.rows,ready:false,img:new Image()};
 sh.img.onload=()=>{analyze(sh);sh.ready=true};
 sh.img.src=cfg.src;return sh}
function analyze(sh){
 const im=sh.img,cw=im.naturalWidth/sh.cols,ch=im.naturalHeight/sh.rows;sh.cw=Math.floor(cw);sh.ch=Math.floor(ch);
 let feet=[ch*.85,ch*.85,ch*.85],ax=cw*.43,bw=cw*.58,bh=ch*.67,atkN=Math.max(2,sh.cols-1);
 try{
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);
  const box=(r,k)=>{const d=x.getImageData(Math.round(k*cw),Math.round(r*ch),sh.cw,sh.ch).data;let x0=1e9,x1=-1,y0=1e9,y1=-1;
   for(let yy=0;yy<sh.ch;yy++)for(let xx=0;xx<sh.cw;xx++)if(d[(yy*sh.cw+xx)*4+3]>40){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}
   return x1<0?null:{x0,x1,y0,y1,h:y1-y0,w:x1-x0}};
  const med=a=>a.slice().sort((p,q)=>p-q)[a.length>>1];
  const B=[0,1,2].map(r=>Array.from({length:sh.cols},(_,k)=>box(r,k)));
  const ok=B.map(b=>b.filter(Boolean));
  feet=ok.map(b=>b.length?med(b.map(f=>f.y1)):ch*.85);
  if(ok[0].length){ax=med(ok[0].map(f=>(f.x0+f.x1)/2));bw=med(ok[0].map(f=>f.w));bh=med(ok[0].map(f=>f.h))}
  if(ok[2].length){const mh=med(ok[2].map(f=>f.h));let n=0;for(const f of B[2]){if(f&&f.h>=mh*.7)n++;else break}atkN=Math.max(2,n)}
 }catch(e){}
 sh.feet=feet;sh.ax=ax;sh.bh=bh;sh.atkN=atkN;sh.mz=[bw*.55,-bh*.39]}

const Q=new URLSearchParams(location.search);
const pid=R[Q.get('char')]?Q.get('char'):'pikachu'; // Default Pikachu untuk demo
const arenaN=Q.get('arena')==='2'?'2':'1';
const ids=Object.keys(R).filter(i=>i!==pid);
const eid=(R[Q.get('enemy')]&&Q.get('enemy')!==pid)?Q.get('enemy'):ids[Math.floor(Math.random()*ids.length)];
const $=id=>document.getElementById(id);

/* ---------- AUDIO ---------- */
const AudioManager={cache:new Map(),music:null,
 init(){this.music=new Audio('assets/audio/background.mp3');this.music.loop=true;this.music.volume=.18},
 play(n,v=.5){try{let a=this.cache.get(n);if(!a){a=new Audio(`assets/audio/${n}.mp3`);this.cache.set(n,a)}a.currentTime=0;a.volume=v;a.play().catch(()=>{})}catch(e){}},
 startMusic(){if(this.music)this.music.play().catch(()=>{})},
 stopAll(){if(this.music){this.music.pause();this.music.currentTime=0}this.cache.forEach(a=>{a.pause();a.currentTime=0})}};
AudioManager.init();
document.addEventListener('pointerdown',()=>AudioManager.startMusic(),{once:true});
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- CANVAS & ARENA ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const arena=()=>({cx:W/2,cy:H*.62,rx:W*.42,ry:H*.15});
function clampE(e){const A=arena(),nx=(e.x-A.cx)/A.rx,ny=(e.y-A.cy)/A.ry,d=Math.hypot(nx,ny);if(d>1){e.x=A.cx+nx/d*A.rx;e.y=A.cy+ny/d*A.ry}}
const bg=new Image();bg.src=arenaN==='2'?'assets/arena-forestbattle-2.png':'assets/arena-forest.png';
function loadImg(id){const i=new Image();i.onerror=()=>{i.onerror=null;i.src=`assets/images/${id}.png`};i.src=`assets/images/${ALIAS[id]||id}.png`;return i}

/* ---------- ENTITAS ---------- */
function mk(id,isP){const d=R[id];const e={id,isP,n:d[0].toUpperCase(),col:d[1],max:d[2],hp:d[2],atk:d[3],def:d[4],spd:d[5],mv:d[6],x:0,y:0,face:1,cd:0,dashT:0,dashCd:0,dvx:0,dvy:0,inv:0,flash:0,atkT:0,wind:0,kind:'shot',lunge:null,ph:Math.random()*6,moving:false,ult:0,kx:0,ky:0,ai:{t:1.5,dir:1},img:loadImg(id),size:Math.min(W*.3,165)*(.9+d[2]/1200),an:0,atkAnim:-1,pend:false,run:false};

const body=e=>({x:e.x,y:e.y-e.size*.4});

 const b=body(t);burst(b.x,b.y,src.col,14);if(src.fx==='elec'){burst(b.x,b.y,'#fff6a0',26,380);burst(b.x,b.y,'#56b8ff',14,300);rings.push({x:t.x,y:t.y,r:10,max:t.size*1.2,c:'#ffe14d',l:.45});flashA=.3}
 else if(src.fx){rings.push({x:t.x,y:t.y,r:10,max:t.size*.95,c:src.col,l:.35});burst(b.x,b.y,'#ffffff',8,260)}
 texts.push({x:b.x,y:b.y-t.size*.3,t:`-${dmg}`,l:.8,c:t.isP?'#ff7b8f':'#ffe27a',s:t.isP?22:20+Math.min(14,dmg/2)});

 if(!dx&&!dy){dx=en.x-pl.x;dy=en.y-pl.y}const d=Math.hypot(dx,dy)||1;pl.dvx=dx/d;pl.dvy=dy/d;pl.dashT=.18;pl.inv=.35;pl.dashCd=1.1;

/* ---------- UPDATE ---------- */
function update(dt){
 if(state!=='play')return;
 timeLeft-=dt;
 // PLAYER
 let ix=stick.x+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0),iy=stick.y+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);
 const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
 pl.moving=il>.1;
 if(pl.dashT>0){pl.dashT-=dt;pl.run=true;pl.x+=pl.dvx*spdOf(pl)*3.6*dt;pl.y+=pl.dvy*spdOf(pl)*2.2*dt;parts.push({x:pl.x,y:pl.y-pl.size*.3,vx:0,vy:0,l:.25,m:.25,c:pl.col,s:10})}
 else{const run=il>.75,m=hasS(pl)?(run?1:.62):1,sl=pl.atkAnim>=0?.45:1;pl.x+=ix*spdOf(pl)*m*sl*dt;pl.y+=iy*spdOf(pl)*.6*m*sl*dt;pl.run=run&&pl.moving;
  if(pl.run&&Math.random()<dt*14)parts.push({x:pl.x-pl.face*8,y:pl.y-2,vx:-pl.face*30,vy:-20,l:.35,m:.35,c:'#8a7a55',s:6})}
 pl.x+=pl.kx*dt;pl.y+=pl.ky*dt;pl.kx*=.88;pl.ky*=.88;
 pl.face=en.x>=pl.x?1:-1;clampE(pl);
 pl.an+=dt;
 if(pl.atkAnim>=0){pl.atkAnim+=dt;
  if(pl.pend&&pl.atkAnim>=.15){pl.pend=false;fire(pl,en);AudioManager.play('ultimate',.3)}
  if(pl.sheet&&Math.random()<.6){const b=body(pl);parts.push({x:b.x+(Math.random()-.5)*40,y:b.y+(Math.random()-.5)*50,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.3,m:.3,c:pl.col,s:3})}
  if(pl.atkAnim>=.42){pl.atkAnim=-1;pl.pend=false}}
 pl.cd-=dt;pl.dashCd-=dt;pl.inv-=dt;pl.flash-=dt;pl.atkT-=dt;
 if(atkHeld||K.Space||K.KeyJ)atk();
 
 // ENEMY AI
 const a=en.ai,dx=pl.x-en.x,dy=pl.y-en.y,dl=Math.hypot(dx,dy)||1,hard=en.hp<en.max*.5;
 en.face=dx>=0?1:-1;let mx=0,my=0;
 if(en.lunge){const L=en.lunge;L.t-=dt;en.x+=L.vx*dt;en.y+=L.vy*dt*.6;
  if(!L.hit&&Math.hypot(pl.x-en.x,(pl.y-en.y)*1.6)<en.size*.5){L.hit=hurt(pl,dmgOf(en.atk,pl.def,1.1),en,1.6)}
  if(L.t<=0)en.lunge=null}
 else if(en.wind>0){en.wind-=dt;if(en.wind<=0){
   if(en.kind==='lunge'){en.lunge={t:.3,vx:dx/dl*W*1.5,vy:dy/dl*W*1.5,hit:false};AudioManager.play('select',.4)}
   else{fire(en,pl);en.atkAnim=0;if(hard){fire(en,pl,.28);fire(en,pl,-.28)}AudioManager.play('button',.35)}
   en.atkT=.2;a.t=(hard?.9:1.3)+Math.random()*1}}
 else{
  const want=W*.3,r=dl>want*1.15?1:dl<want*.7?-1:0,nx=dx/dl,ny=dy/dl;
  mx=nx*r-ny*a.dir*.8;my=ny*r+nx*a.dir*.8;a.t-=dt;
  if(Math.random()<dt*.4)a.dir*=-1;
  if(a.t<=0){en.wind=.55;en.kind=Math.random()<.3?'lunge':'shot'}}
 en.moving=!!(mx||my);
 const es=spdOf(en)*.75;en.x+=mx*es*dt+en.kx*dt;en.y+=my*es*dt*.6+en.ky*dt;en.kx*=.88;en.ky*=.88;clampE(en);
 en.an+=dt;if(en.atkAnim>=0){en.atkAnim+=dt;if(en.atkAnim>=.42)en.atkAnim=-1}
 en.inv-=dt;en.flash-=dt;en.atkT-=dt;
 
 // PROYEKTIL
 for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;
  parts.push({x:p.x,y:p.y,vx:0,vy:0,l:.2,m:.2,c:p.col,s:p.r*.7});
  const t=p.from?en:pl,b=body(t);
  if(Math.pow((p.x-b.x)/(t.size*.32),2)+Math.pow((p.y-b.y)/(t.size*.4),2)<1&&hurt(t,p.dmg,{x:p.x-p.vx*.01,y:p.y-p.vy*.01,col:p.col,fx:p.fx},1)){proj.splice(i,1);continue}
  if(p.l<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)proj.splice(i,1)}
 
 // END
 if(en.hp<=0)finish(true);else if(pl.hp<=0)finish(false);else if(timeLeft<=0)finish(pl.hp/pl.max>=en.hp/en.max);
}

function finish(win){
 state='over';const ratio=pl.hp/pl.max,stars=win?(ratio>.6?3:ratio>.3?2:1):0,exp=win?80+stars*40:20;
 try{const s=JSON.parse(localStorage.getItem('biipbattle-state')||'{}');s.exp=(s.exp||0)+exp;localStorage.setItem('biipbattle-state',JSON.stringify(s))}catch(e){}
 AudioManager.play(win?'success':'error',.7);if(win)burst(en.x,en.y-60,'#ffd75e',40,420);
 setTimeout(()=>{$('rt').textContent=win?'VICTORY':'DEFEAT';$('rt').style.color=win?'var(--gn)':'var(--rd)';
  $('rs').textContent=win?'★'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆';
  $('rx').textContent='+'+exp;$('rh').textContent=Math.round(ratio*100)+'%';$('rc').textContent=maxCombo;$('rd').textContent=dmgDone;
  $('menu').href=`index.html?char=${pid}`;$('end').classList.remove('h')},win?900:500);
}

/* ---------- RENDER ---------- */
function drawBg(){
 if(bg.complete&&bg.naturalWidth){const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),w=bg.naturalWidth*s,h=bg.naturalHeight*s;ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h)}
 else{ctx.fillStyle='#07150e';ctx.fillRect(0,0,W,H)}
 
 // Tambahkan lapisan gelap (vignette) agar karakter dan efek lebih menonjol
 const vg = ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.8);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,'rgba(0,0,0,0.7)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawSheet(e,sz){const sh=e.sheet,s=sz/(sh.bh*1.19);
 let row=0,fr=0;
 if(e.atkAnim>=0){row=2;fr=Math.min(sh.atkN-1,Math.floor(e.atkAnim/.42*sh.atkN))}
 else if(e.moving||e.dashT>0||e.lunge){row=1;fr=Math.floor(e.an*(e.run?14:8))%sh.cols}
 else fr=Math.floor(e.an*5)%sh.cols;
 if(e.run&&row===1)ctx.rotate(.11*e.face);
 ctx.scale(e.face,1);
 ctx.drawImage(sh.img,Math.round(fr*sh.img.naturalWidth/sh.cols),Math.round(row*sh.img.naturalHeight/sh.rows),sh.cw,sh.ch,-sh.ax*s,-sh.feet[row]*s,sh.cw*s,sh.ch*s)}
 
function drawEnt(e){
 const A=arena(),k=.85+.3*Math.min(1,Math.max(0,(e.y-(A.cy-A.ry))/(A.ry*2))),sz=e.size*k,t=perf/1000;
 const bob=Math.sin(t*(e.moving?11:3.5)+e.ph)*(e.moving?4:2.5)*k;
 let sx=1,sy=1;if(e.atkT>0){const p=e.atkT/.3;sx=1+.18*p;sy=1-.12*p}if(e.wind>0)sy=1+.05*Math.sin(t*50);
 
 // Shadow
 ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(e.x,e.y,sz*.32,sz*.09,0,0,6.283);ctx.fill();
 
 // Efek Aura Elemental di belakang karakter
 const fxColor = FX_COLORS[e.fx] || e.col;
 const auraGrd = ctx.createRadialGradient(e.x, e.y-sz*.4, 0, e.x, e.y-sz*.4, sz*1.2);
 auraGrd.addColorStop(0, fxColor + '40'); // Hex + alpha
 auraGrd.addColorStop(1, 'transparent');
 ctx.fillStyle = auraGrd;
 ctx.beginPath(); ctx.arc(e.x, e.y-sz*.4, sz*1.2, 0, 6.283); ctx.fill();

 if(e.wind>0){const p=1-e.wind/.55;ctx.strokeStyle=`rgba(255,84,112,${.3+.5*p})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(e.x,e.y,sz*(.5-.2*p),sz*(.14-.05*p),0,0,6.283);ctx.stroke()}
 if(e.dashT>0)ctx.globalAlpha=.55;if(e.hp<=0)ctx.globalAlpha=.35+.25*Math.sin(perf/40);
 const im=e.img,useS=hasS(e);ctx.save();ctx.translate(e.x,e.y-3-(useS?0:Math.abs(bob)));
 if(e.flash>0)ctx.filter='brightness(2.6)';else if(e.inv>0&&e.isP)ctx.globalAlpha=.7;
 ctx.shadowColor=fxColor;ctx.shadowBlur=20; // Glow lebih besar
 
 if(useS){drawSheet(e,sz)}else if(im.complete&&im.naturalWidth){const s=sz/Math.max(im.naturalWidth,im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;ctx.scale(e.face*sx,sy);ctx.drawImage(im,-w/2,-h,w,h)}
 else{ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(0,-sz*.4,sz*.3,0,6.283);ctx.fill()}
 ctx.restore();ctx.globalAlpha=1;
 
 if(!e.isP){const w=sz*.6,x=e.x-w/2,y=e.y-sz-8;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-1,y-1,w+2,7);ctx.fillStyle='#ff5470';ctx.fillRect(x,y,w*e.hp/e.max,5)}
 else{ctx.fillStyle='#4ade80';ctx.beginPath();ctx.moveTo(e.x,e.y+14);ctx.lineTo(e.x-6,e.y+24);ctx.lineTo(e.x+6,e.y+24);ctx.fill()}
}
function jag(x1,y1,x2,y2,n,amp){const pts=[[x1,y1]],dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
 for(let i=1;i<n;i++){const t=i/n,j=(Math.random()-.5)*amp*Math.sin(Math.PI*t)*2;pts.push([x1+dx*t+nx*j,y1+dy*t+ny*j])}pts.push([x2,y2]);return pts}
function strokePts(pts,w,c,a){ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
function bolt3(pts,k){strokePts(pts,16*k,'#3da5ff',.28);strokePts(pts,8*k,'#ffe14d',.7);strokePts(pts,3*k,'#ffffff',1)}
function drawBolt(p){ctx.save();ctx.globalCompositeOperation='lighter';const l=Math.hypot(p.vx,p.vy)||1,dx=p.vx/l,dy=p.vy/l,len=W*.24,tx=p.x-dx*len,ty=p.y-dy*len;

 strokePts(jag(tx+dx*len*.4,ty+dy*len*.4,p.x-dx*len*.1+(Math.random()-.5)*60,p.y-dy*len*.1+(Math.random()-.5)*60,5,10),2,'#fff6a0',.7);
 const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.4,'rgba(255,225,77,.5)');g.addColorStop(1,'rgba(255,225,77,0)');

function pillar(s){ctx.save();ctx.globalCompositeOperation='lighter';const a=s.l/.55,w=W*.16*(1.2-a*.4);
 const g=ctx.createLinearGradient(s.x-w,0,s.x+w,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,s.c);g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.globalAlpha=a*.85;ctx.fillStyle=g;ctx.fillRect(s.x-w,0,w*2,s.y);
 const g2=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,W*.28);g2.addColorStop(0,'#fff');g2.addColorStop(1,'rgba(0,0,0,0)');
 ctx.globalAlpha=a*.6;ctx.fillStyle=g2;ctx.beginPath();ctx.ellipse(s.x,s.y,W*.28,W*.11,0,0,6.283);ctx.fill();ctx.restore()}
function drawProj(p){const k=p.fx;if(k==='elec')return drawBolt(p);
 const t=perf/1000,r=p.r,l=Math.hypot(p.vx,p.vy)||1,dx=p.vx/l,dy=p.vy/l;
 const orb=(rr,c0,c1)=>{const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,6.283);ctx.fill()};
 ctx.save();ctx.globalCompositeOperation='lighter';
 if(k==='fire'){orb(r*3,'rgba(255,255,220,.95)','rgba(255,90,20,0)');
  for(let i=0;i<6;i++){const o=Math.random()*r*3;ctx.globalAlpha=.55;ctx.fillStyle=i%2?'#ff8a30':'#ffd24d';ctx.beginPath();ctx.arc(p.x-dx*o*2+(Math.random()-.5)*r,p.y-dy*o*2+(Math.random()-.5)*r,r*(1.3-o/(r*4)),0,6.283);ctx.fill()}}
 else if(k==='water'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.8;orb(r*1.7,'rgba(210,245,255,.9)','rgba(70,170,255,.55)');
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r*1.7,0,6.283);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-r*.5,p.y-r*.6,r*.4,0,6.283);ctx.fill();
  for(let i=1;i<4;i++){ctx.globalAlpha=.5/i;ctx.fillStyle='#8fd6ff';ctx.beginPath();ctx.arc(p.x-dx*r*i*1.6,p.y-dy*r*i*1.6,r*(1.2-i*.25),0,6.283);ctx.fill()}}
 else if(k==='grass'){orb(r*2.4,'rgba(190,255,190,.5)','rgba(60,200,90,0)');
  for(let i=0;i<4;i++){const a=t*16+i*1.57;ctx.save();ctx.translate(p.x+Math.cos(a)*r*1.3,p.y+Math.sin(a)*r*1.3);ctx.rotate(a+1.2);ctx.globalAlpha=.95;ctx.fillStyle=i%2?'#7ee69d':'#b8f5a0';ctx.beginPath();ctx.ellipse(0,0,r*1.5,r*.55,0,0,6.283);ctx.fill();ctx.restore()}}
 else if(k==='psy'){orb(r*3,'rgba(255,255,255,.9)','rgba(190,120,255,0)');
  for(let i=0;i<2;i++){const q=(t*3+i*.5)%1;ctx.globalAlpha=1-q;ctx.strokeStyle='#e0b0ff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,r*(1.2+q*2.6),r*(1.2+q*2.6)*.7,.6,0,6.283);ctx.stroke()}}
 else if(k==='ghost'){ctx.globalCompositeOperation='source-over';orb(r*2,'rgba(20,0,40,.95)','rgba(110,40,190,.2)');ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(190,120,255,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,r*2+Math.sin(t*20)*2,0,6.283);ctx.stroke();
  for(let i=1;i<5;i++){ctx.globalAlpha=.4/i;ctx.fillStyle='#8a4fe0';ctx.beginPath();ctx.arc(p.x-dx*r*i*1.5+Math.sin(t*12+i)*4,p.y-dy*r*i*1.5,r*(1.6-i*.25),0,6.283);ctx.fill()}}
 else if(k==='aura'){orb(r*3,'rgba(255,255,255,.95)','rgba(60,170,255,0)');
  ctx.strokeStyle='#7fd6ff';ctx.lineWidth=3;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(p.x,p.y,r*1.6,0,6.283);ctx.stroke();
  ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(p.x,p.y,r*2.2+Math.sin(t*18)*3,0,6.283);ctx.stroke()}
 else if(k==='dragon'){const len=W*.22,tx=p.x-dx*len,ty=p.y-dy*len;ctx.lineCap='round';
  [[26,'rgba(60,220,160,.28)'],[12,'#72f0bd'],[5,'#ffffff']].forEach(([w,c])=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(p.x,p.y);ctx.stroke()});
  orb(r*2.6,'rgba(255,255,255,.95)','rgba(60,240,180,0)')}
 ctx.restore()}
function drawStrike(s){if(s.k&&s.k!=='elec')return pillar(s);ctx.save();ctx.globalCompositeOperation='lighter';const a=s.l/.55;
 bolt3(jag(s.x+(Math.random()-.5)*30,-20,s.x,s.y-10,14,34),2.2*a+.4);
 bolt3(jag(s.x+(Math.random()-.5)*120,-20,s.x+(Math.random()-.5)*40,s.y-10,12,28),1);
 ctx.globalAlpha=a*.7;const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,W*.3);g.addColorStop(0,'rgba(255,255,220,1)');g.addColorStop(1,'rgba(255,225,77,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(s.x,s.y,W*.3,W*.12,0,0,6.283);ctx.fill();ctx.restore()}
function draw(dt){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
 drawBg();
 [pl,en].sort((a,b)=>a.y-b.y).forEach(drawEnt);
 for(const p of proj){if(p.fx&&p.fx!=='normal'){drawProj(p);continue}const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.2);g.addColorStop(0,'#fff');g.addColorStop(.35,p.col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.2,0,6.283);ctx.fill()}
 ctx.globalCompositeOperation='lighter';
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*(q.l/q.m+.3),0,6.283);ctx.fill()}
 for(const r of rings){ctx.globalAlpha=r.l/.6;ctx.strokeStyle=r.c;ctx.lineWidth=14*(r.l/.6)+2;ctx.beginPath();ctx.ellipse(r.x,r.y-20,r.r,r.r*.45,0,0,6.283);ctx.stroke()}
 for(const s of strikes)drawStrike(s);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.lineJoin='round';
 for(const t of texts){ctx.globalAlpha=Math.min(1,t.l*2);ctx.font=`900 ${t.s}px Inter,sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y)}
 if(combo>1){ctx.globalAlpha=1;ctx.font='900 18px Inter,sans-serif';ctx.fillStyle='#ffc857';ctx.strokeStyle='#000';ctx.lineWidth=4;const s=`${combo} HIT COMBO`;ctx.strokeText(s,W/2,H*.2);ctx.fillText(s,W/2,H*.2)}
 ctx.restore();ctx.globalAlpha=1;
 
 // Vignette di layer atas
 const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 if(flashA>0){ctx.fillStyle=`rgba(255,250,200,${flashA})`;ctx.fillRect(0,0,W,H)}
}
function fx(dt){
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;if((q.l-=dt)<=0)parts.splice(i,1)}
 for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=50*dt;if((t.l-=dt)<=0)texts.splice(i,1)}
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.max-r.r)*Math.min(1,dt*7);if((r.l-=dt)<=0)rings.splice(i,1)}
 shake=Math.max(0,shake-dt*40);flashA=Math.max(0,flashA-dt*2.2);
 for(let i=strikes.length-1;i>=0;i--)if((strikes[i].l-=dt)<=0)strikes.splice(i,1);
}
function hud(){
 const pp=Math.round(pl.hp/pl.max*100),ep=Math.round(en.hp/en.max*100),col=p=>p>50?'#22c55e':p>25?'#eab308':'#ef4444';
 $('pf').style.width=$('pl').style.width=pp+'%';$('pf').style.background=col(pp);$('pt').textContent=pp+'%';
 $('ef').style.width=$('el').style.width=ep+'%';$('et').textContent=ep+'%';
 $('pu').style.width=pl.ult+'%';$('bSk').classList.toggle('rdy',pl.ult>=100);
 $('dsc').style.height=Math.max(0,pl.dashCd/1.1)*100+'%';$('tm').textContent=Math.max(0,Math.ceil(timeLeft));
}

/* ---------- LOOP ---------- */
let last=performance.now();
function loop(now){
 let dt=Math.min(.05,(now-last)/1000);last=now;perf=now;
 if(hitstop>0){hitstop-=dt;dt*=.1}
 update(dt);fx(dt);draw(dt);hud();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
