<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIIPBATTLE // ARENA</title>
<style>
:root{--cy:#56e9ff;--gn:#4ade80;--rd:#ff5470;--am:#ffc857}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020604;overflow:hidden;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;pointer-events:none}
.fb{background:rgba(5,12,10,.72);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 10px;backdrop-filter:blur(8px);min-width:0}
.fb.e{text-align:right;border-color:rgba(255,84,112,.4)}.fb.p{border-color:rgba(74,222,128,.4)}
.nm{font-size:11px;font-weight:900;letter-spacing:.1em;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.nm span:first-child{overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;margin-top:5px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;width:100%;background:var(--gn);transition:width .15s,background .3s}
.bar i.l{background:rgba(255,255,255,.55);transition:width .7s .25s}
.ub{height:4px;margin-top:4px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden}
.ub i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),#a894ff);transition:width .2s}
.tm{font-size:22px;font-weight:950;text-align:center;min-width:54px;text-shadow:0 0 12px rgba(0,0,0,.8)}
.tm small{display:block;font-size:8px;letter-spacing:.2em;color:#9fb0c8}
.exit{position:fixed;z-index:6;right:12px;top:calc(env(safe-area-inset-top,0px) + 70px);padding:6px 11px;border-radius:9px;font-size:10px;font-weight:800;letter-spacing:.1em;color:#fca5a5;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.5);text-decoration:none;backdrop-filter:blur(4px)}
#zone{position:fixed;left:0;bottom:0;width:55%;height:45%;z-index:4}
#base{display:none;position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);pointer-events:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(86,233,255,.55);box-shadow:0 0 18px rgba(86,233,255,.6)}
.btns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;justify-items:end}
.b{width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:900 11px inherit;letter-spacing:.08em;backdrop-filter:blur(6px);box-shadow:0 8px 22px rgba(0,0,0,.5);position:relative;overflow:hidden}
.b:active{transform:scale(.9)}
.b.atk{width:84px;height:84px;font-size:14px;background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.7);color:var(--gn);grid-column:2}
.b.sk{background:rgba(86,233,255,.12);border-color:rgba(86,233,255,.4);color:var(--cy)}
.b.sk.rdy{background:rgba(86,233,255,.4);box-shadow:0 0 26px var(--cy);animation:pl .7s infinite alternate}
.b .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.55)}
@keyframes pl{to{transform:scale(1.08)}}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,6,4,.62);backdrop-filter:blur(5px);transition:opacity .3s}
.ov.h{opacity:0;pointer-events:none}
.big{font-size:clamp(46px,16vw,92px);font-weight:950;letter-spacing:.08em;text-shadow:0 0 34px rgba(74,222,128,.8);animation:pop .5s ease both}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
.sub{font-size:12px;letter-spacing:.14em;color:#9fb0c8;text-transform:uppercase;margin-top:6px;line-height:1.7}
.res{width:min(86vw,340px);padding:22px;border-radius:22px;background:linear-gradient(145deg,#0f1a30,#070b16);border:1px solid rgba(86,233,255,.3);box-shadow:0 30px 80px #000}
.res h2{margin:0;font-size:40px;letter-spacing:.1em}
.stars{font-size:30px;letter-spacing:6px;margin:8px 0;color:var(--am)}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.rw div{padding:9px;border-radius:11px;background:rgba(255,255,255,.05);font-size:10px;color:#9fb0c8;letter-spacing:.1em}
.rw b{display:block;color:#fff;font-size:18px;margin-top:2px}
.ra{display:flex;gap:10px}
.ra button,.ra a{flex:1;min-height:44px;border-radius:12px;border:0;font:900 11px inherit;letter-spacing:.12em;display:grid;place-items:center;text-decoration:none;color:#06101b;background:linear-gradient(100deg,#72f1ff,#a894ff)}
.ra a{background:rgba(255,255,255,.1);color:#d9e2f5;border:1px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="fb p"><div class="nm"><span id="pn" style="color:var(--gn)">PLAYER</span><span id="pt">100%</span></div>
    <div class="bar"><i class="l" id="pl"></i><i id="pf"></i></div><div class="ub"><i id="pu"></i></div></div>
  <div class="tm"><span id="tm">90</span><small>TIME</small></div>
  <div class="fb e"><div class="nm"><span id="et">100%</span><span id="en" style="color:var(--rd)">ENEMY</span></div>
    <div class="bar"><i class="l" id="el"></i><i id="ef" style="background:var(--rd)"></i></div></div>
</div>
<a class="exit" href="index.html" onclick="AudioManager.stopAll()">KELUAR</a>

<div id="zone"></div><div id="base"><div id="knob"></div></div>
<div class="btns">
  <button class="b sk" id="bSk">SKILL<span class="cdv" id="skc"></span></button>
  <button class="b" id="bDs">DASH<span class="cdv" id="dsc"></span></button>
  <button class="b atk" id="bAk">ATK</button>
</div>

<div class="ov" id="intro"><div class="big" id="big">3</div><div class="sub" id="isub"></div></div>
<div class="ov h" id="end"><div class="res">
  <h2 id="rt">VICTORY</h2><div class="stars" id="rs"></div>
  <div class="rw"><div>EXP<b id="rx">+0</b></div><div>SISA HP<b id="rh">0%</b></div><div>COMBO MAX<b id="rc">0</b></div><div>DAMAGE<b id="rd">0</b></div></div>
  <div class="ra"><button id="again">REMATCH</button><a id="menu" href="index.html">MENU</a></div>
</div></div>

<script>
'use strict';
/* ---------- DATA: id -> [nama, warna, hp, atk, def, spd, jurus] ---------- */
const R={
pichu:['Pichu','#ffc857',120,85,60,110,'Thunder Impact'],pikachu:['Pikachu','#ffc857',140,105,70,130,'Thunderbolt'],raichu:['Raichu','#ffaa33',180,130,90,140,'Thunder'],
charmander:['Charmander','#ff7b61',180,125,95,100,'Inferno Wing'],charmeleon:['Charmeleon','#ff7b61',200,140,105,115,'Flamethrower'],charizard:['Charizard','#ff5533',240,160,120,135,'Blast Burn'],
froakie:['Froakie','#54c9ff',150,120,82,135,'Aqua Shuriken'],frogadier:['Frogadier','#54c9ff',170,132,90,145,'Water Shuriken'],greninja:['Greninja','#4aa8ff',200,155,105,165,'Hydro Storm'],
mew:['Mew','#bf8cff',210,145,110,130,'Psystrike Nova'],mewtwo:['Mewtwo','#bf8cff',260,170,115,150,'Psystrike'],
bulbasaur:['Bulbasaur','#7ee69d',115,62,68,45,'Solar Vine'],ivysaur:['Ivysaur','#7ee69d',135,80,85,60,'Razor Leaf'],venusaur:['Venusaur','#7ee69d',180,110,115,80,'Frenzy Plant'],
squirtle:['Squirtle','#72dfff',125,64,82,43,'Tidal Shell'],wartortle:['Wartortle','#72dfff',145,82,100,58,'Aqua Tail'],blastoise:['Blastoise','#72dfff',190,115,135,78,'Hydro Cannon'],
riolu:['Riolu','#5fafff',165,130,90,95,'Aura Sphere'],lucario:['Lucario','#5fafff',200,155,110,120,'Aura Storm'],
gastly:['Gastly','#a883ff',155,105,70,118,'Shadow Ambush'],haunter:['Haunter','#a883ff',170,115,80,130,'Shadow Punch'],gengar:['Gengar','#a883ff',190,130,95,145,'Shadow Ball'],
rayquaza:['Rayquaza','#66e29b',260,165,120,145,'Sky Rupture'],
eevee:['Eevee','#f2bd7b',130,72,68,88,'Genome Shift'],vaporeon:['Vaporeon','#54c9ff',230,100,100,90,'Hydro Pump'],jolteon:['Jolteon','#ffd84d',150,95,90,165,'Thunder Fang'],
flareon:['Flareon','#ff7b61',150,165,95,90,'Flare Blitz'],espeon:['Espeon','#e08cff',140,75,90,135,'Psychic Prism'],umbreon:['Umbreon','#8fa3ff',210,85,130,75,'Moonlight Curse'],
leafeon:['Leafeon','#7ee69d',140,135,150,95,'Leaf Blade'],glaceon:['Glaceon','#8fe8ff',140,80,130,95,'Glacial Lance'],sylveon:['Sylveon','#ffb3d9',190,85,95,80,'Moonblast']};
const ALIAS={vaporeon:'favoreon'};
const Q=new URLSearchParams(location.search);
const pid=R[Q.get('char')]?Q.get('char'):'pichu';
const arenaN=Q.get('arena')==='2'?'2':'1';
const ids=Object.keys(R).filter(i=>i!==pid);
const eid=(R[Q.get('enemy')]&&Q.get('enemy')!==pid)?Q.get('enemy'):ids[Math.floor(Math.random()*ids.length)];
const $=id=>document.getElementById(id);

/* ---------- AUDIO ---------- */
const AudioManager={cache:new Map(),music:null,
 init(){this.music=new Audio('assets/audio/background.mp3');this.music.loop=true;this.music.volume=.18},
 play(n,v=.5){try{let a=this.cache.get(n);if(!a){a=new Audio(`assets/audio/${n}.mp3`);this.cache.set(n,a)}a.currentTime=0;a.volume=v;a.play().catch(()=>{})}catch(e){}},
 startMusic(){if(this.music)this.music.play().catch(()=>{})},
 stopAll(){if(this.music){this.music.pause();this.music.currentTime=0}this.cache.forEach(a=>{a.pause();a.currentTime=0})}};
AudioManager.init();
document.addEventListener('pointerdown',()=>AudioManager.startMusic(),{once:true});
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- CANVAS & ARENA ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const arena=()=>({cx:W/2,cy:H*.62,rx:W*.42,ry:H*.15});
function clampE(e){const A=arena(),nx=(e.x-A.cx)/A.rx,ny=(e.y-A.cy)/A.ry,d=Math.hypot(nx,ny);if(d>1){e.x=A.cx+nx/d*A.rx;e.y=A.cy+ny/d*A.ry}}
const bg=new Image();bg.src=arenaN==='2'?'assets/arena-forestbattle-2.png':'assets/arena-forest.png';
function loadImg(id){const i=new Image();i.onerror=()=>{i.onerror=null;i.src=`assets/images/${id}.png`};i.src=`assets/images/${ALIAS[id]||id}.png`;return i}

/* ---------- ENTITAS ---------- */
function mk(id,isP){const d=R[id];return{id,isP,n:d[0].toUpperCase(),col:d[1],max:d[2],hp:d[2],atk:d[3],def:d[4],spd:d[5],mv:d[6],x:0,y:0,face:1,cd:0,dashT:0,dashCd:0,dvx:0,dvy:0,inv:0,flash:0,atkT:0,wind:0,kind:'shot',lunge:null,ph:Math.random()*6,moving:false,ult:0,kx:0,ky:0,ai:{t:1.5,dir:1},img:loadImg(id),size:Math.min(W*.3,165)*(.9+d[2]/1200)}}
let pl,en,proj,parts,texts,rings,state,timeLeft,shake,hitstop,combo,maxCombo,dmgDone,perf=0;
const stick={x:0,y:0},K={};let atkHeld=false;
function reset(){
 pl=mk(pid,true);en=mk(eid,false);const A=arena();
 pl.x=A.cx-A.rx*.45;pl.y=A.cy+A.ry*.45;en.x=A.cx+A.rx*.45;en.y=A.cy-A.ry*.25;
 proj=[];parts=[];texts=[];rings=[];timeLeft=90;shake=0;hitstop=0;combo=0;maxCombo=0;dmgDone=0;state='intro';
 $('pn').textContent=pl.n;$('en').textContent=en.n;$('end').classList.add('h');
 const big=$('big');$('intro').classList.remove('h');$('isub').innerHTML=`${pl.n} <span style="color:var(--am)">VS</span> ${en.n}`;
 const seq=['3','2','1','FIGHT!'];let i=0;
 (function step(){big.style.animation='none';void big.offsetWidth;big.style.animation='';big.textContent=seq[i];
  AudioManager.play(i<3?'button':'success',.5);i++;
  if(i<seq.length)setTimeout(step,850);else setTimeout(()=>{$('intro').classList.add('h');state='play'},700)})();
}

/* ---------- INPUT ---------- */
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='KeyK')skill();if(e.code==='ShiftLeft'||e.code==='KeyL')dash()});
addEventListener('keyup',e=>K[e.code]=0);
const zone=$('zone'),base=$('base'),knob=$('knob');let sid=null,ox=0,oy=0;
function mvStick(e){let dx=e.clientX-ox,dy=e.clientY-oy;const d=Math.hypot(dx,dy),m=55;if(d>m){dx*=m/d;dy*=m/d}knob.style.transform=`translate(${dx}px,${dy}px)`;stick.x=dx/m;stick.y=dy/m}
zone.addEventListener('pointerdown',e=>{sid=e.pointerId;zone.setPointerCapture(sid);ox=e.clientX;oy=e.clientY;base.style.cssText=`display:block;left:${ox-55}px;top:${oy-55}px`;mvStick(e)});
zone.addEventListener('pointermove',e=>{if(e.pointerId===sid)mvStick(e)});
const endStick=e=>{if(e.pointerId===sid){sid=null;stick.x=stick.y=0;base.style.display='none';knob.style.transform=''}};
zone.addEventListener('pointerup',endStick);zone.addEventListener('pointercancel',endStick);
const press=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();f()});
press('bAk',()=>atkHeld=true);press('bSk',()=>skill());press('bDs',()=>dash());
['pointerup','pointercancel','pointerleave'].forEach(t=>$('bAk').addEventListener(t,()=>atkHeld=false));
$('again').onclick=reset;

/* ---------- AKSI ---------- */
const dmgOf=(a,d,m=1)=>Math.max(4,a*.2*100/(100+d*.6))*m*(.9+Math.random()*.2);
const body=e=>({x:e.x,y:e.y-e.size*.4});
function burst(x,y,col,n=12,sp=240){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.45+Math.random()*.3,m:.7,c:col,s:2+Math.random()*4})}}
function fire(f,t,spread=0,mult=1){const b=body(f),tb=body(t),a=Math.atan2(tb.y-b.y,tb.x-b.x)+spread,s=W*(f.isP?1.15:.8);
 proj.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.max(9,f.size*.09),from:f.isP,col:f.col,dmg:dmgOf(f.atk,t.def,f.isP?mult:.8*mult),l:2});}
function hurt(t,dmg,src,kb=1){
 if(t.inv>0||state!=='play')return false;
 dmg=Math.round(dmg);t.hp=Math.max(0,t.hp-dmg);t.flash=.12;t.inv=.12;
 const dx=t.x-src.x,dy=t.y-src.y,d=Math.hypot(dx,dy)||1;t.kx=dx/d*260*kb;t.ky=dy/d*130*kb;
 const b=body(t);burst(b.x,b.y,src.col,14);
 texts.push({x:b.x,y:b.y-t.size*.3,t:`-${dmg}`,l:.8,c:t.isP?'#ff7b8f':'#ffe27a',s:t.isP?22:20+Math.min(14,dmg/2)});
 shake=Math.max(shake,t.isP?9:6);hitstop=.05;
 if(t.isP){combo=0;pl.ult=Math.min(100,pl.ult+5);vib(40);AudioManager.play('scan',.4)}
 else{combo++;maxCombo=Math.max(maxCombo,combo);dmgDone+=dmg;pl.ult=Math.min(100,pl.ult+8);AudioManager.play('scan',.5)}
 return true}
function atk(){if(pl.cd>0||state!=='play')return;pl.cd=.34;pl.atkT=.2;fire(pl,en);AudioManager.play('button',.35)}
function skill(){if(state!=='play'||pl.ult<100)return;pl.ult=0;pl.atkT=.3;
 rings.push({x:pl.x,y:pl.y,r:10,max:W*.7,c:pl.col,l:.6});AudioManager.play('ultimate',.7);vib([30,40,80]);shake=14;
 setTimeout(()=>{if(state==='play'&&Math.hypot(en.x-pl.x,(en.y-pl.y)*1.6)<W*.72){hurt(en,dmgOf(pl.atk,en.def,3.4),pl,2.4);}},180)}
function dash(){if(pl.dashCd>0||state!=='play')return;let dx=stick.x+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0),dy=stick.y+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);
 if(!dx&&!dy){dx=en.x-pl.x;dy=en.y-pl.y}const d=Math.hypot(dx,dy)||1;pl.dvx=dx/d;pl.dvy=dy/d;pl.dashT=.18;pl.inv=.35;pl.dashCd=1.1;
 burst(pl.x,pl.y-20,'#ffffff',8,160);AudioManager.play('select',.4)}
const spdOf=e=>W*.32*(.7+e.spd/300);

/* ---------- UPDATE ---------- */
function update(dt){
 if(state!=='play')return;
 timeLeft-=dt;
 // PLAYER
 let ix=stick.x+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0),iy=stick.y+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);
 const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
 pl.moving=il>.1;
 if(pl.dashT>0){pl.dashT-=dt;pl.x+=pl.dvx*spdOf(pl)*3.6*dt;pl.y+=pl.dvy*spdOf(pl)*2.2*dt;parts.push({x:pl.x,y:pl.y-pl.size*.3,vx:0,vy:0,l:.25,m:.25,c:pl.col,s:10})}
 else{pl.x+=ix*spdOf(pl)*dt;pl.y+=iy*spdOf(pl)*.6*dt}
 pl.x+=pl.kx*dt;pl.y+=pl.ky*dt;pl.kx*=.88;pl.ky*=.88;
 pl.face=en.x>=pl.x?1:-1;clampE(pl);
 pl.cd-=dt;pl.dashCd-=dt;pl.inv-=dt;pl.flash-=dt;pl.atkT-=dt;
 if(atkHeld||K.Space||K.KeyJ)atk();
 // ENEMY AI
 const a=en.ai,dx=pl.x-en.x,dy=pl.y-en.y,dl=Math.hypot(dx,dy)||1,hard=en.hp<en.max*.5;
 en.face=dx>=0?1:-1;let mx=0,my=0;
 if(en.lunge){const L=en.lunge;L.t-=dt;en.x+=L.vx*dt;en.y+=L.vy*dt*.6;
  if(!L.hit&&Math.hypot(pl.x-en.x,(pl.y-en.y)*1.6)<en.size*.5){L.hit=hurt(pl,dmgOf(en.atk,pl.def,1.1),en,1.6)}
  if(L.t<=0)en.lunge=null}
 else if(en.wind>0){en.wind-=dt;if(en.wind<=0){
   if(en.kind==='lunge'){en.lunge={t:.3,vx:dx/dl*W*1.5,vy:dy/dl*W*1.5,hit:false};AudioManager.play('select',.4)}
   else{fire(en,pl);if(hard){fire(en,pl,.28);fire(en,pl,-.28)}AudioManager.play('button',.35)}
   en.atkT=.2;a.t=(hard?.9:1.3)+Math.random()*1}}
 else{
  const want=W*.3,r=dl>want*1.15?1:dl<want*.7?-1:0,nx=dx/dl,ny=dy/dl;
  mx=nx*r-ny*a.dir*.8;my=ny*r+nx*a.dir*.8;a.t-=dt;
  if(Math.random()<dt*.4)a.dir*=-1;
  if(a.t<=0){en.wind=.55;en.kind=Math.random()<.3?'lunge':'shot'}}
 en.moving=!!(mx||my);
 const es=spdOf(en)*.75;en.x+=mx*es*dt+en.kx*dt;en.y+=my*es*dt*.6+en.ky*dt;en.kx*=.88;en.ky*=.88;clampE(en);
 en.inv-=dt;en.flash-=dt;en.atkT-=dt;
 // PROYEKTIL
 for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;
  parts.push({x:p.x,y:p.y,vx:0,vy:0,l:.2,m:.2,c:p.col,s:p.r*.7});
  const t=p.from?en:pl,b=body(t);
  if(Math.pow((p.x-b.x)/(t.size*.32),2)+Math.pow((p.y-b.y)/(t.size*.4),2)<1&&hurt(t,p.dmg,{x:p.x-p.vx*.01,y:p.y-p.vy*.01,col:p.col},1)){proj.splice(i,1);continue}
  if(p.l<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)proj.splice(i,1)}
 // END
 if(en.hp<=0)finish(true);else if(pl.hp<=0)finish(false);else if(timeLeft<=0)finish(pl.hp/pl.max>=en.hp/en.max);
}
function finish(win){
 state='over';const ratio=pl.hp/pl.max,stars=win?(ratio>.6?3:ratio>.3?2:1):0,exp=win?80+stars*40:20;
 try{const s=JSON.parse(localStorage.getItem('biipbattle-state')||'{}');s.exp=(s.exp||0)+exp;localStorage.setItem('biipbattle-state',JSON.stringify(s))}catch(e){}
 AudioManager.play(win?'success':'error',.7);if(win)burst(en.x,en.y-60,'#ffd75e',40,420);
 setTimeout(()=>{$('rt').textContent=win?'VICTORY':'DEFEAT';$('rt').style.color=win?'var(--gn)':'var(--rd)';
  $('rs').textContent=win?'★'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆';
  $('rx').textContent='+'+exp;$('rh').textContent=Math.round(ratio*100)+'%';$('rc').textContent=maxCombo;$('rd').textContent=dmgDone;
  $('menu').href=`index.html?char=${pid}`;$('end').classList.remove('h')},win?900:500);
}

/* ---------- RENDER ---------- */
function drawBg(){
 if(bg.complete&&bg.naturalWidth){const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),w=bg.naturalWidth*s,h=bg.naturalHeight*s;ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h)}
 else{ctx.fillStyle='#07150e';ctx.fillRect(0,0,W,H)}
}
function drawEnt(e){
 const A=arena(),k=.85+.3*Math.min(1,Math.max(0,(e.y-(A.cy-A.ry))/(A.ry*2))),sz=e.size*k,t=perf/1000;
 const bob=Math.sin(t*(e.moving?11:3.5)+e.ph)*(e.moving?4:2.5)*k;
 let sx=1,sy=1;if(e.atkT>0){const p=e.atkT/.3;sx=1+.18*p;sy=1-.12*p}if(e.wind>0)sy=1+.05*Math.sin(t*50);
 ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(e.x,e.y,sz*.32,sz*.09,0,0,6.283);ctx.fill();
 if(e.wind>0){const p=1-e.wind/.55;ctx.strokeStyle=`rgba(255,84,112,${.3+.5*p})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(e.x,e.y,sz*(.5-.2*p),sz*(.14-.05*p),0,0,6.283);ctx.stroke()}
 if(e.dashT>0)ctx.globalAlpha=.55;
 const im=e.img;ctx.save();ctx.translate(e.x,e.y-3-Math.abs(bob));
 if(e.flash>0)ctx.filter='brightness(2.6)';else if(e.inv>0&&e.isP)ctx.globalAlpha=.7;
 ctx.shadowColor=e.col;ctx.shadowBlur=e.isP?14:10;
 if(im.complete&&im.naturalWidth){const s=sz/Math.max(im.naturalWidth,im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;ctx.scale(e.face*sx,sy);ctx.drawImage(im,-w/2,-h,w,h)}
 else{ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(0,-sz*.4,sz*.3,0,6.283);ctx.fill()}
 ctx.restore();ctx.globalAlpha=1;
 if(!e.isP){const w=sz*.6,x=e.x-w/2,y=e.y-sz-8;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-1,y-1,w+2,7);ctx.fillStyle='#ff5470';ctx.fillRect(x,y,w*e.hp/e.max,5)}
 else{ctx.fillStyle='#4ade80';ctx.beginPath();ctx.moveTo(e.x,e.y+14);ctx.lineTo(e.x-6,e.y+24);ctx.lineTo(e.x+6,e.y+24);ctx.fill()}
}
function draw(dt){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
 drawBg();
 [pl,en].sort((a,b)=>a.y-b.y).forEach(drawEnt);
 for(const p of proj){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.2);g.addColorStop(0,'#fff');g.addColorStop(.35,p.col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.2,0,6.283);ctx.fill()}
 ctx.globalCompositeOperation='lighter';
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*(q.l/q.m+.3),0,6.283);ctx.fill()}
 for(const r of rings){ctx.globalAlpha=r.l/.6;ctx.strokeStyle=r.c;ctx.lineWidth=14*(r.l/.6)+2;ctx.beginPath();ctx.ellipse(r.x,r.y-20,r.r,r.r*.45,0,0,6.283);ctx.stroke()}
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.lineJoin='round';
 for(const t of texts){ctx.globalAlpha=Math.min(1,t.l*2);ctx.font=`900 ${t.s}px Inter,sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y)}
 if(combo>1){ctx.globalAlpha=1;ctx.font='900 18px Inter,sans-serif';ctx.fillStyle='#ffc857';ctx.strokeStyle='#000';ctx.lineWidth=4;const s=`${combo} HIT COMBO`;ctx.strokeText(s,W/2,H*.2);ctx.fillText(s,W/2,H*.2)}
 ctx.restore();ctx.globalAlpha=1;
 const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function fx(dt){
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;if((q.l-=dt)<=0)parts.splice(i,1)}
 for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=50*dt;if((t.l-=dt)<=0)texts.splice(i,1)}
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.max-r.r)*Math.min(1,dt*7);if((r.l-=dt)<=0)rings.splice(i,1)}
 shake=Math.max(0,shake-dt*40);
}
function hud(){
 const pp=Math.round(pl.hp/pl.max*100),ep=Math.round(en.hp/en.max*100),col=p=>p>50?'#22c55e':p>25?'#eab308':'#ef4444';
 $('pf').style.width=$('pl').style.width=pp+'%';$('pf').style.background=col(pp);$('pt').textContent=pp+'%';
 $('ef').style.width=$('el').style.width=ep+'%';$('et').textContent=ep+'%';
 $('pu').style.width=pl.ult+'%';$('bSk').classList.toggle('rdy',pl.ult>=100);
 $('dsc').style.height=Math.max(0,pl.dashCd/1.1)*100+'%';$('tm').textContent=Math.max(0,Math.ceil(timeLeft));
}

/* ---------- LOOP ---------- */
let last=performance.now();
function loop(now){
 let dt=Math.min(.05,(now-last)/1000);last=now;perf=now;
 if(hitstop>0){hitstop-=dt;dt*=.1}
 update(dt);fx(dt);draw(dt);hud();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
