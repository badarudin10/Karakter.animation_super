<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BIIPBATTLE // AUDIO-ENABLED STADIUM</title>
  <style>
    :root {
      --bg: #020604;
      --cyan: #56e9ff;
      --green: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0; background: var(--bg); color: white; font-family: Inter, system-ui, sans-serif;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; height: 100dvh;
    }

    .arena-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 60;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; background: linear-gradient(to bottom, rgba(2,6,4,0.85), transparent);
    }
    .brand-title {
      font-size: 11px; font-weight: 900; letter-spacing: 0.25em; color: #4ade80; text-shadow: 0 0 12px rgba(74,222,128,0.6);
    }
    .header-actions { display: flex; gap: 8px; }
    .action-link-btn {
      background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5;
      padding: 5px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px; backdrop-filter: blur(4px);
    }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 13px; display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(4px);
    }

    #game-container {
      position: relative; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #020604;
    }
    canvas {
      width: 100%; height: 100%; display: block; object-fit: cover;
    }

    .hud-overlay {
      position: absolute; top: 55px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 40;
    }
    .fighter-box {
      background: rgba(6, 18, 12, 0.8); border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 12px; width: 220px; backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .fighter-name { font-size: 11px; font-weight: 900; letter-spacing: 0.1em; margin-bottom: 5px; display: flex; justify-content: space-between; }
    
    .hp-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
    .hp-bar-fill { width: 100%; height: 100%; background: var(--green); transition: width 0.2s ease, background 0.3s ease; box-shadow: 0 0 10px currentColor; }

    .announcement-overlay {
      position: absolute; inset: 0; background: rgba(2, 6, 4, 0.85); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 70; transition: opacity 0.3s;
    }
    .announcement-overlay.hidden { opacity: 0; pointer-events: none; }
    .ann-title { font-size: 52px; font-weight: 950; letter-spacing: 0.15em; color: #fff; text-shadow: 0 0 30px rgba(34,197,94,0.8); margin-bottom: 5px; text-align: center; }
    .ann-sub { font-size: 13px; color: #94a3b8; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; line-height: 1.5; }

    .controls {
      position: absolute; bottom: 20px; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: space-between; padding: 0 24px; box-sizing: border-box; align-items: center;
      pointer-events: none;
    }
    .d-pad, .action-pad { display: flex; gap: 14px; pointer-events: auto; }
    .game-btn {
      width: 64px; height: 64px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%; color: #fff; font-size: 20px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation;
      backdrop-filter: blur(6px); box-shadow: 0 8px 25px rgba(0,0,0,0.6); transition: transform 0.1s, background 0.1s;
    }
    .game-btn:active { background: rgba(34, 197, 94, 0.5); border-color: var(--green); transform: scale(0.9); }
    .btn-action { border-radius: 20px; width: 88px; background: rgba(34, 197, 94, 0.18); border-color: rgba(34, 197, 94, 0.5); color: var(--green); }

    .modal-info {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; place-items: center; z-index: 100; padding: 20px; backdrop-filter: blur(6px);
    }
    .modal-info.show { display: grid; }
    .modal-card { background: #06140e; border: 1px solid var(--green); border-radius: 18px; padding: 22px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .modal-card h3 { margin-top: 0; color: var(--green); letter-spacing: 0.1em; }
    .modal-card p { font-size: 12px; color: #cbd5e1; line-height: 1.6; }
  </style>
</head>
<body>

  <header class="arena-header">
    <div class="brand-title" id="arena-title-header">BIIPBATTLE // STADIUM</div>
    <div class="header-actions">
      <a href="index.html" class="action-link-btn" onclick="AudioManager.stopAll()">🚪 KELUAR</a>
      <button class="icon-btn" id="info-btn" title="Informasi">ℹ️</button>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="hud-overlay">
      <div class="fighter-box" style="border-color: rgba(34,197,94,0.5);">
        <div class="fighter-name">
          <span id="player-name-hud" style="color: var(--green);">PICHU</span>
          <span id="player-hp-txt">100%</span>
        </div>
        <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
      </div>

      <div class="fighter-box" style="border-color: rgba(239,68,68,0.5);">
        <div class="fighter-name">
          <span style="color: var(--danger);">[ ? ] OPPONENT</span>
          <span id="enemy-hp-txt">100%</span>
        </div>
        <div class="hp-bar-bg"><div id="enemy-hp-fill" class="hp-bar-fill" style="background: var(--danger);"></div></div>
      </div>
    </div>

    <div id="announcement" class="announcement-overlay">
      <div id="ann-title" class="ann-title">3</div>
      <div id="ann-sub" class="ann-sub">Mempersiapkan Pertarungan...</div>
    </div>
  </div>

  <div class="controls">
    <div class="d-pad">
      <div class="game-btn" id="btn-left">◀</div>
      <div class="game-btn" id="btn-right">▶</div>
    </div>
    <div class="action-pad">
      <div class="game-btn" id="btn-jump">▲</div>
      <div class="game-btn btn-action" id="btn-attack">ATK</div>
    </div>
  </div>

  <div id="info-modal" class="modal-info">
    <div class="modal-card">
      <h3>PANDUAN KONTROL & AUDIO</h3>
      <p><b>Audio Aktif:</b> Musik latar dan efek suara serangan otomatis menyala saat Anda berinteraksi dengan layar.<br>
      <b>Aturan:</b> Habiskan HP musuh untuk menang dan kembali ke profil!</p>
      <button class="game-btn btn-action" style="margin: 15px auto 0; width: 110px; height: 42px; font-size:12px;" id="close-modal">TUTUP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const urlParams = new URLSearchParams(window.location.search);
    const charKey = urlParams.get('char') || 'pichu';
    const arenaChoice = urlParams.get('arena') || '1';
    
    document.getElementById('arena-title-header').textContent = `BIIPBATTLE // ARENA ${arenaChoice}`;

    const characterNames = {
      pichu: 'PICHU', charmander: 'CHARMANDER', froakie: 'FROAKIE', mew: 'MEW',
      bulbasaur: 'BULBASAUR', squirtle: 'SQUIRTLE', riolu: 'RIOLU', gastly: 'GASTLY',
      rayquaza: 'RAYQUAZA', eevee: 'EEVEE'
    };
    const activePlayerName = characterNames[charKey] || 'PICHU';
    document.getElementById('player-name-hud').textContent = activePlayerName;

    // --- PENGELOLA AUDIO (AUDIO MANAGER) ---
    const AudioManager = {
      cache: new Map(),
      music: null,

      init() {
        this.music = new Audio('assets/audio/background.mp3');
        this.music.loop = true;
        this.music.volume = 0.2;
      },

      play(name, volume = 0.55) {
        try {
          let a = this.cache.get(name);
          if (!a) {
            a = new Audio(`assets/audio/${name}.mp3`);
            this.cache.set(name, a);
          }
          a.currentTime = 0;
          a.volume = volume;
          a.play().catch(() => {});
        } catch (e) {}
      },

      startMusic() {
        if (this.music) {
          this.music.play().catch(() => {});
        }
      },

      stopAll() {
        if (this.music) {
          this.music.pause();
          this.music.currentTime = 0;
        }
        this.cache.forEach(a => {
          a.pause();
          a.currentTime = 0;
        });
      }
    };

    AudioManager.init();

    // Memulai musik latar saat ada interaksi pertama di layar
    document.addEventListener('pointerdown', () => {
      AudioManager.startMusic();
    }, { once: true });

    const arenaBg = new Image();
    arenaBg.src = arenaChoice === '2' ? 'assets/arena-forestbattle-2.png' : 'assets/arena-forest.png';

    const spritePikachu = new Image();
    spritePikachu.src = 'assets/pikachu-spritesheet.png';

    const GRAVITY = 0.55;

    let gameState = 'COUNTDOWN';
    let countdownVal = 3;
    let matchScore = 350;

    const keys = { left: false, right: false, jump: false, attack: false };

    const player = {
      x: 150, y: 0, width: 95, height: 95,
      velocityX: 0, velocityY: 0, speed: 6, jumpPower: -12,
      isGrounded: false, facingRight: true, cooldown: 0,
      hp: 100, maxHp: 100,
      frameX: 0, frameY: 0, maxFrame: 5, staggerFrames: 6, gameFrame: 0
    };

    const enemy = {
      x: 0, y: 0, width: 60, height: 85,
      color: '#ef4444', hp: 100, maxHp: 100, flashTimer: 0, velocityX: 2
    };

    const projectiles = [];

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'ArrowUp') keys.jump = true;
      if (e.code === 'Space') {
        keys.attack = true;
        triggerAttackAction();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'ArrowUp') keys.jump = false;
      if (e.code === 'Space') keys.attack = false;
    });

    function bindTouch(id, keyName, isAction = false) {
      const btn = document.getElementById(id);
      if(!btn) return;
      const activate = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        if(isAction) triggerAttackAction();
      };
      const deactivate = (e) => {
        e.preventDefault();
        keys[keyName] = false;
      };
      btn.addEventListener('touchstart', activate);
      btn.addEventListener('touchend', deactivate);
      btn.addEventListener('mousedown', activate);
      btn.addEventListener('mouseup', deactivate);
    }
    bindTouch('btn-left', 'left'); 
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'jump'); 
    bindTouch('btn-attack', 'attack', true);

    function triggerAttackAction() {
      if (gameState !== 'PLAYING') return;
      if (player.cooldown === 0) {
        // Efek suara serangan / ultimate saat tombol ATK ditekan
        AudioManager.play('ultimate', 0.6);
        projectiles.push({
          x: player.facingRight ? player.x + player.width - 15 : player.x,
          y: player.y + 30, width: 22, height: 14, speedX: player.facingRight ? 14 : -14, isPlayer: true
        });
        player.cooldown = 18;
      }
    }

    document.getElementById('info-btn').onclick = () => document.getElementById('info-modal').classList.add('show');
    document.getElementById('close-modal').onclick = () => document.getElementById('info-modal').classList.remove('show');

    function startCountdown() {
      const ann = document.getElementById('announcement');
      const title = document.getElementById('ann-title');
      const sub = document.getElementById('ann-sub');

      let timer = setInterval(() => {
        countdownVal--;
        if (countdownVal > 0) {
          title.textContent = countdownVal;
          AudioManager.play('button', 0.4);
        } else if (countdownVal === 0) {
          title.textContent = 'FIGHT!';
          sub.textContent = `Pertarungan Arena ${arenaChoice} Dimulai!`;
          AudioManager.play('success', 0.7);
        } else {
          clearInterval(timer);
          ann.classList.add('hidden');
          gameState = 'PLAYING';
        }
      }, 1000);
    }
    startCountdown();

    function updateHPBar(current, max, fillId, txtId) {
      const fillEl = document.getElementById(fillId);
      const txtEl = document.getElementById(txtId);
      const pct = Math.max(0, Math.round((current / max) * 100));
      
      fillEl.style.width = pct + '%';
      txtEl.textContent = pct + '%';

      if (pct > 50) {
        fillEl.style.background = '#22c55e';
      } else if (pct > 25) {
        fillEl.style.background = '#eab308';
      } else {
        fillEl.style.background = '#ef4444';
      }
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      const FLOOR_Y = canvas.height - 120;

      if (keys.left) { player.velocityX = -player.speed; player.facingRight = false; }
      else if (keys.right) { player.velocityX = player.speed; player.facingRight = true; }
      else { player.velocityX = 0; }

      if (keys.jump && player.isGrounded) { 
        player.velocityY = player.jumpPower; 
        player.isGrounded = false; 
        AudioManager.play('button', 0.3);
      }

      player.velocityY += GRAVITY;
      player.x += player.velocityX;
      player.y += player.velocityY;

      if (player.y + player.height >= FLOOR_Y) {
        player.y = FLOOR_Y - player.height; player.velocityY = 0; player.isGrounded = true;
      }
      if (player.x < 50) player.x = 50;
      if (player.x + player.width > canvas.width - 50) player.x = canvas.width - 50 - player.width;

      if (player.cooldown > 0) player.cooldown--;

      if (enemy.x === 0) enemy.x = canvas.width - 200;
      enemy.y = FLOOR_Y - enemy.height;

      enemy.x += enemy.velocityX;
      if (enemy.x <= canvas.width / 2 || enemy.x >= canvas.width - 120) enemy.velocityX *= -1;

      if (keys.attack) { player.frameY = 2; }
      else if (!player.isGrounded) { player.frameY = 1; player.frameX = 3; }
      else if (keys.left || keys.right) { player.frameY = 1; }
      else { player.frameY = 0; }

      if (player.isGrounded || keys.attack) {
        if (player.gameFrame % player.staggerFrames === 0) {
          if (player.frameX < player.maxFrame) player.frameX++;
          else player.frameX = 0;
        }
      }
      player.gameFrame++;

      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.speedX;

        if (p.isPlayer) {
          if (p.x < enemy.x + enemy.width && p.x + p.width > enemy.x && p.y < enemy.y + enemy.height && p.y + p.height > enemy.y) {
            enemy.hp -= 12; 
            enemy.flashTimer = 8; 
            projectiles.splice(i, 1);
            
            // Efek suara ketika musuh terkena serangan
            AudioManager.play('scan', 0.5);
            updateHPBar(enemy.hp, enemy.maxHp, 'enemy-hp-fill', 'enemy-hp-txt');

            if (enemy.hp <= 0) {
              gameState = 'GAMEOVER';
              triggerWinScreen();
            }
            continue;
          }
        }
        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
      }
      if (enemy.flashTimer > 0) enemy.flashTimer--;
    }

    function triggerWinScreen() {
      AudioManager.play('success', 0.8);
      const ann = document.getElementById('announcement');
      const title = document.getElementById('ann-title');
      const sub = document.getElementById('ann-sub');

      ann.classList.remove('hidden');
      title.textContent = 'YOU WIN!';
      sub.innerHTML = `Pertarungan Selesai!<br>Poin Diperoleh: <b style="color:#22c55e;">+${matchScore} PTS</b><br><span style="font-size:11px; color:#56e9ff;">Kembali ke profil utama...</span>`;

      setTimeout(() => {
        AudioManager.stopAll();
        window.location.href = `index.html?char=${charKey}`;
      }, 3000);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (arenaBg.complete && arenaBg.naturalHeight !== 0) {
        ctx.drawImage(arenaBg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#07150e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.save();
      ctx.shadowBlur = enemy.flashTimer > 0 ? 25 : 10;
      ctx.shadowColor = enemy.flashTimer > 0 ? '#fff' : '#ef4444';
      ctx.fillStyle = enemy.flashTimer > 0 ? '#fff' : enemy.color;
      ctx.beginPath();
      ctx.roundRect(enemy.x, enemy.y, enemy.width, enemy.height, [8]);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('[ ? ] BOSS', enemy.x - 4, enemy.y - 10);
      ctx.restore();

      if (spritePikachu.complete && spritePikachu.naturalHeight !== 0) {
        const frameW = spritePikachu.width / 6;  
        const frameH = spritePikachu.height / 3; 
        
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(34, 197, 94, 0.6)';

        if (!player.facingRight) {
          ctx.translate(player.x + player.width, player.y);
          ctx.scale(-1, 1);
          ctx.drawImage(spritePikachu, player.frameX * frameW, player.frameY * frameH, frameW, frameH, 0, 0, player.width, player.height);
        } else {
          ctx.drawImage(spritePikachu, player.frameX * frameW, player.frameY * frameH, frameW, frameH, player.x, player.y, player.width, player.height);
        }
        ctx.restore();
      } else {
        ctx.fillStyle = '#22c55e'; 
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      for (let p of projectiles) {
        ctx.save();
        ctx.fillStyle = '#56e9ff';
        ctx.shadowBlur = 15; ctx.shadowColor = '#56e9ff';
        ctx.beginPath(); ctx.arc(p.x + p.width/2, p.y + p.height/2, p.height * 0.9, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
