<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiipBattle - Karakter Arena</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes dramaticPower {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1) contrast(1); }
            20% { transform: scale(1.2) rotate(-3deg); filter: brightness(1.6) contrast(1.3) drop-shadow(0 0 50px rgba(250, 204, 21, 1)); }
            40% { transform: scale(1.15) rotate(3deg); filter: brightness(1.4) contrast(1.2); }
            60% { transform: scale(1.25) rotate(-2deg); filter: brightness(1.7) contrast(1.4) drop-shadow(0 0 70px rgba(255, 255, 255, 1)); }
            80% { transform: scale(1.15) rotate(2deg); filter: brightness(1.5); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }
        .animate-ultimate {
            animation: dramaticPower 1s ease-in-out infinite;
        }
        @keyframes bgFlash {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        .animate-flash {
            animation: bgFlash 0.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-2xl font-black tracking-wider text-yellow-400 uppercase drop-shadow-md">BiipBattle Arena</h1>
        <p class="text-xs text-slate-400">Pindai kartu atau pilih karakter untuk melihat kekuatan</p>
    </header>

    <!-- Konten Utama (Tampilan Kartu Normal) -->
    <main id="app-container" class="w-full max-w-md flex flex-col items-center bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl my-2 transition-all duration-300">
        
        <!-- Tampilan Karakter -->
        <div class="relative w-48 h-48 flex items-center justify-center mb-6">
            <div id="aura-bg" class="absolute inset-0 bg-yellow-500/20 rounded-full blur-xl animate-pulse transition-all duration-300"></div>
            <img id="char-image" src="" alt="Karakter" class="w-40 h-40 object-contain z-10 transition-all duration-300">
        </div>

        <!-- Informasi Karakter -->
        <div class="text-center mb-6">
            <h2 id="char-name" class="text-2xl font-bold text-yellow-300">Memuat...</h2>
            <p id="char-element" class="text-sm font-semibold text-cyan-400 uppercase tracking-widest mt-1">-</p>
            <p id="char-desc" class="text-xs text-slate-300 mt-2 px-2">-</p>
        </div>

        <!-- Tombol Aksi -->
        <button onclick="triggerUltimate()" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider">
            ⚡ Keluarkan Kekuatan!
        </button>
    </main>

    <!-- Panel Pilihan 10 Karakter -->
    <section class="w-full max-w-md bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 my-2 text-center">
        <p class="text-xs text-slate-400 mb-2 font-semibold">Pilih Kartu Karakter (10 Koleksi):</p>
        <div id="character-list" class="flex flex-wrap justify-center gap-1.5 max-h-32 overflow-y-auto p-1">
            <!-- Tombol 10 karakter dimuat otomatis -->
        </div>
    </section>

    <!-- MODAL LAYAR PENUH (FULLSCREEN BERSIH TANPA TEKS SEPERTI GIFT TIKTOK) -->
    <div id="battle-fullscreen" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md transition-opacity duration-500">
        <!-- Efek Kilatan/Aura Latar Belakang Menyeluruh -->
        <div id="cinematic-aura" class="absolute inset-0 bg-yellow-600/30 blur-3xl animate-flash pointer-events-none"></div>

        <!-- Karakter Beraksi di Tengah Layar (Full Layar Bersih) -->
        <div class="relative z-10 w-full h-full flex items-center justify-center">
            <div class="absolute w-72 h-72 bg-white/15 rounded-full blur-3xl animate-ping pointer-events-none"></div>
            <img id="battle-image" src="" alt="Karakter Ultimate" class="w-72 h-72 sm:w-96 sm:h-96 object-contain animate-ultimate z-20 drop-shadow-[0_0_35px_rgba(255,215,0,0.8)]">
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-500">
        Powered by BiipSite Digital &copy; 2026
    </footer>

    <!-- Logika JavaScript -->
    <script>
        const characters = {
            "pikachu": { name: "Pikachu", element: "Tipe: Petir", desc: "Mengumpulkan energi listrik di kantong pipinya untuk melepaskan sengatan dahsyat.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png", color: "bg-yellow-500/20" },
            "charizard": { name: "Charizard", element: "Tipe: Api/Naga", desc: "Menghembuskan api pijar bersuhu tinggi yang mampu melelehkan batu besar.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png", color: "bg-red-500/20" },
            "greninja": { name: "Greninja", element: "Tipe: Air/Ninja", desc: "Bergerak secepat bayangan dan melempar shuriken air bertekanan tinggi.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/658.png", color: "bg-blue-500/20" },
            "mewtwo": { name: "Mewtwo", element: "Tipe: Psikis", desc: "Memanfaatkan kekuatan psikokinesis tingkat tinggi untuk melumpuhkan musuh.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png", color: "bg-purple-500/20" },
            "bulbasaur": { name: "Bulbasaur", element: "Tipe: Rumput/Racun", desc: "Menggunakan cambuk tanaman dan menyerap energi matahari untuk menyerang.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png", color: "bg-green-500/20" },
            "squirtle": { name: "Squirtle", element: "Tipe: Air", desc: "Menyemburkan air bertekanan tinggi dari dalam cangkangnya ke arah lawan.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png", color: "bg-cyan-500/20" },
            "lucario": { name: "Lucario", element: "Tipe: Bertarung/Baja", desc: "Mendeteksi aura makhluk hidup dan melepaskan gelombang energi bola aura.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/448.png", color: "bg-blue-600/20" },
            "gengar": { name: "Gengar", element: "Tipe: Hantu/Racun", desc: "Bersembunyi di dalam bayangan dan menebar teror malam kepada musuhnya.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png", color: "bg-indigo-500/20" },
            "rayquaza": { name: "Rayquaza", element: "Tipe: Naga/Penerbang", desc: "Penguasa langit yang hidup di lapisan ozon dan mengamuk dengan kekuatan naga.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png", color: "bg-emerald-500/20" },
            "eevee": { name: "Eevee", element: "Tipe: Normal", desc: "Memiliki kode genetik tidak stabil yang memungkinkannya beradaptasi dengan cepat.", image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png", color: "bg-amber-500/20" }
        };

        let activeData = characters["pikachu"];

        function loadCharacter(key) {
            activeData = characters[key] || characters["pikachu"];
            
            document.getElementById('char-name').innerText = activeData.name;
            document.getElementById('char-element').innerText = activeData.element;
            document.getElementById('char-desc').innerText = activeData.desc;
            document.getElementById('char-image').src = activeData.image;
            document.getElementById('aura-bg').className = `absolute inset-0 ${activeData.color} rounded-full blur-xl animate-pulse transition-all duration-300`;
        }

        const charListContainer = document.getElementById('character-list');
        for (let key in characters) {
            const btn = document.createElement('a');
            btn.href = `?char=${key}`;
            btn.className = "px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-lg transition-colors border border-slate-600 capitalize";
            btn.innerText = characters[key].name;
            charListContainer.appendChild(btn);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const charKey = urlParams.get('char') || 'pikachu'; 
        loadCharacter(charKey);

        let countdownTimer = null;

        function triggerUltimate() {
            const modal = document.getElementById('battle-fullscreen');
            const battleImg = document.getElementById('battle-image');
            
            battleImg.src = activeData.image;
            modal.classList.remove('hidden');
            
            let timeLeft = 10; // Durasi 10 detik penuh tanpa teks

            clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    modal.classList.add('hidden'); // Kembali ke tampilan kartu profil semula
                }
            }, 1000);
        }
    </script>
</body>
</html>
