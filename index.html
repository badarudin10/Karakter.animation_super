<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Video Animation</title>
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Tombol Pemicu Animasi -->
    <button onclick="triggerUltimate()" class="px-6 py-3 bg-amber-500 hover:bg-amber-600 font-bold rounded-lg shadow-lg transition">
        Keluarkan Jurus Ultimate
    </button>

    <!-- Modal Fullscreen -->
    <div id="battle-fullscreen" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 cursor-pointer" onclick="closeUltimate()">
        
        <!-- Video tersembunyi (digunakan sebagai sumber data gambar) -->
        <video id="ultimate-video" class="hidden" playsinline muted loop>
            <source src="pikachu-animasi.mp4" type="video/mp4">
            Browser Anda tidak mendukung elemen video.
        </video>

        <!-- Canvas untuk menampilkan hasil video tanpa latar hijau (transparan) -->
        <canvas id="ultimate-canvas" class="max-w-full max-h-full object-contain pointer-events-none"></canvas>

        <p class="absolute bottom-6 text-sm text-slate-400">Klik di mana saja untuk menutup</p>
    </div>

    <script>
        const video = document.getElementById('ultimate-video');
        const canvas = document.getElementById('ultimate-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let animationFrameId = null;

        // Fungsi pemroses transparansi green screen (Chroma Key)
        function renderChromaKey() {
            if (video.paused || video.ended) return;

            // Sesuaikan ukuran canvas dengan resolusi asli video
            if (video.videoWidth && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            // Gambar frame video ke canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Ambil piksel warna
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            const len = data.length;

            // Filter warna hijau agar menjadi transparan
            for (let i = 0; i < len; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // Kondisi deteksi warna hijau
                if (g > 90 && g > r * 1.25 && g > b * 1.25) {
                    data[i + 3] = 0; // Ubah Alpha menjadi 0 (Transparan)
                }
            }

            // Tempelkan kembali piksel yang sudah diproses
            ctx.putImageData(frame, 0, 0);

            // Ulangi proses setiap frame
            animationFrameId = requestAnimationFrame(renderChromaKey);
        }

        // Fungsi Membuka Modal & Memutar Video
        function triggerUltimate() {
            const modal = document.getElementById('battle-fullscreen');
            
            modal.classList.remove('hidden');
            video.currentTime = 0;

            video.play().then(() => {
                renderChromaKey();
            }).catch(err => {
                console.error("Gagal memutar video:", err);
            });
        }

        // Fungsi Menutup Modal & Menghentikan Video
        function closeUltimate() {
            const modal = document.getElementById('battle-fullscreen');
            
            modal.classList.add('hidden');
            video.pause();

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
