<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiipBattle - Karakter Arena</title>
    <!-- Tailwind CSS CDN untuk styling cepat dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Efek kedip atau getar saat jurus dikeluarkan */
        @keyframes powerUp {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .animate-power {
            animation: powerUp 0.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header / Navigasi -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-black tracking-wider text-yellow-400 uppercase drop-shadow-md">BiipBattle Arena</h1>
        <p class="text-xs text-slate-400">Pindai kartu atau pilih karakter untuk melihat kekuatan</p>
    </header>

    <!-- Konten Utama (Dinamis berdasarkan Karakter) -->
    <main id="app-container" class="w-full max-w-md flex flex-col items-center bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl my-auto">
        
        <!-- Tampilan Karakter -->
        <div class="relative w-48 h-48 flex items-center justify-center mb-6">
            <!-- Lingkaran Energi / Aura -->
            <div class="absolute inset-0 bg-yellow-500/20 rounded-full blur-xl animate-pulse"></div>
            
            <!-- Placeholder Gambar / Animasi Karakter -->
            <!-- (Nanti bisa diganti dengan GIF animasi Pokémon / Karakter Anda) -->
            <img id="char-image" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" 
                 alt="Karakter" class="w-40 h-40 object-contain z-10 transition-all duration-300">
        </div>

        <!-- Informasi Karakter -->
        <div class="text-center mb-6">
            <h2 id="char-name" class="text-2xl font-bold text-yellow-300">Pikachu</h2>
            <p id="char-element" class="text-sm font-semibold text-cyan-400 uppercase tracking-widest mt-1">Tipe: Petir (Electric)</p>
            <p id="char-desc" class="text-xs text-slate-300 mt-2 px-4">Mengumpulkan energi listrik di kantong pipinya untuk melepaskan sengatan dahsyat.</p>
        </div>

        <!-- Tombol Aksi / Juru Pamungkas -->
        <button onclick="triggerUltimate()" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider">
            ⚡ Keluarkan Kekuatan!
        </button>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        Powered by BiipSite Digital &copy; 2026
    </footer>

    <!-- Logika JavaScript untuk Sistem Dinamis Karakter -->
    <script>
        // Database Karakter Sederhana (Bisa diperluas banyak karakter)
        const characters = {
            "pikachu": {
                name: "Pikachu",
                element: "Tipe: Petir (Electric)",
                desc: "Mengumpulkan energi listrik di kantong pipinya untuk melepaskan sengatan dahsyat.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
            },
            "charizard": {
                name: "Charizard",
                element: "Tipe: Api/Naga (Fire/Dragon)",
                desc: "Menghembuskan api pijar yang sangat panas, mampu melelehkan batu besar.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png"
            },
            "greninja": {
                name: "Greninja",
                element: "Tipe: Air/Ninja (Water/Dark)",
                desc: "Bergerak secepat bayangan dan melempar shuriken air bertekanan tinggi.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/658.png"
            }
        };

        // Cek URL apakah ada parameter karakter (Contoh: website.com/?char=charizard)
        const urlParams = new URLSearchParams(window.location.search);
        const charKey = urlParams.get('char') || 'pikachu'; // Default ke pikachu jika tidak ada

        // Muat data karakter ke halaman
        if (characters[charKey]) {
            const data = characters[charKey];
            document.getElementById('char-name').innerText = data.name;
            document.getElementById('char-element').innerText = data.element;
            document.getElementById('char-desc').innerText = data.desc;
            document.getElementById('char-image').src = data.image;
        }

        // Fungsi interaktif saat tombol "Keluarkan Kekuatan" ditekan
        function triggerUltimate() {
            const imgElement = document.getElementById('char-image');
            
            // Tambahkan efek animasi jurus
            imgElement.classList.add('animate-power');
            
            // Efek suara atau getar tambahan bisa disisipkan di sini
            alert("🔥 JURUS PAMUNGKAS DIKELUARKAN!");

            // Hentikan efek setelah beberapa detik
            setTimeout(() => {
                imgElement.classList.remove('animate-power');
            }, 1200);
        }
    </script>
</body>
</html>
