<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiipBattle - Karakter Arena</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes powerUp {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.08); filter: brightness(1.4) drop-shadow(0 0 20px rgba(250, 204, 21, 0.9)); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .animate-power {
            animation: powerUp 0.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-2xl font-black tracking-wider text-yellow-400 uppercase drop-shadow-md">BiipBattle Arena</h1>
        <p class="text-xs text-slate-400">Pindai kartu atau pilih karakter untuk melihat kekuatan</p>
    </header>

    <!-- Konten Utama (Dinamis) -->
    <main id="app-container" class="w-full max-w-md flex flex-col items-center bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl my-2">
        
        <!-- Tampilan Karakter -->
        <div class="relative w-48 h-48 flex items-center justify-center mb-6">
            <div id="aura-bg" class="absolute inset-0 bg-yellow-500/20 rounded-full blur-xl animate-pulse transition-all duration-300"></div>
            <img id="char-image" src="" alt="Karakter" class="w-40 h-40 object-contain z-10 transition-all duration-300">
        </div>

        <!-- Informasi Karakter -->
        <div class="text-center mb-6">
            <h2 id="char-name" class="text-2xl font-bold text-yellow-300">Memuat...</h2>
            <p id="char-element" class="text-sm font-semibold text-cyan-400 uppercase tracking-widest mt-1">-</p>
            <p id="char-desc" class="text-xs text-slate-300 mt-2 px-2">-</p>
        </div>

        <!-- Tombol Aksi -->
        <button onclick="triggerUltimate()" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg transition-transform active:scale-95 uppercase tracking-wider">
            ⚡ Keluarkan Kekuatan!
        </button>
    </main>

    <!-- Panel Navigasi / Pilihan Karakter Cepat (Untuk Tes Pengujian) -->
    <section class="w-full max-w-md bg-slate-800/50 border border-slate-700/50 rounded-xl p-4 my-2 text-center">
        <p class="text-xs text-slate-400 mb-3 font-semibold">Ganti Karakter (Simulasi Scan Kartu):</p>
        <div id="character-list" class="flex flex-wrap justify-center gap-2">
            <!-- Tombol karakter akan dimuat secara otomatis oleh JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-3 text-xs text-slate-500">
        Powered by BiipSite Digital &copy; 2026
    </footer>

    <!-- Logika JavaScript -->
    <script>
        // Database Diperluas: Berisi Berbagai Macam Karakter & Atributnya
        const characters = {
            "pikachu": {
                name: "Pikachu",
                element: "Tipe: Petir (Electric)",
                desc: "Mengumpulkan energi listrik di kantong pipinya untuk melepaskan sengatan dahsyat.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png",
                color: "bg-yellow-500/20",
                soundText: "⚡ PIKACHU MENGELUARKAN THUNDERBOLT!"
            },
            "charizard": {
                name: "Charizard",
                element: "Tipe: Api/Naga (Fire/Dragon)",
                desc: "Menghembuskan api pijar bersuhu tinggi yang mampu melelehkan batu besar di medan laga.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png",
                color: "bg-red-500/20",
                soundText: "🔥 CHARIZARD MENGGUNAKAN FLAMETHROWER!"
            },
            "greninja": {
                name: "Greninja",
                element: "Tipe: Air/Ninja (Water/Dark)",
                desc: "Bergerak secepat bayangan dan melempar shuriken air bertekanan tinggi yang tajam.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/658.png",
                color: "bg-blue-500/20",
                soundText: "💧 GRENINJA MELUNCURKAN WATER SHURIKEN!"
            },
            "mewtwo": {
                name: "Mewtwo",
                element: "Tipe: Psikis (Psychic)",
                desc: "Memanfaatkan kekuatan psikokinesis tingkat tinggi untuk melumpuhkan musuh seketika.",
                image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png",
                color: "bg-purple-500/20",
                soundText: "🔮 MEWTWO MELEPASKAN PSYSTRIKE!"
            }
        };

        // Fungsi untuk Memuat Data Karakter ke Halaman
        function loadCharacter(key) {
            const data = characters[key] || characters["pikachu"];
            
            document.getElementById('char-name').innerText = data.name;
            document.getElementById('char-element').innerText = data.element;
            document.getElementById('char-desc').innerText = data.desc;
            document.getElementById('char-image').src = data.image;
            document.getElementById('aura-bg').className = `absolute inset-0 ${data.color} rounded-full blur-xl animate-pulse transition-all duration-300`;
            
            // Simpan state aktif sementara di memori tombol
            window.currentActiveChar = data;
        }

        // Render tombol pilihan karakter secara otomatis di bawah
        const charListContainer = document.getElementById('character-list');
        for (let key in characters) {
            const btn = document.createElement('a');
            // Membuat link parameter dinamis (misal: ?char=charizard)
            btn.href = `?char=${key}`;
            btn.className = "px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-lg transition-colors border border-slate-600 capitalize";
            btn.innerText = characters[key].name;
            charListContainer.appendChild(btn);
        }

        // Cek URL saat halaman dibuka apakah membawa parameter karakter tertentu
        const urlParams = new URLSearchParams(window.location.search);
        const charKey = urlParams.get('char') || 'pikachu'; 
        loadCharacter(charKey);

        // Fungsi interaktif saat tombol kekuatan ditekan
        function triggerUltimate() {
            const imgElement = document.getElementById('char-image');
            const activeData = window.currentActiveChar;
            
            imgElement.classList.add('animate-power');
            alert(activeData.soundText);

            setTimeout(() => {
                imgElement.classList.remove('animate-power');
            }, 600);
        }
    </script>
</body>
</html>
